vinced", "club—convinced"], "answer": 1, "rationale": "Choice B is the best answer. The subject (“The large number…club”) is directly followed by its verb (“convinced”), and no punctuation should separate a subject from its verb, no matter how long the subject is. Choices A, C, and D are incorrect because they place punctuation between the subject and the verb."}, {"key": "3d-2", "label": "3d.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "In the 1960s, primatologist Jane Goodall observed that ______ tools by stripping leaves from twigs and using them to fish for termites.", "choices": ["chimpanzees, made", "chimpanzees: made", "chimpanzees made", "chimpanzees; made"], "answer": 2, "rationale": "Choice C is the best answer. Within the clause “that chimpanzees made tools…termites,” the subject “chimpanzees” is followed directly by the verb “made,” so no punctuation is needed. Choices A, B, and D are incorrect because they separate the subject from its verb."}, {"key": "3d-3", "label": "3d.3", "diff": "Medium", "src": "official", "oid": "403d7bb5", "stem": "According to Naomi Nakayama of the University of Edinburgh, the reason seeds from a dying dandelion appear to float in the air while ______ is that their porous plumes enhance drag, allowing the seeds to stay airborne long enough for the wind to disperse them throughout the surrounding area.", "choices": ["falling,", "falling:", "falling;", "falling"], "answer": 3, "rationale": "Choice D is the best answer. The word “falling” occurs in the middle of a clause and isn’t part of a supplement, so we don’t need any punctuation after it. We can see this more clearly if we simplify the rest of the sentence: “The reason seeds appear to float while falling is that their plumes enhance drag.” . Choice A is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. The word “falling” occurs in the middle of a clause and isn’t part of a supplement, so we don’t need any the subject of the sentence (“the Huntington Library in California”) from its verb (“received”)."}, {"key": "3d-5", "label": "3d.5", "diff": "Medium", "src": "official", "oid": "145d5ca7", "stem": "Gathering accurate data on water flow in the United States is challenging because of the country’s millions of miles of ______ the volume and speed of water at any given location can vary drastically over time.", "choices": ["waterways and the fact that,", "waterways, and the fact that,", "waterways, and, the fact that", "waterways and the fact that"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation within two coordinated noun phrases. When, as in this case, a noun phrase (“the country’s millions of miles of waterways”) is coordinated with another noun phrase (“the fact”) followed by an integrated relative clause (“that the volume...time”), no punctuation is needed. Choice A is incorrect because no punctuation is needed. Choice B is incorrect because no punctuation is needed. Choice C is incorrect because no punctuation is needed."}, {"key": "3d-6", "label": "3d.6", "diff": "Medium", "src": "official", "oid": "cdbbbf94", "stem": "As British scientist Peter Whibberley has observed, “the Earth is not a very good timekeeper.” Earth’s slightly irregular rotation rate means that measurements of time must be periodically adjusted. Specifically, an extra “leap second” (the 86,401st second of the day) is ______ time based on the planet’s rotation lags a full nine-tenths of a second behind time kept by precise atomic clocks.", "choices": ["added, whenever", "added; whenever", "added. Whenever", "added whenever"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation between a verb and a preposition. When, as in this case, a verb (“is added”) is immediately followed by a preposition (“whenever”), no punctuation is needed. Choice A is incorrect because no punctuation is needed between the verb and the preposition. Choice B is incorrect because no punctuation is needed between the verb and the preposition. Choice C is incorrect because no punctuation is needed between the verb and the preposition."}, {"key": "3d-7", "label": "3d.7", "diff": "Hard", "src": "official", "oid": "f868d438", "stem": "In 2018, the innovative works of Congolese sculptor and architect Bodys Isek ______ were featured in City Dreams, a solo exhibition at New York’s Museum of Modern Art.", "choices": ["Kingelez;", "Kingelez,", "Kingelez", "Kingelez:"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is punctuation between a subject and a verb. No punctuation is needed when the subject of a sentence is immediately followed by a main verb. In this case, the sentence’s subject (“the innovative works of Congolese sculptor and architect Bodys Isek Kingelez”) is followed by the main verb “were featured,” and no punctuation should come between them. Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed between the subject and the verb. Choice D is incorrect because no punctuation is needed between the subject and the verb."}, {"key": "3d-8", "label": "3d.8", "diff": "Hard", "src": "official", "oid": "603755a5", "stem": "In 1959, marine biologist Dr. Albert Jones founded the Underwater Adventure Seekers, a scuba diving ______ that is the oldest club for Black divers in the United States and that has helped thousands of diving enthusiasts become certified in the field.", "choices": ["club", "club,", "club—", "club, and"], "answer": 0, "rationale": "Choice A is the best answer. “That is…field” is an essential supplement, so we should not use punctuation to separate it from “scuba diving club.” . Choice B is incorrect. This choice creates a punctuation error. “That is…field” is an essential supplement, so we should not use a comma (or any kind of punctuation) to separate it from “scuba diving club.” . Choice C is incorrect. This choice creates a punctuation error. “That is…field” is an essential supplement, so we should not use a dash (or any kind of punctuation) to separate it from “scuba diving club.” . Choice D is incorrect. This choice creates a run-on sentence. It makes “that is…United States” into an awkward independent clause, but it also makes “that has…field” into its own awkward independent clause without the correct punctuation separating it."}, {"key": "3d-9", "label": "3d.9", "diff": "Hard", "src": "official", "oid": "2fd05c15", "stem": "In crafting her fantasy fiction, Nigerian-born British author Helen Oyeyemi has drawn inspiration from the classic nineteenth-century fairy tales of the Brothers Grimm. Her 2014 novel Boy, Snow, Bird, for instance, is a complex retelling of the story of Snow White, while her 2019 novel ______ offers a delicious twist on the classic tale of Hansel and Gretel.", "choices": ["Gingerbread—", "Gingerbread,", "Gingerbread", "Gingerbread:"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is punctuation between a subject and a verb. When, as in this case, a subject (“her 2019 novel Gingerbread”) is immediately followed by a verb (“offers”), no punctuation is needed. Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed between the subject and the verb. Choice D is incorrect because no punctuation is needed between the subject and the verb."}, {"key": "3d-10", "label": "3d.10", "diff": "Hard", "src": "official", "oid": "6ea8c23f", "stem": "In 2018, a team of researchers led by Dr. Caitlin Whalen compiled every available measurement of ocean mixing rates from the past two decades. With this novel data set, the team was able to determine how current-driven mixing varies across ______ and what impact it has on the distribution of heat and nutrients in the ocean.", "choices": ["regions,", "regions:", "regions;", "regions"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation between coordinates in a sentence. The two elements \"how…regions\" and \"what…ocean\" work together as coordinates to complete the description of what the team was able to determine. Because there are only two coordinates in this case (as opposed to a series of three or more), no punctuation is needed between them. Choice A is incorrect because no punctuation is needed between the coordinates \"how…regions\" and \"what…ocean.\" Choice B is incorrect because no punctuation is needed between the coordinates \"how…regions\" and \"what…ocean.\" Choice C is incorrect because no punctuation is needed between the coordinates \"how…regions\" and \"what…ocean.\""}]}, {"code": "4a", "day": 4, "title": "Subject–verb: find the real subject", "items": [{"key": "4a-1", "label": "4a.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The collection of ancient manuscripts in the library’s basement ______ more than 4,000 documents.", "choices": ["include", "are including", "includes", "have included"], "answer": 2, "rationale": "Choice C is the best answer. The subject is the singular noun “collection,” not “manuscripts” or “basement,” which are parts of prepositional phrases. A singular subject takes the singular verb “includes.” Choices A, B, and D are plural verbs."}, {"key": "4a-2", "label": "4a.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "The paintings that the artist created during her final years in ______ bright, almost electric colors rarely seen in her earlier work.", "choices": ["Paris features", "Paris feature", "Paris has featured", "Paris is featuring"], "answer": 1, "rationale": "Choice B is the best answer. The subject is the plural noun “paintings”; the words between it and the verb (“that the artist…Paris”) describe the paintings. A plural subject takes the plural verb “feature.” Choices A, C, and D are singular verbs that wrongly agree with “Paris” or “artist.”"}, {"key": "4a-3", "label": "4a.3", "diff": "Medium", "src": "official", "oid": "ac7b8d04", "stem": "Tracy Fullerton’s Walden, a game, an unlikely fusion of the writings of nineteenth-century transcendentalist Henry David Thoreau with today’s open-world video games, ______ players to explore a digital version of Walden Pond, the idyllic natural setting featured in Thoreau’s book Walden.", "choices": ["invites", "invite", "are inviting", "have invited"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is subject-verb agreement. The singular verb “invites” agrees in number with the singular subject “Tracy Fullerton’s Walden, a game.” Choice B is incorrect because the plural verb “invite” doesn’t agree in number with the singular subject “Tracy Fullerton’s Walden, a game.” Choice C is incorrect because the plural verb “are inviting” doesn’t agree in number with the singular subject “Tracy Fullerton’s Walden, a game.” Choice D is incorrect because the plural verb “have invited” doesn’t agree in number with the singular subject “Tracy Fullerton’s Walden, a game.”"}, {"key": "4a-4", "label": "4a.4", "diff": "Medium", "src": "official", "oid": "4c06427b", "stem": "Interest in mechanotransduction, the mechanism by which cells sense and convert mechanical stimuli into biochemical signals, is expanding because of innovative work by biomedical scientists—many of whom, like neuroscience and biophysics expert Elba Serrano, ______ this mechanism to better understand how the body’s neurological and biomechanical systems interact.", "choices": ["is studying", "has studied", "study", "studies"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of verb forms within a sentence. The plural verb \"study\" agrees in number with the plural subject \"many.\" Choice A is incorrect because the singular verb \"is studying\" doesn’t agree in number with the plural subject \"many.\" Choice B is incorrect because the singular verb \"has studied\" doesn’t agree in number with the plural subject \"many.\" Choice D is incorrect because the singular verb \"studies\" doesn’t agree in number with the plural subject \"many.\""}, {"key": "4a-5", "label": "4a.5", "diff": "Medium", "src": "official", "oid": "56315bd0", "stem": "Solarpunk is an art movement that imagines renewable energy–powered technology infused complementarily into nature. In Paolo Bacigalupi’s solarpunk short story “Efficiency,” an artificial intelligence that absorbs sustainable energies, redistributing them through intricate networks of weights and generators, ______ Chicago’s energy grid.", "choices": ["have been powering", "power", "powers", "are powering"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb \"powers\" agrees in number with the singular subject \"an artificial intelligence.\" Choice A is incorrect because the plural verb \"have been powering\" doesn’t agree in number with the singular subject \"an artificial intelligence.\" Choice B is incorrect because the plural verb \"power\" doesn’t agree in number with the singular subject \"an artificial intelligence.\" Choice D is incorrect because the plural verb \"are powering\" doesn’t agree in number with the singular subject \"an artificial intelligence.\""}, {"key": "4a-6", "label": "4a.6", "diff": "Medium", "src": "official", "oid": "75f49353", "stem": "The Progressive Era in the United States witnessed the rise of numerous Black women’s clubs, local organizations that advocated for racial and gender equality. Among the clubs’ leaders ______ Josephine St. Pierre Ruffin, founder of the Women’s Era Club of Boston.", "choices": ["was", "were", "are", "have been"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested here is subject-verb agreement. The singular verb “was ttrini, scientists discovered a new species of black coral off the coast of Puerto Rico. Like other black corals, the newly discovered species, which they named Aphanipathes puertoricoensis, has coiled branching structures that ______ it survive in the deep sea.", "choices": ["has helped", "helps", "helping", "help"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of verb forms within a sentence. The plural verb “help” provides the relative clause beginning with “that” with a finite verb and agrees in number with the plural subject “coiled branching structures.” Choice A is incorrect because the singular verb “has helped” doesn’t agree in number with the plural subject “coiled branching structures.” Choice B is incorrect because the singular verb “helps” doesn’t agree in number with the plural subject “coiled branching structures.” Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite participle “helping” doesn’t supply a finite verb to the relative clause beginning with “that.”"}]}, {"code": "4b", "day": 4, "title": "Subject–verb: tricky subjects", "items": [{"key": "4b-1", "label": "4b.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The orchestra ______ its final rehearsal tonight before the season opens.", "choices": ["hold", "are holding", "have held", "holds"], "answer": 3, "rationale": "Choice D is the best answer. “Orchestra” is a collective noun that refers to a single group, so it takes the singular verb “holds.” The singular pronoun “its” confirms this. Choices A, B, and C are plural verbs."}, {"key": "4b-2", "label": "4b.2", "diff": "Easy", "src": "practice", "oid": "", "stem": "Each of the five candidates ______ given ten minutes to present a plan.", "choices": ["were", "was", "are", "have been"], "answer": 1, "rationale": "Choice B is the best answer. The subject is “Each,” which is singular; “of the five candidates” is a prepositional phrase. A singular subject takes the singular verb “was.” Choices A, C, and D are plural verbs."}, {"key": "4b-3", "label": "4b.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "There ______ several reasons why the bridge was closed, including heavy snow and damaged support beams.", "choices": ["was", "is", "were", "has been"], "answer": 2, "rationale": "Choice C is the best answer. In a sentence that begins with “There,” the subject comes after the verb. Here the subject is the plural noun “reasons,” so the plural verb “were” is needed. Choices A, B, and D are singular verbs."}, {"key": "4b-4", "label": "4b.4", "diff": "Medium", "src": "practice", "oid": "", "stem": "The museum’s director and its chief curator ______ the decision to extend the exhibition.", "choices": ["supports", "is supporting", "support", "has supported"], "answer": 2, "rationale": "Choice C is the best answer. Two subjects joined by “and” (“director and…curator”) form a plural subject, which takes the plural verb “support.” Choices A, B, and D are singular verbs."}, {"key": "4b-5", "label": "4b.5", "diff": "Medium", "src": "practice", "oid": "", "stem": "Neither the coach nor the players ______ satisfied with the result of the final match.", "choices": ["was", "is", "has been", "were"], "answer": 3, "rationale": "Choice D is the best answer. When two subjects are joined by “neither…nor,” the verb agrees with the subject closer to it. The closer subject is the plural “players,” so the plural verb “were” is correct. Choices A, B, and C are singular verbs."}, {"key": "4b-6", "label": "4b.6", "diff": "Medium", "src": "practice", "oid": "", "stem": "Among the most surprising findings of the survey ______ the fact that most participants preferred printed books to digital ones.", "choices": ["were", "are", "was", "have been"], "answer": 2, "rationale": "Choice C is the best answer. This sentence is inverted: the subject (“the fact”) comes after the verb. “Fact” is singular, so the singular verb “was” is needed. Choices A, B, and D are plural verbs that wrongly agree with “findings,” which is part of the introductory prepositional phrase."}, {"key": "4b-7", "label": "4b.7", "diff": "Medium", "src": "official", "oid": "003f22c8", "stem": "Every last second of space shuttle mission STS-79, which lasted ten days and three hours, ______ carefully monitored by a team of experts.", "choices": ["have been", "are", "was", "were"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb \"was\" agrees in number with the singular subject \"every last second.\" Choice A is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"every last second.\" Choice B is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"every last second.\" Choice D is incorrect because the plural verb \"were\" doesn’t agree in number with the singular subject \"every last second.\""}, {"key": "4b-8", "label": "4b.8", "diff": "Medium", "src": "official", "oid": "28166dc6", "stem": "In knot theory (the mathematical study of curved, closed loops), knots are characterized by their crossing numbers—that is, the number of times the knotted thread crosses over itself. The trefoil knot and the figure-eight knot, each with a crossing number below five, ______ among the simplest possible knots with the fewest number of crossings.", "choices": ["was", "are", "has been", "is"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is subject-verb agreement. The plural verb \"are\" agrees in number with the plural compound subject \"the trefoil knot and the figure-eight knot.\" The two types of knots joined by \"and\" function as a plural subject and thus require a plural verb. Choice A is incorrect because the singular verb \"was\" doesn’t agree in number with the plural compound subject \"the trefoil knot and the figure-eight knot.\" Choice C is incorrect because the singular verb \"has been\" doesn’t agree in number with the plural compound subject \"the trefoil knot and the figure-eight knot.\" Choice D is incorrect because the singular verb \"is\" doesn’t agree in number with the plural compound subject \"the trefoil knot and the figure-eight knot.\""}, {"key": "4b-9", "label": "4b.9", "diff": "Hard", "src": "official", "oid": "5fd86f4b", "stem": "The ghazal, a poetic form originating in seventh-century Arabic poetry, has an intricate structure. The twentieth-century Kashmiri American poet Agha Shahid Ali explains that each one of a ghazal’s couplets, while adhering to the patterns of rhyme (qafia) and refrain (radif) established in the poem’s opening lines (matla), ______ thematically and logically autonomous, resulting in a poem with “a stringently formal disunity.”", "choices": ["is", "were", "have been", "are"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The singular verb \"is\" agrees in number with the singular subject \"each one of a ghazal’s couplets.\" While the prepositional phrase \"of a ghazal’s couplets\" within the subject contains a plural noun, the head of the subject (\"each one\") is singular, indicating that each individual couplet (not the couplets as a group) is \"thematically and logically autonomous,\" or self-standing. Choice B is incorrect because the plural verb \"were\" doesn’t agree in number with the singular subject \"each one of a ghazal’s couplets.\" Choice C is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"each one of a ghazal’s couplets.\" Choice D is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"each one of a ghazal’s couplets.\""}, {"key": "4b-10", "label": "4b.10", "diff": "Hard", "src": "official", "oid": "0fe5ce68", "stem": "Ten of William Shakespeare’s plays are classified as histories. Although each one of these plays, which include Henry V and Richard III, ______ on a single historical figure (specifically, an English king), some, such as Henry VI Part One and Henry VI Part Two, feature different episodes from the same monarch’s life.", "choices": ["focuses", "focus", "are focused", "were focused"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is subject-verb agreement. The singular verb “focuses” agrees in number with the singular subject “each one of these plays.” While the prepositional phrase “of these plays” within the subject contains a plural noun, the head of the subject (“each one”) is singular, indicating that each individual play focuses on a single historical figure. Choice B is incorrect because the plural verb “focus” doesn’t agree in number with the singular subject “each one of these plays.” Choice C is incorrect because the plural verb “are focused” doesn’t agree in number with the singular subject “each one of these plays.” Choice D is incorrect because the plural verb “were focused” doesn’t agree in number with the singular subject “each one of these plays.”"}]}, {"code": "5a", "day": 5, "title": "Pronoun agreement", "items": [{"key": "5a-1", "label": "5a.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The company announced that ______ would open three new factories in Uzbekistan next year.", "choices": ["they", "these", "it", "one"], "answer": 2, "rationale": "Choice C is the best answer. The pronoun refers to “The company,” which is a singular noun, so the singular pronoun “it” is correct. Choice A is incorrect because “they” is plural. Choices B and D don’t clearly refer to “the company.”"}, {"key": "5a-2", "label": "5a.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "Sea turtles often return to the beaches where they hatched, and scientists believe ______ navigate by sensing Earth’s magnetic field.", "choices": ["it", "they", "this", "one"], "answer": 1, "rationale": "Choice B is the best answer. The pronoun refers to “Sea turtles,” which is plural, so the plural pronoun “they” is correct. Choices A, C, and D are singular and don’t agree with “Sea turtles.”"}, {"key": "5a-3", "label": "5a.3", "diff": "Medium", "src": "official", "oid": "b85c19ed", "stem": "The violins handmade in the seventeenth century by Italian craftsman Antonio Stradivari have been celebrated as some of the finest in the world. In close collaboration with musicians, Stradivari introduced changes to the shape of a traditional violin, flattening some of the instrument’s curves and making ______ lighter overall.", "choices": ["those", "one", "them", "it"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is pronoun–antecedent agreement. The singular pronoun “it” agrees in number with the singular antecedent “violin” and thus indicates that the traditional violin (and not its curves) was made lighter. Choice A is incorrect because the plural pronoun “those” doesn’t agree in number with the singular antecedent “violin.” Choice B is incorrect because the singular pronoun “one” is ambiguous in this context; the resulting sentence leaves unclear what Stradivari made lighter. Choice C is incorrect because the plural pronoun “them” doesn’t agree in number with the singular antecedent “violin.”"}, {"key": "5a-4", "label": "5a.4", "diff": "Medium", "src": "official", "oid": "36944347", "stem": "Official measurements of the Mississippi River’s length vary: according to the US Geological Survey, the river is 2,300 miles long, whereas the Environmental Protection Agency records its length as 2,320 miles. This disparity can be explained in part by the fact that rivers such as the Mississippi expand and contract as ______ sediment.", "choices": ["they accumulate", "one accumulates", "it accumulates", "we accumulate"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is pronoun-antecedent agreement. The plural pronoun “they” agrees in number with the plural antecedent “rivers” and clearly expresses the general statement that rivers expand and contract as they accumulate sediment. Secondarily, the plural verb “accumulate” agrees in number with the plural pronoun and its plural antecedent. Choice B is incorrect because the singular pronoun “one” doesn’t agree in number with the plural antecedent “rivers.” Choice C is incorrect because the singular pronoun “it” doesn’t agree in number with the plural antecedent “rivers.” Choice D is incorrect because the use of the personal pronoun “we” is illogical in this context; it suggests that a group of people (including the speaker) accumulate sediment, which doesn’t make sense."}, {"key": "5a-5", "label": "5a.5", "diff": "Medium", "src": "official", "oid": "3595a991", "stem": "In 1930, Japanese American artist Chiura Obata depicted the natural beauty of Yosemite National Park in two memorable woodcuts: Evening at Carl Inn and Lake Basin in the High Sierra. In 2019, ______ exhibited alongside 150 of Obata’s other works in a single-artist show at the Smithsonian American Art Museum.", "choices": ["it was", "they were", "this was", "some were"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is pronoun–antecedent agreement. The plural pronoun “they” agrees in number with the plural antecedent “woodcuts” and clearly identifies what was exhibited at the Smithsonian American Art Museum. Choice A is incorrect because the singular pronoun “it” doesn’t agree in number with the plural antecedent “woodcuts.” Choice C is incorrect because the singular pronoun “this” doesn’t agree in number with the plural antecedent “woodcuts.” Choice D is incorrect because the plural pronoun “some” is illogical in this context (referring to “some” of two woodcuts)."}, {"key": "5a-6", "label": "5a.6", "diff": "Hard", "src": "official", "oid": "3bceeb93", "stem": "When they were first discovered in Australia in 1798, duck-billed, beaver-tailed platypuses so defied categorization that one scientist assigned them the name Ornithorhynchus paradoxus: “paradoxical bird-snout.” The animal, which lays eggs but also nurses ______ young with milk, has since been classified as belonging to the monotremes group.", "choices": ["they’re", "their", "its", "it’s"], "answer": 2, "rationale": "Choice C is the best answer. The singular possessive pronoun \"its\" agrees with the singular antecedent \"the animal\" and indicates that the \"young\" belong to it. Choice A is incorrect. This choice creates a pronoun-antecedent agreement error. \"They’re\" is a contraction of \"they are,\" a plural pronoun and verb, but the antecedent \"the animal\" is singular. Also, we don’t need the extra verb \"are\" — we already have a main verb in this clause, so adding \"are\" would be confusing and ungrammatical. Choice B is incorrect. This choice creates a pronoun-antecedent agreement error. \"Their\" is a plural pronoun, but the subject of the sentence is \"the animal,\" a singular noun. Choice D is incorrect. This choice creates a confusing and ungrammatical sentence. \"It’s\" is a contraction for \"it is.\" We already have the verb \"nurses\" in this clause, so we shouldn’t add the verb \"is.\""}, {"key": "5a-7", "label": "5a.7", "diff": "Hard", "src": "official", "oid": "908a76b8", "stem": "When a given industry—water and electricity are two well-known examples—carries high infrastructural start-up costs and other barriers that discourage competition, ______ of just one or two suppliers per municipality. Such industries are known as natural monopolies.", "choices": ["these often consist", "they often consist", "it often consists", "this often consists"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"industry\" and clearly indicates that the industry consists of just one or two suppliers per municipality. Choice A is incorrect. The plural pronoun \"these\" neither agrees in number with the singular antecedent \"industry\" nor clearly indicates that the industry—not another plural noun in the sentence, such as \"start-up costs\" or \"barriers\"—consists of just one or two suppliers per municipality. Choice B is incorrect because the plural pronoun \"they\" doesn’t agree in number with the singular antecedent \"industry.\" Choice D is incorrect because the singular pronoun \"this\" is ambiguous in this context; the resulting sentence leaves unclear what consists of just one or two suppliers per municipality."}, {"key": "5a-8", "label": "5a.8", "diff": "Hard", "src": "official", "oid": "99dedf36", "stem": "When a given term—“self-fulfilling prophecies” and “role models” are two well-known examples—is generally accepted and frequently used, ______ susceptible to obliteration by incorporation (OBI). In cases of OBI, widely used terms are rarely, if at all, attributed to the individuals who coined them.", "choices": ["they often become", "these often become", "this often becomes", "it often becomes"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun “it” agrees in number with the singular antecedent “a given term” and clearly indicates that the term becomes susceptible to obliteration by incorporation. Choice A is incorrect because the plural pronoun “they” neither agrees in number with the singular antecedent “a given term” nor clearly indicates that the given term—not another plural noun in the sentence, such as “examples”—becomes susceptible to obliteration by incorporation. Choice B is incorrect because the plural pronoun “these” neither agrees in number with the singular antecedent “a given term” nor clearly indicates that the given term—not another plural noun in the sentence, such as “examples”—becomes susceptible to obliteration by incorporation. Choice C is incorrect because the singular pronoun “this” is ambiguous in this context, leaving unclear what exactly becomes susceptible to obliteration by incorporation."}]}, {"code": "5b", "day": 5, "title": "its / it’s · their / they’re", "items": [{"key": "5b-1", "label": "5b.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The city of Bukhara is famous for ______ well-preserved medieval architecture.", "choices": ["it’s", "their", "its", "they’re"], "answer": 2, "rationale": "Choice C is the best answer. The architecture belongs to the city, a singular noun, so the singular possessive determiner “its” is correct. Choice A is incorrect because “it’s” means “it is.” Choices B and D are plural forms, and “they’re” means “they are.”"}, {"key": "5b-2", "label": "5b.2", "diff": "Easy", "src": "practice", "oid": "", "stem": "Many of the students said ______ planning to apply to engineering programs abroad.", "choices": ["their", "they’re", "there", "its"], "answer": 1, "rationale": "Choice B is the best answer. The sentence needs a subject and a verb: “they are planning.” The contraction “they’re” means “they are.” Choice A is a possessive (“belonging to them”), Choice C refers to a place, and Choice D is a singular possessive."}, {"key": "5b-3", "label": "5b.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "The giant panda spends up to fourteen hours a day eating, since bamboo provides very little energy for an animal of ______ size.", "choices": ["it’s", "their", "they’re", "its"], "answer": 3, "rationale": "Choice D is the best answer. The size belongs to the giant panda, a singular noun, so the singular possessive “its” is correct. Choice A means “it is.” Choice B is plural. Choice C means “they are.”"}, {"key": "5b-4", "label": "5b.4", "diff": "Medium", "src": "official", "oid": "2c49940e", "stem": "French philosopher René Descartes doubted whether he could prove his own existence. Eventually, he found proof in his famous phrase “I think, therefore I am.” The ______ complexity: only those who exist would be able to ponder their existence.", "choices": ["phrases’ simplicity masks its", "phrases simplicity masks their", "phrase’s simplicity masks their", "phrase’s simplicity masks its"], "answer": 3, "rationale": "Choice D is the best answer. The conventions being tested are the use of possessive nouns and the use of possessive determiners. The singular possessive noun \"phrase’s\" correctly indicates that there is only one simple phrase. The singular possessive determiner \"its\" agrees in number with the singular possessive noun \"phrase’s,\" reinforcing the idea that there is only one simple yet complex phrase. Choice A is incorrect because the context requires the singular possessive noun \"phrase’s,\" not the plural possessive noun \"phrases’.\" Choice B is incorrect because the context requires the singular possessive noun \"phrase’s\" and the corresponding singular possessive determiner \"its,\" not the plural noun \"phrases\" and the corresponding plural possessive determiner \"their.\" Choice C is incorrect because the context requires the singular possessive determiner \"its,\" not the plural possessive determiner \"their.\""}, {"key": "5b-5", "label": "5b.5", "diff": "Medium", "src": "official", "oid": "eeb14722", "stem": "The soundtrack to Mira Nair’s 1991 film Mississippi Masala expressively captures the clashing of cultures that happens when ______ (a young Indian woman from Uganda and a young African American man from Mississippi) meet. Featured throughout the film are songs from Uganda’s Afrigo Band, the Indian composer L. Subramaniam, and the Mississippi blues musician Sam Chatmon.", "choices": ["it’s two protagonists", "its two protagonist’s", "it’s two protagonist’s", "its two protagonists"], "answer": 3, "rationale": "Choice D is the best answer. The conventions being tested are the use of possessive determiners and the use of plural nouns. The singular possessive determiner \"its\"—which agrees in number with the singular noun phrase \"Mira Nair’s 1991 film Mississippi Masala\"—and the plural noun \"protagonists\" correctly indicate that Nair’s film has multiple protagonists. Choice A is incorrect because \"it’s\" is the contraction for \"it is,\" not a possessive determiner. Choice B is incorrect because the context requires the plural noun \"protagonists,\" not the singular possessive noun \"protagonist’s.\" Choice C is incorrect because the context requires the possessive determiner \"its\" and the plural noun \"protagonists,\" not the contraction \"it’s\" or the singular possessive noun \"protagonist’s.\""}, {"key": "5b-6", "label": "5b.6", "diff": "Hard", "src": "official", "oid": "0bcb4417", "stem": "Oglala Lakota poet Layli Long Soldier’s star quilt poems offer an unusually open-ended reading experience. With ______ eight panels of text stitched together in the shape of a traditional eight-pointed Lakota star quilt, the poems present viewers with a seemingly infinite number of ways to read them.", "choices": ["their", "it’s", "they’re", "its"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of possessive determiners. The plural possessive determiner \"their\" agrees in number with the plural noun \"the poems,\" thus indicating that the poems had eight panels of text stitched together in the shape of a traditional eight-pointed Lakota star quilt. Choice B is incorrect because \"it’s\" is the contraction for \"it is\" or \"it has,\" not a possessive determiner. Choice C is incorrect because \"they’re\" is the contraction for \"they are,\" not a possessive determiner. Choice D is incorrect because the singular possessive determiner \"its\" doesn’t agree in number with the plural noun \"the poems.\""}, {"key": "5b-7", "label": "5b.7", "diff": "Hard", "src": "official", "oid": "872a002e", "stem": "The present-day city of Dushanbe, Tajikistan, was for years the capital of the Tajik Autonomous Soviet Socialist Republic, one of many nominally autonomous republics within the Soviet Union. Like ______ peer autonomous Soviet socialist republics, the Tajik Republic was established along ethnolinguistic lines: most of the republic’s residents spoke Persian.", "choices": ["their", "they’re", "its", "it’s"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of possessive determiners. The singular possessive determiner \"its\" agrees in number with the singular subject \"the Tajik Republic\" and thus indicates that the other republics were its peers. Choice A is incorrect because the plural possessive determiner \"their\" doesn’t agree in number with the singular subject \"the Tajik Republic.\" Choice B is incorrect because \"they’re\" is the contraction for \"they are,\" not a possessive determiner. Choice D is incorrect because \"it’s\" is the contraction for \"it is\" or \"it has,\" not a possessive determiner."}, {"key": "5b-8", "label": "5b.8", "diff": "Hard", "src": "official", "oid": "18382e67", "stem": "In Marisol’s 1968 sculpture Mi Mama y Yo, gone are the types of pop culture references that made the Parisian-born Venezuelan American artist a star at the height of the pop art movement. In ______ place is a far more personal subject: a sculptural depiction of the artist as a young girl with her mother.", "choices": ["its", "they’re", "their", "it’s"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of possessive determiners. The plural possessive determiner \"their\" agrees in number with the plural noun \"types\" and thus indicates that the more personal subject matter of Marisol’s 1968 sculpture takes the place of those types of pop culture references that made Marisol a star. Choice A is incorrect because the singular possessive determiner \"its\" doesn’t agree in number with the plural noun \"types.\" Choice B is incorrect because \"they’re\" is the contraction for \"they are,\" not a possessive determiner. Choice D is incorrect because \"it’s\" is the contraction for \"it is\" or \"it has,\" not a possessive determiner."}]}, {"code": "5c", "day": 5, "title": "Plural vs possessive nouns", "items": [{"key": "5c-1", "label": "5c.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "A ______ wings can beat up to eighty times per second.", "choices": ["hummingbirds", "hummingbird’s", "hummingbirds’", "hummingbirds’s"], "answer": 1, "rationale": "Choice B is the best answer. The article “A” shows that the noun is singular, and the wings belong to the hummingbird, so the singular possessive “hummingbird’s” is needed. Choice A is a plural with no possession. Choice C is plural possessive, which doesn’t fit “A.” Choice D is not a correct form."}, {"key": "5c-2", "label": "5c.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "The three ______ reports, published over a period of ten years, show a steady rise in the region’s average temperature.", "choices": ["scientist’s", "scientists", "scientists’", "scientists’s"], "answer": 2, "rationale": "Choice C is the best answer. “Three” shows there are several scientists, and the reports belong to them, so the plural possessive “scientists’” is needed. Choice A is singular possessive. Choice B is plural but shows no possession. Choice D is not a correct form."}, {"key": "5c-3", "label": "5c.3", "diff": "Medium", "src": "official", "oid": "9f737b2a", "stem": "In Death Valley National Park’s Racetrack Playa, a flat, dry lakebed, are 162 rocks—some weighing less than a pound but others almost 700 pounds—that move periodically from place to place, seemingly of their own volition. Racetrack-like trails in the ______ mysterious migration.", "choices": ["playas sediment mark the rock’s", "playa’s sediment mark the rocks", "playa’s sediment mark the rocks’", "playas’ sediment mark the rocks’"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of plural and possessive nouns. The singular possessive noun “playa’s” and the plural possessive noun “rocks’” correctly indicate that the sediment is that of one playa (the Racetrack Playa) and that there are multiple rocks that have mysteriously migrated across the sediment. Choice A is incorrect because the context requires the singular possessive noun “playa’s” and the plural possessive noun “rocks’,” not the plural noun “playas” and the singular possessive noun “rock’s.” Choice B is incorrect because the context requires the plural possessive noun “rocks’,” not the plural noun “rocks.” Choice D is incorrect because the context requires the singular possessive noun “playa’s,” not the plural possessive noun “playas’.”"}, {"key": "5c-4", "label": "5c.4", "diff": "Medium", "src": "official", "oid": "8d53e7a0", "stem": "Slam poet Elizabeth Acevedo’s debut novel The Poet X, winner of the 2018 National Book Award for Young People’s Literature, is composed of ______ protagonist, fifteen-year-old Xiomara Batista.", "choices": ["poems putatively written by the novel’s", "poem’s putatively written by the novel’s", "poem’s putatively written by the novels’", "poems putatively written by the novels’"], "answer": 0, "rationale": "Choice A is the best answer. Nothing belongs to the “poems” in the sentence, so it should not be possessive—just a simple plural noun. The protagonist does belong to the novel—it’s the protagonist of the novel—so “novel” needs to be a singular possessive noun. Choice B is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This choice uses the singular possessive “poem’s,” but the text indicates that it should be the simple plural “poems”: there is more than one poem, and nothing belongs to the poems. Choice C is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This choice uses the singular possessive “poem’s,” but the text indicates that it should be the simple plural “poems”: there is more than one poem, and nothing belongs to the poems. This choice also uses the plural possessive “novels’,” which is incorrect because there is only one novel. Choice D is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This choice uses the plural possessive “novels’,” which is incorrect because there is only one novel, so it should be the singular possessive “novel’s.” ."}, {"key": "5c-5", "label": "5c.5", "diff": "Medium", "src": "official", "oid": "f570cece", "stem": "Both Arteaga, in the state of Coahuila, and Lagos de Moreno, in the state of Jalisco, have been designated by Mexico as pueblos mágicos (magical villages) to celebrate these ______ natural beauty and unique cultural traditions.", "choices": ["town", "town’s", "towns", "towns’"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of possessive nouns. The plural possessive noun “towns’” correctly indicates that the natural beauty and unique cultural traditions belong to both Arteaga and Lagos de Moreno. Choice A is incorrect because the context requires the plural possessive noun “towns’,” not the singular noun “town.” Choice B is incorrect because the context requires the plural possessive noun “towns’,” not the singular possessive noun “town’s.” Choice C is incorrect because the context requires the plural possessive noun “towns’,” not the plural noun “towns.”"}, {"key": "5c-6", "label": "5c.6", "diff": "Medium", "src": "official", "oid": "dd428136", "stem": "Cheng Dang and her colleagues at the University of Washington recently ran simulations to determine the extent to which individual snow ______ affect the amount of light reflecting off a snowy surface.", "choices": ["grain’s physical properties’", "grains’ physical properties", "grains’ physical property’s", "grains physical properties"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of plural and possessive nouns. The plural possessive noun “grains’” and the plural noun “properties” correctly indicate that the simulations involved multiple snow grains and that those snow grains had several properties. Choice A is incorrect because the context requires the plural possessive noun “grains’” and the plural noun “properties,” not the singular possessive noun “grain’s” and the plural possessive noun “properties’.” Choice C is incorrect because the context requires the plural noun “properties,” not the singular possessive noun “property’s.” Choice D is incorrect because the context requires the plural possessive noun “grains’,” not the plural noun “grains.”"}, {"key": "5c-7", "label": "5c.7", "diff": "Medium", "src": "official", "oid": "20ea68b7", "stem": "It can take time for proposed amendments to the US Constitution to become law. For example, the Twenty-Second Amendment, which limits the number of ______ can serve, was first proposed in 1947 but wasn’t approved by the required three-fourths majority of state legislatures until 1951.", "choices": ["terms presidents", "term’s presidents", "term’s president’s", "terms president’s"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of plural nouns. The plural nouns \"terms\" and \"presidents\" correctly indicate that the amendment involves multiple terms and applies to presidents in general. Choice B is incorrect because the context requires the plural noun \"terms,\" not the singular possessive noun \"term’s.\" Choice C is incorrect because the context requires the plural nouns \"terms\" and \"presidents,\" not the singular possessive nouns \"term’s\" and \"president’s.\" Choice D is incorrect because the context requires the plural noun \"presidents,\" not the singular possessive noun \"president’s.\""}, {"key": "5c-8", "label": "5c.8", "diff": "Hard", "src": "official", "oid": "2784cbaf", "stem": "To fully describe the motion of an object requires knowing each of five ______ movement: displacement, time, initial velocity, final velocity, and acceleration. These are called kinematic variables.", "choices": ["variable’s that characterize objects’", "variables that characterize objects’", "variables that characterize object’s", "variables that characterize objects"], "answer": 1, "rationale": "Choice B is the best answer. The conventions being tested are the use of plural and possessive nouns. The plural noun \"variables\" correctly indicates that there are multiple variables, and the plural possessive noun \"objects’\" correctly indicates that the movement of objects in general is being discussed. Choice A is incorrect because the context requires the plural noun \"variables,\" not the singular possessive noun \"variable’s.\" Choice C is incorrect because the context requires the plural possessive noun \"objects’,\" not the singular possessive noun \"object’s.\" Choice D is incorrect because the context requires the plural possessive noun \"objects’,\" not the plural noun \"objects.\""}, {"key": "5c-9", "label": "5c.9", "diff": "Hard", "src": "official", "oid": "4c335aea", "stem": "In a recent analysis of lyrical trends in 350,000 songs, researchers cite increases in certain measures, such as the ratio of choruses to verses, as evidence music lyrics are becoming more repetitive. For instance, from 1970 to 2020, ______ chorus-to-verse ratios trended similarly, with each genre’s data indicating that relative to the number of unique verses, the number of repeated choruses in songs increased.", "choices": ["rocks and raps", "rock’s and rap’s", "rocks and rap’s", "rock and rap’s"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of possessive nouns. The singular possessive nouns \"rock’s\" and \"rap’s\" correctly indicate that the chorus-to-verse ratios belong to the genres of rock and rap. Choice A is incorrect because the context requires the singular possessive nouns \"rock’s\" and \"rap’s,\" not the plural nouns \"rocks\" and \"raps.\" Choice C is incorrect because the context requires the singular possessive noun \"rock’s,\" not the plural noun \"rocks.\" Choice D is incorrect because the context requires the singular possessive noun \"rock’s,\" not the singular noun \"rock.\" This choice incorrectly suggests that there was a single chorus-to-verse ratio for rock and rap together, whereas the ratio was calculated for each genre individually."}]}, {"code": "6a", "day": 6, "title": "Verb tense", "items": [{"key": "6a-1", "label": "6a.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "In 1969, the Apollo 11 mission ______ the first humans on the Moon.", "choices": ["lands", "will land", "landed", "has landed"], "answer": 2, "rationale": "Choice C is the best answer. The phrase “In 1969” shows a completed action in the past, so the simple past tense “landed” is correct. Choices A, B, and D are present, future, and present perfect forms that don’t fit a specific past date."}, {"key": "6a-2", "label": "6a.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "By the time the rescue team arrived, the hikers ______ for nearly two days without food.", "choices": ["had waited", "wait", "will have waited", "are waiting"], "answer": 0, "rationale": "Choice A is the best answer. The waiting happened before another past action (“the rescue team arrived”), so the past perfect “had waited” is correct. Choices B, C, and D are present or future forms that don’t fit the past context."}, {"key": "6a-3", "label": "6a.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "Since 2015, the city ______ more than 500 kilometers of new bicycle lanes.", "choices": ["built", "has built", "builds", "had built"], "answer": 1, "rationale": "Choice B is the best answer. “Since 2015” describes an action that began in the past and continues to the present, which calls for the present perfect “has built.” Choice A (simple past) doesn’t connect the action to the present. Choice C is simple present. Choice D (past perfect) needs a later past event as a reference point."}, {"key": "6a-4", "label": "6a.4", "diff": "Medium", "src": "official", "oid": "4f2ff5f2", "stem": "Tortoises can be found in many works of literature. For example, in Tom Stoppard’s 1993 play Arcadia, there is a tortoise that ______ by two names (Plautus and Lightning) and appears in both of the play’s parallel timelines. As a character, the tortoise symbolizes the connection between the past and present.", "choices": ["goes", "will have gone", "went", "had gone"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the present tense verb \"goes\" is consistent with the other present tense verbs (\"appears\" and \"symbolizes\") used to describe the tortoise in Stoppard’s play. Furthermore, it’s conventional to use the present tense when discussing a literary work. Choice B is incorrect because the future perfect tense verb \"will have gone\" isn’t consistent with the other present tense verbs used to describe the tortoise in Stoppard’s play. Choice C is incorrect because the past tense verb \"went\" isn’t consistent with the other present tense verbs used to describe the tortoise in Stoppard’s play. Choice D is incorrect because the past perfect tense verb \"had gone\" isn’t consistent with the other present tense verbs used to describe the tortoise in Stoppard’s play."}, {"key": "6a-5", "label": "6a.5", "diff": "Medium", "src": "official", "oid": "1f8cd95f", "stem": "In the 1950s, a man named Joseph McVicker was struggling to keep his business afloat when his sister-in-law Kay Zufall advised him to repurpose the company’s product, a nontoxic, clay-like substance for removing soot from wallpaper, as a modeling putty for kids. In addition, Zufall ______ selling the product under a child-friendly name: Play-Doh.", "choices": ["suggested", "suggests", "had suggested", "was suggesting"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the simple past tense verb “suggested” properly indicates that Zufall offered her suggestion for the product’s name in the past. This verb tense is consistent with the previous sentence’s use of a simple past tense verb (“advised”) to describe Zufall’s advice to McVicker in the 1950s. Choice B is incorrect because the present tense verb “suggests” doesn’t indicate that Zufall offered her suggestion in the past. Choice C is incorrect because the past perfect verb “had suggested” isn’t consistent with the previous sentence’s use of the simple past tense verb “advised” to describe Zufall’s advice to McVicker. Choice D is incorrect because the past progressive verb “was suggesting” isn’t consistent with the previous sentence’s use of the simple past tense verb “advised” to describe Zufall’s advice to McVicker."}, {"key": "6a-6", "label": "6a.6", "diff": "Medium", "src": "official", "oid": "6205f7e4", "stem": "A worker cooperative is a business that is owned and operated by its workers. This model stands in contrast to traditional models in which a smaller group of owners controls a company. Because the profits made by a cooperative are shared by all workers—who are also owners—the workers ______ directly from its success.", "choices": ["benefit", "benefited", "were benefiting", "had benefited"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the present tense verb “benefit” is consistent with the other present tense verbs (“is,” “stands,” and “are shared”) used to describe worker cooperatives and how they function. Choice B is incorrect because the past tense verb “benefited” isn’t consistent with the other present tense verbs used to describe worker cooperatives and how they function. Choice C is incorrect because the past progressive tense verb “were benefiting” isn’t consistent with the other present tense verbs used to describe worker cooperatives and how they function. Choice D is incorrect because the past perfect tense verb “had benefited” isn’t consistent with the other present tense verbs used to describe worker cooperatives and how they function."}, {"key": "6a-7", "label": "6a.7", "diff": "Medium", "src": "official", "oid": "67614549", "stem": "After winning the 1860 presidential election, Abraham Lincoln appointed Edward Bates, Salmon P. Chase, and William H. Seward to his cabinet. Lincoln’s decision was surprising, since each of these men had run against him, but historians have praised it, noting that Lincoln ______ his rivals’ diverse talents to strengthen his administration.", "choices": ["has leveraged", "is leveraging", "will leverage", "leveraged"], "answer": 3, "rationale": "Choice D is the best answer. The subject of the verb is “Lincoln,” and the first sentence tells us that we’re talking about something that Abraham Lincoln did in 1860. So the simple past tense “leveraged” fits the logic of the text. Choice A is incorrect. This choice creates a tense issue. “Has leveraged” is the present perfect tense, which is used for an action that began in the past and continues into the present. Lincoln started leveraging his rivals’ talents in 1860—it’s definitely not still happening today. So the present perfect tense isn’t appropriate. Choice B is incorrect. This choice creates a tense issue. “Is leveraging” is the present tense, but Lincoln leveraged his rivals’ talents in 1860, so the present tense isn’t appropriate. Choice C is incorrect. This choice creates a tense issue. “Will leverage” is the future tense, but Lincoln leveraged his rivals’ talents in 1860, so the future tense isn’t appropriate."}, {"key": "6a-8", "label": "6a.8", "diff": "Hard", "src": "official", "oid": "3daf126e", "stem": "A model created by biologist Luis Valente predicts that the rate of speciation—the rate at which new species form—on an isolated island located approximately 5,000 kilometers from the nearest mainland ______ triple the rate of speciation on an island only 500 kilometers from the mainland.", "choices": ["being", "to be", "to have been", "will be"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is finite and nonfinite verb forms within a sentence. Relative clauses, such as the one beginning with “that,” require a finite verb, a verb that can function as the main verb of a clause. This choice correctly supplies the clause with the finite future tense verb “will be.” Choice A is incorrect because the nonfinite participle “being” doesn’t supply the clause with a finite verb. Choice B is incorrect because the nonfinite to-infinitive “to be” doesn’t supply the clause with a finite verb. Choice C is incorrect because the nonfinite to-infinitive “to have been” doesn’t supply the clause with a finite verb."}]}, {"code": "6b", "day": 6, "title": "Finite vs nonfinite verbs", "items": [{"key": "6b-1", "label": "6b.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The ancient city of Khiva, with its massive clay walls and turquoise-tiled ______ thousands of tourists every year.", "choices": ["minarets, attracting", "minarets, to attract", "minarets, attracts", "minarets, having attracted"], "answer": 2, "rationale": "Choice C is the best answer. The subject “The ancient city of Khiva” needs a main (finite) verb, and “attracts” provides one. Choices A, B, and D are nonfinite forms (an -ing word, a to-infinitive, and a perfect participle) that can’t serve as the main verb, so the sentence would have no main verb."}, {"key": "6b-2", "label": "6b.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "The researchers, hoping to understand how memories form in the ______ the brain activity of mice as they navigated a maze.", "choices": ["brain, recording", "brain, recorded", "brain, to record", "brain, having recorded"], "answer": 1, "rationale": "Choice B is the best answer. “Hoping…brain” is a supplementary phrase, so the subject “The researchers” still needs a main verb after the closing comma. “Recorded” is a finite verb that completes the sentence. Choices A, C, and D are nonfinite forms, which leave the sentence without a main verb."}, {"key": "6b-3", "label": "6b.3", "diff": "Medium", "src": "official", "oid": "de3dd17d", "stem": "Planetary scientist Briony Horgan and her colleagues have determined that as much as 25 percent of the sand on Mars is composed of impact spherules. These spherical bits of glass form when asteroids collide with the planet, ejecting bits of molten rock into the atmosphere that, after cooling and solidifying into glass, ______ back onto Mars’s surface.", "choices": ["to rain", "raining", "having rained", "rain"], "answer": 3, "rationale": "Choice D is the best answer. \"That…[rain] back onto Mars’s surface\" is a relative clause that describes the \"bits of molten rock.\" Forming the clause requires a conjugated, finite verb, and this is the only choice that provides that. Choice A is incorrect. \"To rain\" is an infinitive and can’t serve as the main verb of a clause. A conjugated verb is needed here to form the main verb of the relative clause \"that…[rain] back onto Mars’s surface,\" which describes the \"bits of molten rock.\" Choice B is incorrect. \"Raining\" is a present participle and, on its own, can’t serve as the main verb of a clause. A conjugated verb is needed here to form the main verb of the relative clause \"that…[rain] back onto Mars’s surface,\" which describes the \"bits of molten rock.\" Choice C is incorrect. \"Having rained\" is a perfect participle and can’t serve as the main verb of a clause. A conjugated verb is needed here to form the main verb of the relative clause \"that…[rain] back onto Mars’s surface,\" which describes the \"bits of molten rock.\""}, {"key": "6b-4", "label": "6b.4", "diff": "Medium", "src": "official", "oid": "7c766ceb", "stem": "A popular suite of mapping and spatial analysis software, ArcGIS enables cartographers like Karachi Cartography founder Namra Khalid ______ maps by analyzing and arranging raw geospatial data.", "choices": ["create", "to create", "creating", "created"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite to-infinitive verb “to create” is correctly used to form a subordinate clause that expresses how ArcGIS facilitates the creation of maps (by analyzing and arranging certain data). Choice A is incorrect because it results in an ungrammatical sentence. The finite verb “create” can’t be used in this way to form a subordinate clause that expresses how ArcGIS facilitates the creation of maps. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite participle “creating” can’t be used in this way to form a subordinate clause that expresses how ArcGIS facilitates the creation of maps. Choice D is incorrect because it results in an ungrammatical sentence. The finite verb “created” can’t be used in this way to form a subordinate clause that expresses how ArcGIS facilitates the creation of maps."}, {"key": "6b-5", "label": "6b.5", "diff": "Medium", "src": "official", "oid": "f40b447c", "stem": "Featuring jagged peaks of black ink surrounded by hazy swirls of blue and green paint, Zhang Daqian’s 1983 painting Panorama of Mount Lu is inspired by the tradition of qinglü shanshui, a type of Chinese landscape painting ______ by the use of blue and green hues to depict ethereal, otherworldly landscapes.", "choices": ["has been characterized", "will be characterized", "characterized", "is characterized"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite past participle \"characterized\" is correctly used within a supplementary element that modifies the main clause \"Zhang...shanshui,\" defining qinglü shanshui and explaining some of its identifying traits. Choice A is incorrect because it results in a comma splice. Using the finite present perfect tense verb \"has been characterized\" creates a second main clause in the sentence, and the two main clauses can’t be joined in this way by only the comma before \"a type.\" Choice B is incorrect because it results in a comma splice. Using the finite future tense verb \"will be characterized\" creates a second main clause in the sentence, and the two main clauses can’t be joined in this way by only the comma before \"a type.\" Choice D is incorrect because it results in a comma splice. Using the finite present tense verb \"is characterized\" creates a second main clause in the sentence, and the two main clauses can’t be joined in this way by only the comma before \"a type.\""}, {"key": "6b-6", "label": "6b.6", "diff": "Hard", "src": "official", "oid": "c88ba1b7", "stem": "In the late nineteenth and early twentieth centuries, automobiles were commonly referred to as horseless carriages after the older technology they still resembled. Known as the Brass Era, this period in automotive design is remembered for its grandeur and artistry, its vehicles ______ by collectors for their ornate detailing and gleaming brass fittings.", "choices": ["are highly prized", "had been highly prized", "highly prized", "were highly prized"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of verb forms in a sentence. The nonfinite past participle phrase \"highly prized\" is correctly used to form a supplementary element that modifies the main clause \"this…artistry,\" describing memorable features of Brass Era automotive design. Choice A is incorrect because it results in a comma splice. Using the finite present tense verb phrase \"are highly prized\" creates a second main clause in the sentence, and two main clauses can’t be joined in this way with only a comma after \"artistry.\" Choice B is incorrect because it results in a comma splice. Using the finite past perfect tense verb phrase \"had been highly prized\" creates a second main clause in the sentence, and two main clauses can’t be joined in this way with only a comma after \"artistry.\" Choice D is incorrect because it results in a comma splice. Using the finite past tense verb phrase \"were highly prized\" creates a second main clause in the sentence, and two main clauses can’t be joined in this way with only a comma after \"artistry.\""}, {"key": "6b-7", "label": "6b.7", "diff": "Hard", "src": "official", "oid": "c9a677e9", "stem": "In his 2011 book, historian Sebouh David Aslanian quantifies the reading patterns of early modern Armenian merchants from New Julfa. Aslanian’s macroanalysis ______ nearly 1,000 book titles published between 1512 and 1800 shows not only the steady popularity of religious texts but also a broadening interest in secular books, especially those on history and geography.", "choices": ["examined", "examines", "had examined", "examining"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of verb forms within a sentence. The sentence’s subject is “Aslanian’s macroanalysis,” and its finite main verb is “shows.” This choice correctly uses the nonfinite present participle “examining” to form an integrated participial phrase (“examining...1800”) that describes the macroanalysis, indicating what it examined. Choice A is incorrect because using the finite verb “examined” creates an ungrammatical sentence. The sentence already has the finite main verb “shows,” so “examined” can’t also function as a second main verb here without additional punctuation or conjunctions. Choice B is incorrect because using the finite verb “examines” creates an ungrammatical sentence. The sentence already has the finite main verb “shows,” so “examines” can’t also function as a second main verb here without additional punctuation or conjunctions. Choice C is incorrect because using the finite verb “had examined” creates an ungrammatical sentence. The sentence already has the finite main verb “shows,” so “had examined” can’t also function as a second main verb here without additional punctuation or conjunctions."}, {"key": "6b-8", "label": "6b.8", "diff": "Hard", "src": "official", "oid": "505054e3", "stem": "In the eastern Chinese city of Suzhou, known as a hub for silk manufacturing, a unique tradition of embroidery ______ back over two thousand years—one that includes iconic double-sided stitching with different images on each side—remains popular with modern audiences, preserving the city’s cultural heritage.", "choices": ["dates", "date", "dating", "has dated"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of verb forms within a sentence. The sentence’s subject is “a unique tradition of embroidery,” and its finite main verb is “remains.” This choice correctly uses the nonfinite present participle “dating” to form an integrated participial phrase (“dating...years”) that modifies the subject, providing additional information about how far back the tradition goes. Choice A is incorrect because it results in an ungrammatical sentence. Using the finite present tense verb “dates” creates a second finite verb in the main clause, which already has the finite verb “remains” as its main verb. Choice B is incorrect because it results in an ungrammatical sentence. Using the finite present tense verb “date” creates a second finite verb in the main clause, which already has the finite verb “remains” as its main verb. Furthermore, the plural verb “date” doesn’t agree in number with the singular subject, “a unique tradition of embroidery.” Choice D is incorrect because it results in an ungrammatical sentence. Using the finite present perfect tense verb “has dated” creates a second finite verb in the main clause, which already has the finite verb “remains” as its main verb."}, {"key": "6b-9", "label": "6b.9", "diff": "Hard", "src": "official", "oid": "a2816c7f", "stem": "American abstract artist Richard ______ his installations to make passersby keenly aware of how one’s movements are affected by the physical features of one’s environment, assembles large-scale steel plates into sculptures that dominate the outdoor spaces they occupy.", "choices": ["Serra is intending", "Serra, intends", "Serra, intending", "Serra intends"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of verb forms within a sentence. This choice pairs the comma after \"Serra\" with the comma after \"environment\" and uses the nonfinite present participle \"intending\" to correctly form a supplementary phrase describing the reaction Serra intends his sculptures to provoke. This supplementary phrase appears between the noun phrase that it modifies (\"American abstract artist Richard Serra\") and the finite present tense verb (\"assembles\"), which functions as the sentence’s main verb and describes what Serra does. Choice A is incorrect because it results in an ungrammatical sentence. The finite present continuous tense verb \"is intending\" can’t be used in this way in conjunction with the finite present tense verb \"assembles,\" which already functions as the main verb in the sentence. Choice B is incorrect because it results in an ungrammatical sentence. The finite present tense verb \"intends\" can’t be used in this way to supplement the noun phrase \"American abstract artist Richard Serra.\" Choice D is incorrect because it results in an ungrammatical sentence. The finite present tense verb \"intends\" can’t be used in this way in conjunction with the finite present tense verb \"assembles,\" which already functions as the main verb in the sentence."}, {"key": "6b-10", "label": "6b.10", "diff": "Hard", "src": "official", "oid": "d222f7d9", "stem": "Helical ______ widely understood to confer stability and efficiency in the locomotion of a variety of microscopic organisms—including bacteria, eukaryotic algae, and ciliates—bestows similar advantages, albeit via different propulsive modes, to larger oceanic macroplanktons, such as salps.", "choices": ["swimming, is", "swimming is", "swimming has been", "swimming,"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after “swimming” pairs with the dash after “ciliates” to offset the supplementary element (“widely…ciliates”) that interrupts the main clause of the sentence. Choice A is incorrect. Adding the verb “is” here creates an ungrammatical sentence structure with two main verbs (“is” and “bestows”) without appropriate punctuation and/or conjunction. Choice B is incorrect because it fails to offset the supplementary element with appropriate punctuation. Furthermore, adding the verb “is” here creates an ungrammatical sentence that has two finite verbs (“is” and “bestows”) without appropriate punctuation and/or conjunction. Choice C is incorrect because it fails to offset the supplementary element with appropriate punctuation. Furthermore, adding the verb “has been” here creates an ungrammatical sentence that has two finite verbs (“has been” and “bestows”) without appropriate punctuation and/or conjunction."}, {"key": "6b-11", "label": "6b.11", "diff": "Hard", "src": "official", "oid": "aa443c4b", "stem": "Recent pollen analyses of the Aran Islands have led some researchers to propose that the now treeless islands were once wooded. This hypothesis ______ that certain trees, such as P. sylvestris, survived without interruption or human intervention throughout the Holocene cannot stand, researchers Michael O’Connell and Karen Molloy counter, unless other explanations can first be ruled out.", "choices": ["suggesting", "suggested", "suggests", "has suggested"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite present participle \"suggesting\" is correctly used to form a restrictive participial phrase (\"suggesting...Holocene\") within the main clause (\"This hypothesis...cannot stand...\"). This participial phrase functions as part of the sentence’s subject (\"This...Holocene\"), providing essential identifying information about what the hypothesis states—namely, that certain trees survived without interruption or human intervention throughout the Holocene. Choice B is incorrect because it results in an ungrammatical sentence. The finite verb \"suggested\" can’t be used in this way within the subject of the sentence. Choice C is incorrect because it results in an ungrammatical sentence. The finite verb \"suggests\" can’t be used in this way within the subject of the sentence. Choice D is incorrect because it results in an ungrammatical sentence. The finite verb \"has suggested\" can’t be used in this way within the subject of the sentence."}]}, {"code": "6c", "day": 6, "title": "Dangling modifiers", "items": [{"key": "6c-1", "label": "6c.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "Walking through the old city at sunset, ______", "choices": ["the domes seemed to glow with color.", "I was amazed by the color of the domes.", "the color of the domes amazed me.", "there was an amazing glow on the domes."], "answer": 1, "rationale": "Choice B is the best answer. The introductory phrase “Walking…sunset” must be followed by the person doing the walking. “I” is the one walking, so it must come right after the comma. Choices A and C wrongly suggest the domes or their color were walking. Choice D doesn’t name anyone who was walking."}, {"key": "6c-2", "label": "6c.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "Born in Andijan in 1483, ______", "choices": ["the Mughal Empire was founded by Babur in South Asia.", "the founding of the Mughal Empire was Babur’s greatest achievement.", "Babur founded the Mughal Empire in South Asia.", "South Asia became home to the Mughal Empire founded by Babur."], "answer": 2, "rationale": "Choice C is the best answer. The modifier “Born in Andijan in 1483” describes Babur, so “Babur” must come directly after the comma. Choices A, B, and D place “the Mughal Empire,” “the founding,” and “South Asia” next to the modifier, illogically suggesting that they were born in Andijan."}, {"key": "6c-3", "label": "6c.3", "diff": "Medium", "src": "official", "oid": "96a904c5", "stem": "The musical scores of Japanese composer Hiroyuki Sawano are famous for their mysterious titles. Laden with emojis and seemingly meaningless words, and driven largely by Sawano’s “personal feeling and mood,” ______", "choices": ["the listener can approach each piece free from expectations because of the titles.", "the titles allow the listener to approach each piece free from expectations.", "each piece can be approached by the listener free from expectations because of the titles.", "the listener’s approach to each piece because of the titles can be free from expectations."], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “the titles” the subject of the sentence and places it immediately after the modifying phrases “laden with emojis and seemingly meaningless words, and driven largely by Sawano’s ‘personal feeling and mood.’” In doing so, this choice clearly establishes that the titles—and not another noun in the sentence —are being described as laden with emojis and driven by Sawano’s personal feeling. Choice A is incorrect because it results in a dangling modifier. The placement of “the listener” immediately after the modifying phrases illogically suggests that the listener, rather than the titles, is laden with emojis and driven by Sawano’s personal feeling. Choice C is incorrect because it results in a dangling modifier. The placement of “each piece” (i.e., musical score) immediately after the modifying phrases illogically suggests that the pieces, rather than the titles of the pieces, are laden with emojis and driven by Sawano’s personal feeling. Choice D is incorrect because it results in a dangling modifier. The placement of “the listener’s approach” immediately after the modifying phrases illogically suggests that the listener’s approach, rather than the titles, is laden with emojis and driven by Sawano’s personal feeling."}, {"key": "6c-4", "label": "6c.4", "diff": "Medium", "src": "official", "oid": "c437dd53", "stem": "Wanting to celebrate the 100th anniversary of the Alaska Purchase, ______ up with a motto that best captured the state’s unique character. The commission selected “North to the Future,” submitted by Juneau journalist Richard Peter, as its winning entry.", "choices": ["a contest sponsored by the Alaska Centennial Commission would award $300 to an individual who came", "an award of $300 would go to an individual in a contest sponsored by the Alaska Centennial Commission for coming", "$300 would be awarded to an individual by the Alaska Centennial Commission in a contest for coming", "the Alaska Centennial Commission sponsored a contest that would award $300 to an individual who came"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"the Alaska Centennial Commission\" the subject of the sentence and places it immediately after the modifying phrase \"wanting…Purchase.\" In doing so, this choice clearly establishes that the Alaska Centennial Commission—and not another noun in the sentence—wanted to celebrate the 100th anniversary of the Alaska Purchase. Choice A is incorrect because it results in a dangling modifier. The placement of the noun phrase \"a cont
