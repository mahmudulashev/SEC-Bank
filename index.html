s perhaps his foremost achievement. Though his reign ended roughly twenty years before Siam became known by its modern name of Thailand, King Chulalongkorn is often credited with ushering the nation into modernity.", "choices": ["Chulalongkorn;", "Chulalongkorn that", "Chulalongkorn,", "Chulalongkorn"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. This choice uses a semicolon in a conventional way to join the first main clause (“That...Chulalongkorn”) and the second main clause (“deterring...achievement”). Choice B is incorrect. Using the conjunction “that” to introduce “deterring...achievement” as a subordinate element of the main clause (“That...Chulalongkorn”) results in a confusing and ungrammatical sentence. Choice C is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice D is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."}]}, {"code": "2b", "day": 2, "title": "Colon", "items": [{"key": "2b-1", "label": "2b.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "Traditional Uzbek plov is built on a few essential ______ rice, carrots, onions, and meat.", "choices": ["ingredients:", "ingredients;", "ingredients. Rice,", "ingredients"], "answer": 0, "rationale": "Choice A is the best answer. The main clause (“Traditional…ingredients”) is complete, and a colon correctly introduces the list that explains what those ingredients are. Choice B is incorrect because a semicolon must join two main clauses, and the list is not a main clause. Choice C is incorrect because it leaves the list as a fragment. Choice D is incorrect because the list must be separated from the main clause."}, {"key": "2b-2", "label": "2b.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "The results of the experiment surprised the research team for one simple ______ the improvement of the control group, which had received no treatment at all.", "choices": ["reason;", "reason:", "reason. The", "reason"], "answer": 1, "rationale": "Choice B is the best answer. A colon follows the complete main clause and introduces the explanation of what the “one simple reason” was. Choice A is incorrect because the phrase after the blank is a noun phrase, not a main clause, so a semicolon can’t be used. Choice C is incorrect because it creates a fragment (“The improvement…all.”). Choice D is incorrect because the explanation must be separated from the main clause."}, {"key": "2b-t1", "label": "2b.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "The festival’s program ______ live music, a craft market, and an evening of poetry readings.", "choices": ["included", "included:", "included;", "included—"], "answer": 0, "rationale": "Choice A is the best answer. “live music…readings” is the direct object of the verb “included.” No punctuation goes between a verb and its object. Choice B is incorrect because a colon must follow a complete main clause. “The festival’s program included” is not complete without its object. Choice C is incorrect because a semicolon must join two main clauses; here it separates a verb from its object. Choice D is incorrect because a dash can’t separate a verb from its object."}, {"key": "2b-3", "label": "2b.4", "diff": "Medium", "src": "official", "oid": "c3397d25", "stem": "Since the nineteenth century, Egyptologists have commonly divided ancient Egyptian history into three primary ______ Old Kingdom (2700–2200 BCE), the Middle Kingdom (2050–1800 BCE), and the New Kingdom (1550–1100 BCE). Some historians, however, criticize the names of these periods for revealing more about the culture of the mainly European Egyptologists than that of ancient Egypt itself.", "choices": ["periods. The", "periods: the", "periods; the", "periods, the"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is punctuation use between a main clause and an enumerated series. In this choice, a colon is correctly used after the main clause (“Since...periods”) to introduce the series identifying the three primary periods of ancient Egyptian history. Choice A is incorrect because placing a period after “periods” results in a rhetorically unacceptable sentence fragment beginning with “the Old Kingdom.” Choice C is incorrect because a semicolon can’t be used in this way to introduce a series. A semicolon is conventionally used to join two main clauses or to separate items in a complex series, neither of which is the case here. Choice D is incorrect because a comma is not conventionally used to mark the boundary between the main clause (“Since...periods”) and an enumerated series (“the Old Kingdom...(1550–1100 BCE)”) that contains internal commas. Using a comma in this way creates ambiguity about which commas separate elements in the series and which mark other boundaries in the sentence, making the colon the best choice."}, {"key": "2b-4", "label": "2b.5", "diff": "Medium", "src": "official", "oid": "da53d726", "stem": "In February 1919, following the end of the First World War, women from ten countries around the world convened the Inter-Allied Women’s Conference in Paris. The conference’s goals were ______ ensure women’s participation in the proceedings of the Paris Peace Conference, to secure the right of women to serve in the League of Nations, and to advocate for human rights.", "choices": ["threefold: to", "threefold. To", "threefold to", "threefold; to"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. In this choice, the colon correctly introduces the series of goals held by the 1919 Inter-Allied Women’s Conference. Choice B is incorrect because placing a period after \"threefold\" results in a rhetorically unacceptable sentence fragment beginning with \"To.\" Choice C is incorrect because it results in a run-on sentence. The main clause (\"The conference’s goals were threefold\") and the series supplement (\"to…rights\") are fused without punctuation. Choice D is incorrect because a semicolon can’t be used in this way to introduce a series. A semicolon is conventionally used to join two main clauses, whereas a colon is conventionally used to introduce a series, making the colon the better choice in this context."}, {"key": "2b-5", "label": "2b.6", "diff": "Hard", "src": "official", "oid": "c15069eb", "stem": "Latin America is known to have dozens, if not hundreds, of popular dance forms. Only five of these dances are included in international ballroom dance ______ rumba, samba, cha-cha-cha, paso doble, and jive—the last of which is grouped with the other Latin dances despite not having Latin roots.", "choices": ["competitions, however:", "competitions, however,", "competitions, however;", "competitions; however,"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the punctuation of supplementary elements within a sentence. This choice correctly uses a comma to separate the supplementary adverb \"however\" from the preceding main clause (\"only...competitions\"), and it uses a colon to introduce the list of dances that follows (\"rumba…jive\"). Further, placing the colon after \"however\" rather than before indicates that the information in the preceding main clause (only...competitions) is contrary to what might be assumed from the information in the previous sentence (Latin America has many more dance forms). Choice B is incorrect. The comma after \"however\" can’t be used in this way to introduce a series (\"rumba...jive\"). Choice C is incorrect because it isn’t conventional to use a semicolon in this way to introduce a series of items, such as the list of dances. Choice D is incorrect because placing the semicolon after \"competitions\" illogically indicates that the following list of five Latin American dances (\"rumba...jive\") is contrary to the information in the previous clause (only five Latin American dances are included in international ballroom dance competitions)."}, {"key": "2b-t2", "label": "2b.7", "diff": "Medium", "src": "practice", "oid": "", "stem": "The Fergana Valley is known for its fruit, such ______ apricots, pomegranates, and grapes.", "choices": ["as:", "as;", "as", "as—"], "answer": 2, "rationale": "Choice C is the best answer. “such as” introduces the examples directly. No punctuation goes between “such as” and the items it introduces. Choice A is incorrect because a colon must follow a complete main clause, and “such as” is not one. Choice B is incorrect because a semicolon can’t separate “such as” from the items it introduces. Choice D is incorrect because a dash can’t separate “such as” from the items it introduces."}, {"key": "2b-6", "label": "2b.8", "diff": "Hard", "src": "official", "oid": "fba5d8d1", "stem": "In a 2016 study, Eastern Washington University psychologist Amani El-Alayli found that, among the study participants who experienced frisson (a physiological response akin to goosebumps or getting the chills) while listening to music, there was one personality trait that they scored particularly ______ openness to experience.", "choices": ["high. On", "high on;", "high on", "high on:"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation use between a main clause and a supplementary phrase. In this choice, a colon is correctly used to mark the boundary between the main clause (\"there...on\") and the supplementary phrase (\"openness to experience\") and to introduce the information that identifies which personality trait participants scored especially high on. Choice A is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with \"on\" and separates a necessary preposition from the clause beginning with \"there.\" Choice B is incorrect because a semicolon can’t be used in this way to join the main clause (\"there...on\") and the supplementary phrase (\"openness to experience\"). A semicolon is conventionally used to join two main clauses, whereas a colon is conventionally used to introduce an element that explains or amplifies the information in the preceding clause, making the colon the better choice in this context. Choice C is incorrect because it fails to mark the boundary between the main clause (\"there...on\") and the supplementary phrase (\"openness to experience\")."}, {"key": "2b-7", "label": "2b.9", "diff": "Hard", "src": "official", "oid": "84658166", "stem": "In 1943, in the midst of World War II, mathematics professor Grace Hopper was recruited by the US military to help the war effort by solving complex equations. Hopper’s subsequent career would involve more than just ______ as a pioneering computer programmer, Hopper would help usher in the digital age.", "choices": ["equations, though:", "equations, though,", "equations. Though,", "equations though"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of punctuation to mark boundaries between supplements and clauses. The comma after “equations” is used to separate the independent clause (“Hopper’s…equation”) from the supplementary adverb phrase “though.” The colon after “though” is used to mark the boundary between the clause ending with “though” and the following clause (“as…age”). A colon used in this way introduces information that illustrates or explains information that has come before it. In this case, the colon after “though” introduces the following explanation of how Hopper’s subsequent career would involve more than just solving equations: she would become a pioneering computer programmer. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to join two independent clauses (“Hopper’s… though” and “as…age”) such as these. Choice C is incorrect because it results in an illogical sequence of sentences. Placing the period after “equations” and beginning the next sentence with “Though” illogically suggests that the following information (that Hopper would help usher in the digital age) is contrary to the information in the previous sentence (Hopper’s subsequent career would involve more than just solving equations). Instead, the information that follows supports the information from the previous sentence by explaining how her work and influence extended beyond solely solving equations. Choice D is incorrect because it results in a run-on sentence. The two independent clauses (“Hopper’s…though” and “as…age”) are fused without punctuation."}, {"key": "2b-8", "label": "2b.10", "diff": "Hard", "src": "official", "oid": "9579581e", "stem": "As cheesemaking practices spread throughout Europe and Asia during and after the Neolithic, divergent strategies for preserving milk ______ whereas rennet-coagulated cheesemaking became key to milk preservation in Europe and Southwest Asia, acid-heat coagulation methods became common among nomadic herding populations of the northeastern Eurasian steppe.", "choices": ["emerged", "emerged and", "emerged:", "emerged,"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is punctuation use within a sentence. A colon can be used between two main clauses to signal that what follows is an elaboration of what came before. In this choice, the colon correctly introduces the following explanation of the divergent milk preservation strategies that emerged. Choice A is incorrect because it results in a run-on sentence. The main clause (\"As…emerged\") and the subordinate clause followed by another main clause (\"whereas…steppe\") are fused without punctuation and/or a conjunction. Choice B is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join a main clause (\"As…emerged\") and a subordinate clause followed by another main clause (\"whereas…steppe\"). Choice D is incorrect because it results in a comma splice. A comma can’t be used in this way to join a main clause (\"As… emerged\") and a subordinate clause followed by another main clause (\"whereas…steppe\")."}, {"key": "2b-t3", "label": "2b.11", "diff": "Medium", "src": "practice", "oid": "", "stem": "When clay is fired at a high enough ______ it becomes hard and water-resistant.", "choices": ["temperature,", "temperature:", "temperature;", "temperature."], "answer": 0, "rationale": "Choice A is the best answer. “When…temperature” is a dependent clause, so a comma correctly joins it to the main clause “it becomes hard and water-resistant.” Choice B is incorrect because a colon must follow a complete main clause, but “When…temperature” is a dependent clause. Choice C is incorrect because a semicolon must join two main clauses, but “When…temperature” is a dependent clause. Choice D is incorrect because the period turns “When clay is fired…temperature” into a fragment."}, {"key": "2b-9", "label": "2b.12", "diff": "Hard", "src": "official", "oid": "2c4cd76d", "stem": "Researchers studying magnetosensation have determined why some soil-dwelling roundworms in the Southern Hemisphere move in the opposite direction of Earth’s magnetic field when searching for ______ in the Northern Hemisphere, the magnetic field points down, into the ground, but in the Southern Hemisphere, it points up, toward the surface and away from worms’ food sources.", "choices": ["food:", "food,", "food while", "food"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is colon use within a sentence. A colon used in this way introduces information that illustrates or explains information that has come before it. In this case, the colon introduces the following explanation of why some roundworms in the Southern Hemisphere move in the opposite direction of Earth’s magnetic field. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to join two long independent clauses (“Researchers…food” and “in…sources”) such as these. Choice C is incorrect because it results in a run-on sentence. The two clauses (“Researchers…food” and “in…sources”) are fused without punctuation. Furthermore, the conjunction “while” fails to indicate that what follows is an explanation of why some roundworms in the Southern Hemisphere move in the opposite direction of Earth’s magnetic field. Choice D is incorrect because it results in a run-on sentence. The two clauses (“Researchers…food” and “in…sources”) are fused without punctuation and/or a conjunction."}, {"key": "2b-10", "label": "2b.13", "diff": "Hard", "src": "official", "oid": "9d4a701b", "stem": "Along with carbon dioxide concentration and temperature, light intensity affects the chemical reaction rate of ______ as light intensity increases, so does the rate at which the reactants (water and carbon dioxide) are converted into their products (glucose and oxygen).", "choices": ["photosynthesis and", "photosynthesis,", "photosynthesis:", "photosynthesis"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of punctuation in a sentence. In this choice, a colon is correctly used to mark the boundary between one main clause (\"Along with...photosynthesis\") and another main clause (\"as light...oxygen\") and to introduce the following explanation of how light intensity affects photosynthesis. Choice A is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction (\"and\"). Choice B is incorrect because it results in a comma splice. Without a coordinating conjunction following it, a comma can’t be used in this way to join two main clauses (\"Along with...photosynthesis\" and \"as light...oxygen\"). Choice D is incorrect because it results in a run-on sentence. The two main clauses (\"Along with...photosynthesis\" and \"as light...oxygen\") are fused without punctuation and/or a conjunction."}]}, {"code": "2c", "day": 2, "title": "Dash", "items": [{"key": "2c-1", "label": "2c.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "After months of testing, the engineers finally identified the cause of the ______ a single loose wire behind the control panel.", "choices": ["failure;", "failure—", "failure", "failure, and"], "answer": 1, "rationale": "Choice B is the best answer. A single dash, like a colon, can follow a complete main clause to introduce an explanation (“a single loose wire…panel”). Choice A is incorrect because a semicolon must be followed by a main clause. Choice C is incorrect because the explanation must be set off from the main clause. Choice D is incorrect because “and” would need to introduce a second main clause, but “a single loose wire…panel” has no verb."}, {"key": "2c-2", "label": "2c.2", "diff": "Easy", "src": "practice", "oid": "", "stem": "The chef’s signature dish combines three unexpected ______ dark chocolate, chili pepper, and sea salt.", "choices": ["flavors—", "flavors;", "flavors, they are", "flavors"], "answer": 0, "rationale": "Choice A is the best answer. The dash follows a complete main clause and introduces the list of the three flavors. Choice B is incorrect because a semicolon can’t introduce a list. Choice C creates a comma splice. Choice D fails to separate the list from the main clause."}, {"key": "2c-t1", "label": "2c.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "The Registan, a square framed by three monumental ______ is the best-known landmark in Samarkand.", "choices": ["madrasas—", "madrasas;", "madrasas", "madrasas,"], "answer": 3, "rationale": "Choice D is the best answer. The phrase “a square framed by three monumental madrasas” opens with a comma, so it must also close with a comma. Choice A is incorrect because the extra information opens with a comma, so it can’t close with a dash. Paired punctuation must match. Choice B is incorrect because a semicolon can’t separate the subject (“The Registan”) from its verb (“is”). Choice C is incorrect because the extra information opened with a comma must also be closed with a comma."}, {"key": "2c-3", "label": "2c.4", "diff": "Medium", "src": "practice", "oid": "", "stem": "The Great Wall of China—actually a series of walls built by different dynasties over many ______ stretches across thousands of kilometers of northern China.", "choices": ["centuries,", "centuries—", "centuries;", "centuries"], "answer": 1, "rationale": "Choice B is the best answer. The supplementary phrase “actually a series…centuries” begins with a dash, so it must end with a dash too. Paired punctuation must match. Choice A is incorrect because a comma can’t close a phrase that a dash opened. Choice C is incorrect because a semicolon would separate the subject (“The Great Wall of China”) from its verb (“stretches”). Choice D fails to close the supplementary phrase."}, {"key": "2c-4", "label": "2c.5", "diff": "Medium", "src": "practice", "oid": "", "stem": "The town’s oldest building—a stone mill constructed in ______ now houses a small museum of local history.", "choices": ["1792—", "1792,", "1792", "1792;"], "answer": 0, "rationale": "Choice A is the best answer. The supplementary phrase “a stone mill constructed in 1792” is opened with a dash, so a second dash must close it before the verb “houses.” Choice B mixes a dash and a comma. Choice C fails to close the supplementary phrase. Choice D incorrectly places a semicolon between the subject and its verb."}, {"key": "2c-t2", "label": "2c.6", "diff": "Hard", "src": "practice", "oid": "", "stem": "The vivid blue tiles covering the domes of the Shah-i-Zinda ______ much of their color to metal oxides in the glaze.", "choices": ["necropolis—owe", "necropolis owe", "necropolis, owe", "necropolis; owe"], "answer": 1, "rationale": "Choice B is the best answer. “The vivid blue tiles…necropolis” is the subject and “owe” is its verb. No punctuation belongs between a subject and its verb. Choice A is incorrect because a dash can’t separate a subject from its verb. Choice C is incorrect because a single comma should not separate a subject from its verb. Choice D is incorrect because a semicolon must join two main clauses; here it separates a subject from its verb."}, {"key": "2c-5", "label": "2c.7", "diff": "Medium", "src": "practice", "oid": "", "stem": "Marie Curie remains the only person to have won Nobel Prizes in two different ______ physics in 1903 and chemistry in 1911.", "choices": ["sciences;", "sciences—", "sciences, being", "sciences"], "answer": 1, "rationale": "Choice B is the best answer. The dash follows a complete main clause and introduces an explanation of which two sciences are meant. Choice A is incorrect because a semicolon must be followed by a main clause. Choice C is incorrect because “being” creates an unclear, ungrammatical phrase. Choice D fails to separate the explanation from the main clause."}, {"key": "2c-6", "label": "2c.8", "diff": "Medium", "src": "official", "oid": "0f39b19c", "stem": "After a spate of illnesses as a child, Wilma Rudolph was told she might never walk again. Defying all odds, Rudolph didn’t just walk, she ______ the 1960 Summer Olympics in Rome, she won both the 100- and 200-meter dashes and clinched first place for her team in the 4x100-meter relay, becoming the first US woman to win three gold medals in a single Olympics.", "choices": ["ran—fast—during", "ran—fast during", "ran—fast, during", "ran—fast. During"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (“Defying…fast”) and another sentence that begins with a supplementary phrase (“During…Olympics”). Choice A is incorrect. When a dash is present in a sentence (“ran—fast”), it’s not conventional to use another dash (“fast—during”) to mark the boundary between sentences because it creates a potentially confusing sentence. In this context, a period, semicolon, or colon would be clear and more conventional. Choice B is incorrect because it results in a run-on sentence. The sentences (“Defying…fast”) and (“during…Olympics”) are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences."}, {"key": "2c-t3", "label": "2c.9", "diff": "Medium", "src": "practice", "oid": "", "stem": "If the samples are stored above ______ the enzymes in them begin to break down within hours.", "choices": ["freezing—", "freezing,", "freezing;", "freezing:"], "answer": 1, "rationale": "Choice B is the best answer. “If…freezing” is a dependent clause, so a comma correctly joins it to the main clause that follows. Choice A is incorrect because a dash is not the conventional mark after an introductory dependent clause; a comma is. Choice C is incorrect because a semicolon must join two main clauses, but “If…freezing” is a dependent clause. Choice D is incorrect because a colon must follow a complete main clause, but “If…freezing” is a dependent clause."}, {"key": "2c-7", "label": "2c.10", "diff": "Hard", "src": "official", "oid": "92f309b2", "stem": "Arms outstretched, right wrist over left with both hands dangling, South Korean musician Psy galloped from one foot to the other in the iconic dance of his 2012 international hit song “Gangnam Style.” Later, a statue depicting Psy’s arm-positioning during the dance was erected in the place that inspired the song’s ______ Gangnam District in Seoul, South Korea.", "choices": ["name;", "name.", "name", "name—"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a dash after the main clause (“Later...name”) to introduce the supplementary element (“Gangnam...Korea”) that identifies the place that inspired the song’s name. Choice A is incorrect because a semicolon can’t be used in this way to join the main clause (“Later...name”) and the supplementary element (“Gangnam...Korea”). A semicolon is conventionally used to join two main clauses. Choice B is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “Gangnam.” Choice C is incorrect because it fails to mark the boundary between the main clause and the supplementary element with appropriate punctuation."}]}, {"code": "2d", "day": 2, "title": "Lists with internal commas", "items": [{"key": "2d-1", "label": "2d.1", "diff": "Medium", "src": "practice", "oid": "", "stem": "The conference brought together scientists from Tashkent, ______ Almaty, Kazakhstan; and Bishkek, Kyrgyzstan.", "choices": ["Uzbekistan,", "Uzbekistan:", "Uzbekistan;", "Uzbekistan"], "answer": 2, "rationale": "Choice C is the best answer. Each item in this series already contains a comma (city, country), so semicolons are used to separate the items. The semicolon after “Uzbekistan” matches the semicolon after “Kazakhstan.” Choice A is incorrect because commas would make it unclear where one item ends and the next begins. Choice B is incorrect because a colon can’t separate items in a series. Choice D fails to separate the first two items."}, {"key": "2d-2", "label": "2d.2", "diff": "Medium", "src": "official", "oid": "e2f77ae7", "stem": "That Chaucer’s Canterbury Tales inspired imitators is evident from the existence of three near-contemporary “continuations” of the collection: The Siege of Thebes, which purports to be a new tale told during the pilgrims’ ______ The Tale of Beryn, which depicts the pilgrims as tourists; and The Ploughman’s Tale, which features a minor character from the original work.", "choices": ["return.", "return", "return;", "return,"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the punctuation of elements in a complex series. It’s conventional to use a semicolon to separate items in a complex series with internal punctuation, and in this choice, the semicolon after “return” is conventionally used to separate the first item (“The Siege of Thebes...return”) and the second item (“The Tale of Beryn...tourists”) in the series of tales. Moreover, the semicolon after “return” matches the semicolon used later to separate the second item and the third item (“and The Ploughman’s Tale...work”) in the series. Choice A is incorrect because placing a period after “return” results in a rhetorically unacceptable sentence fragment beginning with “The Tale of Beryn.” Choice B is incorrect because it fails to use appropriate punctuation to separate the first item and the second item in the complex series. Choice D is incorrect because a comma after “return” doesn’t match the semicolon used later to separate the second and third items in the series."}, {"key": "2d-3", "label": "2d.3", "diff": "Hard", "src": "official", "oid": "db24ecc9", "stem": "The Arctic-Alpine Botanic Garden in Norway and the Jardim Botânico of Rio de Janeiro in Brazil are two of many botanical gardens around the world dedicated to growing diverse plant ______ fostering scientific research; and educating the public about plant conservation.", "choices": ["species, both native and nonnative,", "species, both native and nonnative;", "species; both native and nonnative,", "species both native and nonnative,"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the punctuation of items in a complex series (a series including internal punctuation). The semicolon after “nonnative” is correctly used to separate the first item (“growing diverse plant species, both native and nonnative”) and the second item (“fostering scientific research”) in the series of things that botanical gardens are dedicated to. Further, the comma after “species” is correctly used to separate the noun phrase “diverse plant species” and the supplementary phrase “both native and nonnative” that modifies it. Choice A is incorrect because a comma (specifically, the comma after “nonnative”) can’t be used in this way to separate items in a complex series. Choice C is incorrect because a semicolon can’t be used in this way to separate the noun phrase “diverse plant species” and the supplementary phrase “both native and nonnative” that modifies it. Further, a comma can’t be used in this way to separate items in a complex series. Choice D is incorrect because it fails to use appropriate punctuation to separate the noun phrase “diverse plant species” and the supplementary phrase “both native and nonnative” that modifies it. Further, a comma can’t be used in this way to separate items in a complex series."}, {"key": "2d-4", "label": "2d.4", "diff": "Hard", "src": "official", "oid": "aaa1907f", "stem": "To serve local families during the Great Depression, innovative New York City librarian Pura Belpré offered storytelling in both English and Spanish, an uncommon ______ celebrated el Día de los Tres Reyes Magos, an important community holiday; and put on puppet shows dramatizing Puerto Rican folktales.", "choices": ["practice, at the time", "practice at the time;", "practice, at the time,", "practice at the time,"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the punctuation of elements in a complex series. It’s conventional to use a semicolon to separate items in a complex series with internal punctuation, and in this choice, the semicolon after \"time\" is conventionally used to separate the first item (\"offered…time\") and the second (\"celebrated…holiday\") in the series of activities that librarian Pura Belpré offered. Moreover, the semicolon after \"time\" matches the semicolon used later to separate the second item (\"celebrated...holiday\") and the third (\"and...folktales\") in the series. Choice A is incorrect because it fails to use appropriate punctuation to separate the first item and the second item in the complex series. Furthermore, a comma isn’t needed between the noun \"practice\" and the prepositional phrase \"at the time\" because the prepositional phrase is essential to the full meaning of the phrase \"an uncommon practice at the time.\" Choice C is incorrect because a comma after \"time\" doesn’t match the semicolon used later to separate the second (\"celebrated...holiday\") and third (\"and...folktales\") items in the series. Furthermore, a comma isn’t needed between the noun \"practice\" and the prepositional phrase \"at the time\" because the prepositional phrase is essential to the full meaning of the phrase \"an uncommon practice at the time.\" Choice D is incorrect because a comma after \"time\" doesn’t match the semicolon used later to separate the second (\"celebrated...holiday\") and third (\"and...folktales\") items in the series."}, {"key": "2d-5", "label": "2d.5", "diff": "Hard", "src": "official", "oid": "05a14e18", "stem": "While the ancient Celts—Iron Age peoples who inhabited parts of western and central Europe—weren’t a single unified group, their art often featured common elements. These included intricate patterns of interlocking spiral lines, which often held symbolic ______ of birds, horses, and other animals; and inlaid enamel accents.", "choices": ["significance; depictions", "significance, depictions", "significance: depictions", "significance. Depictions"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the punctuation of elements in a complex series. It’s conventional to use a semicolon to separate items in a complex series with internal punctuation, and in this choice, the semicolon after “significance” is conventionally used to separate the first item (“intricate...significance”) and the second item (“depictions...animals”) in the series of common elements found in Celtic art. Moreover, the semicolon after “significance” matches the semicolon used later to separate the second item (“depictions...animals”) and the third item (“and...accents”) in the series. Choice B is incorrect because a comma after “significance” doesn’t match the semicolon used later to separate the second and third items in the series (“depictions...animals” and “and...accents”). Choice C is incorrect because a colon can’t be used in this way to separate items in a complex series. Choice D is incorrect because placing a period after “significance” results in a rhetorically unacceptable sentence fragment beginning with “depictions.”"}, {"key": "2d-6", "label": "2d.6", "diff": "Hard", "src": "official", "oid": "78b88c04", "stem": "Joshua Hinson, director of the language revitalization program of the Chickasaw Nation in Oklahoma, helped produce the world’s first Indigenous-language instructional app, Chickasaw ______ Chickasaw TV, in 2010; and a Rosetta Stone language course in Chickasaw, in 2015.", "choices": ["Basic; in 2009, an online television network;", "Basic; in 2009, an online television network,", "Basic, in 2009; an online television network,", "Basic, in 2009, an online television network,"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the punctuation of items in a complex series. It’s conventional to use a semicolon to separate items in a complex series with internal punctuation, and in this choice, the semicolon after “2009” is conventionally used to separate the first item (“the world’s…2009”) and the second item (“an online…2010”) in the series of things that Hinson helped create. Further, the comma after “Basic” correctly pairs with the comma after “app,” and the comma after “network” correctly pairs with the comma after “TV” to set off the supplemental elements (“Chickasaw Basic” and “Chickasaw TV”) that provide the names of the app and the TV network, respectively. Altogether, the punctuation in this choice results in a sentence that clearly indicates that Hinson helped make a language app in 2009, an online TV network in 2010, and a language course in 2015. Choice A is incorrect because it fails to punctuate the complex series in a way that makes clear that Hinson helped make a language app in 2009, an online TV network in 2010, and a language course in 2015. Choice B is incorrect because it fails to punctuate the complex series in a way that makes clear that Hinson helped make a language app in 2009, an online TV network in 2010, and a language course in 2015. Choice D is incorrect because the comma after “2009” doesn’t match the semicolon used to separate the second and third items in the complex series."}, {"key": "2d-7", "label": "2d.7", "diff": "Hard", "src": "official", "oid": "9c3630b9", "stem": "Using natural debris, such as dried ______ such as plastic bags; and more traditional art supplies, such as tree glue, Ghanaian artist Ed Franklin Gavua creates his striking Yiiiiikakaii African masks, which he hopes can help viewers rethink how waste is used in their communities.", "choices": ["leaves, man-made trash:", "leaves; man-made trash,", "leaves, man-made trash,", "leaves; man-made trash;"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the punctuation of elements in a complex series. It’s conventional to use a semicolon to separate items in a complex series with internal punctuation, and in this choice, the semicolon after \"leaves\" is conventionally used to separate the first item (\"natural debris, such as dried leaves\") and the second item (\"man-made trash, such as plastic bags\") in the series of materials used by Gavua. Further, the comma after \"trash\" correctly separates the noun phrase \"man-made trash\" from the supplementary phrase (\"such as plastic bags\") that describes it. Choice A is incorrect because a comma after \"leaves\" doesn’t match the semicolon used later to separate the second and third items in the series (\"man-made...bags\" and \"and...glue\"). Additionally, it’s not conventional to use a colon in this way to separate a supplementary phrase (\"such as plastic bags\") from the noun phrase it modifies (\"man-made trash\"). Choice C is incorrect because a comma after \"leaves\" doesn’t match the semicolon used later to separate the second and third items in the series (\"man-made...bags\" and \"and...glue\"). Choice D is incorrect because it’s not conventional to use a semicolon in this way to separate a supplementary phrase (\"such as plastic bags\") from the noun phrase it modifies (\"man-made trash\")."}]}, {"code": "3a", "day": 3, "title": "Extra info: paired commas, dashes, brackets", "items": [{"key": "3a-1", "label": "3a.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The Registan, the historic heart of the city of ______ is framed by three monumental madrasas.", "choices": ["Samarkand", "Samarkand,", "Samarkand;", "Samarkand—"], "answer": 1, "rationale": "Choice B is the best answer. The phrase “the historic heart…Samarkand” is supplementary information about the Registan. It opens with a comma, so it must close with a comma. Choice A fails to close the phrase. Choice C incorrectly separates the subject (“The Registan”) from its verb (“is framed”). Choice D mixes a comma and a dash."}, {"key": "3a-2", "label": "3a.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "Ada Lovelace (often described as the first computer ______ wrote notes on Charles Babbage’s Analytical Engine that included an early algorithm.", "choices": ["programmer),", "programmer,", "programmer—", "programmer)"], "answer": 3, "rationale": "Choice D is the best answer. The parenthetical element opens with a parenthesis, so it must close with a parenthesis. No comma follows, because the closing parenthesis sits between the subject (“Ada Lovelace”) and the verb (“wrote”). Choice A adds a comma between the subject and the verb. Choices B and C fail to close the parentheses."}, {"key": "3a-3", "label": "3a.3", "diff": "Medium", "src": "official", "oid": "432b1ede", "stem": "The forty-seven geothermal springs of Arkansas’ Hot Springs National Park are sourced via a process known as natural groundwater recharge, in which rainwater percolates downward through the earth—in this case, the porous rocks of the hills around Hot ______ collect in a subterranean basin.", "choices": ["Springs to", "Springs: to", "Springs—to", "Springs, to"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the punctuation of a supplementary element within a sentence. The dash after “Springs” pairs with the dash after “earth” to separate the supplementary element “in this case, the porous rocks of the hills around Hot Springs” from the rest of the sentence. Choice A is incorrect because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence. Choice B is incorrect because a colon can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice D is incorrect because a comma can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence."}, {"key": "3a-4", "label": "3a.4", "diff": "Medium", "src": "official", "oid": "7f226b4b", "stem": "In a 2023 study, researchers documented a fascinating behavior in the aquatic plant Elodea densa. When exposed to low levels of light, the plant’s ______ the cellular organs that generate energy from light—reshuffled to form a tightly packed, glass-like surface ideal for collecting more light.", "choices": ["chloroplasts", "chloroplasts;", "chloroplasts,", "chloroplasts—"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the punctuation of a supplementary element within a sentence. The dash after \"chloroplasts\" pairs with the dash after \"from light\" to separate the supplementary element \"the cellular organs that generate energy from light\" from the rest of the sentence. This supplementary element functions to define the term \"chloroplasts,\" and the pair of dashes indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence. Choice B is incorrect because a semicolon can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice C is incorrect because a comma can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence."}, {"key": "3a-5", "label": "3a.5", "diff": "Medium", "src": "official", "oid": "2b512e65", "stem": "Eli Eisenberg, a genetics expert at Tel Aviv University in Israel, recently discovered that ______ have a special genetic ability called RNA editing that confers evolutionary advantages.", "choices": ["cephalopods, ocean dwellers that include the squid, the octopus, and the cuttlefish", "cephalopods—ocean dwellers—that include the squid, the octopus, and the cuttlefish,", "cephalopods, ocean dwellers that include: the squid, the octopus, and the cuttlefish,", "cephalopods—ocean dwellers that include the squid, the octopus, and the cuttlefish—"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the punctuation of a supplementary element within a sentence. In this choice, the dash after \"cephalopods\" pairs with the dash after \"cuttlefish\" to clearly separate the supplementary element \"ocean dwellers that include the squid, the octopus, and the cuttlefish\" from the rest of the sentence. This supplementary element functions to explain what cephalopods are, and the pair of dashes indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because it fails to use appropriate punctuation to separate the supplementary element that explains what cephalopods are from the rest of the sentence. Choice B is incorrect because it fails to use appropriate punctuation to separate the supplementary element that explains what cephalopods are from the rest of the sentence. Choice C is incorrect because it fails to use appropriate punctuation to separate the supplementary element that explains what cephalopods are from the rest of the sentence."}, {"key": "3a-6", "label": "3a.6", "diff": "Medium", "src": "official", "oid": "8f6d6ae6", "stem": "Archaeologists have estimated that the pre-Columbian Native American city of Cahokia, located across the Mississippi River from modern-day St. Louis, Missouri, had as many as 20,000 inhabitants in the year 1150 ______ it one of the largest cities in North America at the time.", "choices": ["CE making", "CE. Making", "CE, making", "CE; making"], "answer": 2, "rationale": "Choice C is the best answer. The phrase “making…at the time” provides additional information about Cahokia that’s not required for the sentence to make sense or function grammatically. As a nonessential supplement, this phrase should be separated from the rest of the sentence with a comma. Choice A is incorrect. This choice results in a run-on sentence. The nonessential descriptive aside “making…at the time” needs to be separated from the rest of the sentence with a comma. Choice B is incorrect. This choice results in a sentence fragment. “Making…at the time” doesn’t have a subject and can’t stand on its own as a sentence. Thus, it can’t be separated from the rest of the sentence with a period. Choice D is incorrect. This choice results in a punctuation error. “Making…at the time” doesn’t have a subject and can’t stand on its own as an independent clause. Since a semicolon can only link two independent clauses, using one here creates an error."}, {"key": "3a-7", "label": "3a.7", "diff": "Hard", "src": "official", "oid": "aacddbd8", "stem": "As jazz singer Sarah Vaughan honed her vocal abilities—acquiring a sophisticated timbre and precise control over pitch, dynamics, and ______ she earned comparisons to opera icon Leontyne Price, one of her personal heroes. The comparisons highlight how Vaughan, a jazz star, had transcended genre boundaries with her singing prowess.", "choices": ["vibrato:", "vibrato,", "vibrato—", "vibrato"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of punctuation within a sentence. The dash after “vibrato” pairs with the dash after “abilities” to separate the supplementary element (“acquiring...vibrato”) from the rest of the sentence. This supplementary element functions to describe the vocal abilities Vaughan developed, and the pair of dashes indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because a colon can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice B is incorrect because a comma can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice D is incorrect because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence."}, {"key": "3a-8", "label": "3a.8", "diff": "Hard", "src": "official", "oid": "6e071432", "stem": "In 1986, conceptual artist Sophie Calle asked twenty-three people, all of whom had been born without sight, to describe “their image of beauty” in rich detail. Calle paired excerpts of these conversations with photographs—both of interviewees and the items they ______ to powerful effect in her exhibition The Blind.", "choices": ["described, from hair to grass to sculptures", "described, from hair to grass to sculptures—", "described—from hair to grass to sculptures,", "described: from hair to grass to sculptures"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the punctuation of supplementary elements within a sentence. The comma after \"described\" separates the first supplementary element (\"both of interviewees and the items they described\") from the second supplementary element (\"from hair to grass to sculptures\"). Furthermore, the dash after \"sculptures\" pairs with the dash after \"photographs\" to separate these two supplementary elements from the rest of the sentence. The pair of dashes, which operate at a higher organizing level than the comma, indicates that the elements between the dashes function together—in this case, the second supplement (\"from…sculptures\") describes the range of items mentioned in the first supplement—and could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because it fails to appropriately punctuate the supplementary elements in the sentence. A dash is needed after \"sculptures\" to separate the supplementary elements (\"both…sculptures\") from the rest of the sentence. Choice C is incorrect because it fails to appropriately punctuate the supplementary elements in the sentence. The two supplementary elements \"both…described\" and \"from…sculptures\" function together to describe the photographs, and placing a dash between them would make this relationship less clear, suggesting that the supplement \"both...described\" is a standalone element that could be removed without affecting the grammatical coherence of the sentence, which isn’t the case. Choice D is incorrect because it fails to appropriately punctuate the supplementary elements in the sentence. A colon isn’t conventionally used in this way to separate a supplementary element (\"from hair to grass to sculptures\") from the noun phrase it is modifying (\"items they described\"). Additionally, a dash is needed after \"sculptures\" to separate the supplementary elements (\"both…sculptures\") from the rest of the sentence."}, {"key": "3a-9", "label": "3a.9", "diff": "Hard", "src": "official", "oid": "adf210e7", "stem": "The haiku-like poems of Tomas Tranströmer, which present nature- and dream-influenced images in crisp, spare language, have earned the Swedish poet praise from leading contemporary ______ them Nigerian American essayist and novelist Teju Cole, who has written that Tranströmer’s works “contain a luminous simplicity.”", "choices": ["writers. Among", "writers among", "writers; among", "writers, among"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation use between a main clause and a supplementary phrase. This choice correctly uses a comma to mark the boundary between the main clause (“The haiku-like…writers”) and the supplementary phrase (“among… Cole”) that specifies a contemporary writer who has praised Tomas Tranströmer’s haiku-like poems. Choice A is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “among.” Choice B is incorrect because it fails to mark the boundary between the main clause and the supplementary phrase with appropriate punctuation. Choice C is incorrect because a semicolon can’t be used in this way to join the main clause (“The haiku-like…writers”) and the supplementary phrase (“among…Cole”)."}, {"key": "3a-10", "label": "3a.10", "diff": "Hard", "src": "official", "oid": "e3c1b4f7", "stem": "Digital artist Jung (Lulu) Chen primarily uses a suite of software tools to create illustrations for children’s books. To manifest the warm and welcoming atmospheres that are a signature of her ______ she occasionally relies on more traditional art techniques, such as painting with watercolors.", "choices": ["work, though,", "work, though", "work; though,", "work, though;"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after \"work\" pairs with the comma after \"though\" to separate the supplementary element \"though\" from the rest of the sentence. This supplementary element signals that what follows is an exception to Chen using software tools to create illustrations, and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice B is incorrect because the comma after \"work\" must be paired with a comma after \"though\" to separate the supplementary element from the rest of the sentence. Choice C is incorrect because a semicolon can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence. Choice D is incorrect because a semicolon can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence."}, {"key": "3a-11", "label": "3a.11", "diff": "Hard", "src": "official", "oid": "5cc69ee1", "stem": "Dong Lai and Diego J. Muñoz’s work on circumbinary disk accretion—a process in which, due to gravity, material from an orbiting disk spirals inward and accumulates onto two stars or black holes—relies heavily on simulations. Lai and Muñoz recognize the need for direct ______ recommending evolving binary star systems as a promising avenue for future study.", "choices": ["observation; however,", "observation, however,", "observation. However,", "observation, however;"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after “observation” pairs with the comma after “however” to separate the supplementary adverb “however” from the rest of the sentence, which consists of a main clause (“Lai...observation”) followed by a participial phrase (“recommending...study”). Choice A is incorrect because a semicolon can’t be used in this way to join the main clause (“Lai...observation”) and the participial phrase (“recommending...study”) that follows the supplementary adverb “however.” A semicolon is conventionally used to join two main clauses, and “recommending...study” isn’t a main clause. Choice C is incorrect because placing a period after “observation” results in a rhetorically unacceptable sentence fragment beginning with “however.” Choice D is incorrect because a semicolon can’t be used in this way to join the main clause (“Lai...however”) and the participial phrase (“recommending...study”) that follows. A semicolon is conventionally used to join two main clauses, and “recommending...study” isn’t a main clause."}, {"key": "3a-12", "label": "3a.12", "diff": "Hard", "src": "official", "oid": "62120607", "stem": "From afar, African American fiber artist Bisa Butler’s portraits look like paintings, their depictions of human faces, bodies, and clothing so intricate that it seems only a fine brush could have rendered them. When viewed up close, however, the portraits reveal themselves to be ______ stitching barely visible among the thousands of pieces of printed, microcut fabric.", "choices": ["quilts, and the", "quilts, the", "quilts; the", "quilts. The"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is punctuation use between a main clause and a supplementary phrase. This choice correctly uses a comma to mark the boundary between the main clause (“the portraits...quilts”) and the supplementary noun phrase (“the stitching...fabric”) that provides a further description of how the portraits can be identified as quilts. Choice A is incorrect. A comma and the conjunction “and” can’t be used in this way to join a main clause and a supplementary noun phrase. Choice C is incorrect because a semicolon can’t be used in this way to join a main clause and a supplementary noun phrase. Choice D is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “the stitching.”"}]}, {"code": "3b", "day": 3, "title": "Titles and names", "items": [{"key": "3b-1", "label": "3b.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "Award-winning ______ Ngozi Adichie has written novels set in both Nigeria and the United States.", "choices": ["novelist, Chimamanda", "novelist Chimamanda", "novelist: Chimamanda", "novelist—Chimamanda"], "answer": 1, "rationale": "Choice B is the best answer. “Award-winning novelist” is a title placed directly before the name, so no punctuation separates the title from the name. Choices A, C, and D are incorrect because they place punctuation between the title and the name it introduces."}, {"key": "3b-2", "label": "3b.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "In a widely cited lecture, ______ described how a bacterial defense system could be turned into a precise gene-editing tool.", "choices": ["biochemist, Jennifer Doudna,", "biochemist, Jennifer Doudna", "biochemist Jennifer Doudna", "biochemist Jennifer Doudna,"], "answer": 2, "rationale": "Choice C is the best answer. “Biochemist” is a title directly before the name, and “biochemist Jennifer Doudna” is the subject of the verb “described,” so no punctuation is needed. Choice A treats the name as removable information, but without it the sentence wouldn’t say who gave the lecture. Choice B separates the title from the name. Choice D places a comma between the subject and its verb."}, {"key": "3b-t1", "label": "3b.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "Uzbekistan’s ______ is home to one of the oldest surviving copies of the Quran.", "choices": ["capital Tashkent", "capital, Tashkent", "capital Tashkent,", "capital, Tashkent,"], "answer": 3, "rationale": "Choice D is the best answer. A country has only one capital, so the name “Tashkent” adds nonessential information and must be set off by a pair of commas. Choice A is incorrect because because Uzbekistan has only one capital, the name is nonessential and needs commas on both sides. Choice B is incorrect because the nonessential name opens with a comma, so it must also close with a comma. Choice C is incorrect because a single comma separates the subject from its verb; nonessential information needs a pair of commas."}, {"key": "3b-3", "label": "3b.4", "diff": "Hard", "src": "official", "oid": "78e978b5", "stem": "The Organisation for Economic Co-operation and Development (OECD) tracks comparative price list data for its thirty-eight member countries. For instance, in July 2021, a hypothetical basket of goods priced at 100 US dollars (USD) in the United States would have cost 62 USD and 110 USD in fellow OECD ______ and Luxembourg, respectively.", "choices": ["nations, Chile", "nations; Chile", "nations: Chile", "nations Chile"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of punctuation between titles and proper nouns. No punctuation is needed to set off the coordinated noun phrase \"Chile and Luxembourg\" from the title that describes the two countries, \"fellow OECD nations.\" Because the proper nouns \"Chile and Luxembourg\" are essential information identifying the \"fellow OECD nations,\" no punctuation is necessary. Choice A is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Further, setting the countries’ names off with commas suggests that they could be removed without affecting the coherence of the sentence, which isn’t the case. Choice B is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Choice C is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Placing a colon after \"nations\" would confusingly suggest that these were the costs of the basket of goods for \"fellow OECD nations\" in general, not for Chile and Luxembourg specifically."}, {"key": "3b-4", "label": "3b.5", "diff": "Hard", "src": "official", "oid": "6d4b2e1e", "stem": "The 1977 play And the Soul Shall Dance depicts two Japanese American farming families in Depression-era Southern California. Critics have noted the way pioneering ______ compares the experiences of issei (Japanese nationals who emigrated to America) and nisei (their American-born children).", "choices": ["playwright, Wakako Yamauchi,", "playwright, Wakako Yamauchi", "playwright Wakako Yamauchi,", "playwright Wakako Yamauchi"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of punctuation between titles and proper nouns. No punctuation is needed to set off the proper noun \"Wakako Yamauchi\" from the title that describes Yamauchi, \"pioneering playwright.\" Because \"Wakako Yamauchi\" is essential information identifying the \"pioneering playwright,\" no punctuation is necessary. Choice A is incorrect because no punctuation is needed before or after the proper noun \"Wakako Yamauchi.\" Setting the playwright’s name off with commas suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case. Choice B is incorrect because no punctuation is needed between the title \"pioneering playwright\" and the proper noun \"Wakako Yamauchi.\" Choice C is incorrect because no punctuation is needed between the proper noun \"Wakako Yamauchi\" and the verb \"compares.\""}, {"key": "3b-5", "label": "3b.6", "diff": "Hard", "src": "official", "oid": "960dec02", "stem": "A recent study tracked the number of bee species present in twenty-seven New York apple orchards over a ten-year period. ______ found that when wild growth near an orchard was cleared, the number of different bee species visiting the orchard decreased.", "choices": ["Entomologist Heather Grab:", "Entomologist, Heather Grab,", "Entomologist Heather Grab", "Entomologist Heather Grab,"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is punctuation use between a name and title and between a subject and a verb. No punctuation is needed between the proper noun “Heather Grab” and “entomologist,” the title that describes Grab. Additionally, no punctuation is needed between the sentence’s subject (“Entomologist Heather Grab”) and the main verb (“found”) that indicates what Grab did. Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed. Setting the entomologist’s name off with commas suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case. Choice D is incorrect because no punctuation is needed between the subject and the verb."}, {"key": "3b-t2", "label": "3b.7", "diff": "Hard", "src": "practice", "oid": "", "stem": "Marie Curie’s ______ shared the 1903 Nobel Prize in Physics with her.", "choices": ["husband, Pierre,", "husband Pierre", "husband, Pierre", "husband Pierre,"], "answer": 0, "rationale": "Choice A is the best answer. Marie Curie had only one husband, so his name is nonessential information and must be set off by a pair of commas. Choice B is incorrect because with no commas, the name is treated as essential, as if she had several husbands. It is nonessential and needs commas. Choice C is incorrect because the nonessential name opens with a comma, so it must also close with a comma. Choice D is incorrect because a single comma separates the subject from its verb; nonessential information needs a pair of commas."}, {"key": "3b-6", "label": "3b.8", "diff": "Hard", "src": "official", "oid": "d4fe8f03", "stem": "Paintings by the renowned twentieth-century US ______ were featured in Artist to Artist, an exhibition at the Smithsonian Art Museum that paired the works of artists whose career trajectories intersected in meaningful ways.", "choices": ["artists: Thomas Hart Benton and Jackson Pollock,", "artists Thomas Hart Benton and Jackson Pollock", "artists Thomas Hart Benton, and Jackson Pollock,", "artists, Thomas Hart Benton and Jackson Pollock"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of punctuation around noun phrases. No punctuation is needed because the coordinated noun phrase \"Thomas Hart Benton and Jackson Pollock\" is a restrictive appositive, meaning that it provides essential identifying information about the noun phrase before it, \"the renowned twentieth-century US artists.\" Choice A is incorrect because no punctuation is needed between the noun phrase \"the renowned twentieth-century US artists\" and the restrictive appositive \"Thomas Hart Benton and Jackson Pollock.\" Additionally, no punctuation is needed between the sentence’s subject (\"paintings by the renowned twentieth-century US artists Thomas Hart Benton and Jackson Pollock\") and the main verb (\"were featured\"). Choice C is incorrect because no punctuation is needed between the coordinated elements \"Thomas Hart Benton\" and \"Jackson Pollock.\" Additionally, no punctuation is needed between the sentence’s subject (\"paintings by the renowned twentieth-century US artists Thomas Hart Benton and Jackson Pollock\") and the main verb (\"were featured\"). Choice D is incorrect because no punctuation is needed between the noun phrase \"the renowned twentieth-century US artists\" and the restrictive appositive \"Thomas Hart Benton and Jackson Pollock.\""}, {"key": "3b-7", "label": "3b.9", "diff": "Hard", "src": "official", "oid": "80aa7690", "stem": "The Austronesian language family includes Tagalog, Malagasy, and some 1,200 other languages throughout the Pacific, making it one of the largest language families in the world and of keen interest to ______ of the University of Toronto.", "choices": ["linguist, Diane Massam,", "linguist, Diane Massam", "linguist Diane Massam", "linguist: Diane Massam"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of punctuation between titles and proper nouns. No punctuation is needed to set off the proper noun \"Diane Massam\" from the title that describes Massam, \"linguist.\" Because \"Diane Massam\" is essential information identifying the \"linguist,\" no punctuation is necessary. Choice A is incorrect because no punctuation is needed before or after the proper noun \"Diane Massam.\" Setting the linguist’s name off with commas suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case. Choice B is incorrect because no punctuation is needed. Choice D is incorrect because no punctuation is needed."}, {"key": "3b-t3", "label": "3b.10", "diff": "Medium", "src": "practice", "oid": "", "stem": "______ a mathematician at Stanford University, became the first woman to win the Fields Medal in 2014.", "choices": ["Maryam Mirzakhani", "Maryam, Mirzakhani", "Maryam Mirzakhani,", "Maryam Mirzakhani—"], "answer": 2, "rationale": "Choice C is the best answer. “a mathematician at Stanford University” is nonessential information about the subject. It closes with a comma, so it must open with a comma after the name. Choice A is incorrect because the description closes with a comma, so it must also open with one after the name. Choice B is incorrect because a comma can’t split a person’s first and last name. Choice D is incorrect because the description closes with a comma, so it can’t open with a dash. Paired punctuation must match."}, {"key": "3b-8", "label": "3b.11", "diff": "Hard", "src": "official", "oid": "59a246dc", "stem": "When external forces are applied to common glass made from silicates, energy builds up around minuscule defects in the material, resulting in fractures. Recently, engineer Erkka Frankberg of Tampere University in Finland used the chemical ______ to make a glassy solid that can withstand higher strain than silicate glass can before fracturing.", "choices": ["compound, aluminum oxide", "compound aluminum oxide,", "compound, aluminum oxide,", "compound aluminum oxide"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of punctuation around noun phrases. No punctuation is needed because the noun phrase “aluminum oxide” is a restrictive appositive, meaning that it provides essential identifying information about the noun phrase before it, “the chemical compound,” and thus doesn’t require punctuation around it. Choice A is incorrect because no punctuation is needed. Choice B is incorrect because no punctuation is needed. Choice C is incorrect because the noun phrase “aluminum oxide” is a restrictive appositive. Setting the phrase off with punctuation suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case."}, {"key": "3b-9", "label": "3b.12", "diff": "Hard", "src": "official", "oid": "0a114526", "stem": "In 1937, Chinese American screen actor Anna May Wong, who had portrayed numerous villains and secondary characters but never a heroine, finally got a starring role in Paramount Pictures’ Daughter of Shanghai, a film that ______ “expanded the range of possibilities for Asian images on screen.”", "choices": ["critic, Stina Chyn, claims", "critic, Stina Chyn, claims,", "critic Stina Chyn claims", "critic Stina Chyn, claims,"], "answer": 2, "rationale": "Choice C is the best answer. The conventions being tested are punctuation use between titles and proper nouns and between verbs and integrated quotations. No punctuation is needed to set off the proper noun “Stina Chyn” from the title that describes Chyn, “critic.” Because “Stina Chyn” is essential information identifying the “critic,” no punctuation is necessary. Further, no punctuation is needed between the verb “claims” and the following quotation because the quotation is integrated into the structure of the sentence. Choice A is incorrect because no punctuation is needed before or after the proper noun “Stina Chyn.” Setting the critic’s name off with commas suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case. Choice B is incorrect because no punctuation is needed before or after the proper noun “Stina Chyn.” Setting the critic’s name off with commas suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case. Additionally, no punctuation is needed between “claims” and the integrated quotation. Choice D is incorrect because no punctuation is needed between the verb “claims” and its subject, “critic Stina Chyn.” Additionally, no punctuation is needed between the verb “claims” and the integrated quotation."}]}, {"code": "3c", "day": 3, "title": "Relative clauses: which / that", "items": [{"key": "3c-1", "label": "3c.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The ______ my grandfather built in 1965 still hangs on the wall of his workshop.", "choices": ["bicycle, which", "bicycle that", "bicycle, that", "bicycle which,"], "answer": 1, "rationale": "Choice B is the best answer. “That my grandfather built in 1965” is essential: it tells which bicycle is meant. Essential relative clauses use “that” and are not set off with commas. Choice A opens a nonessential clause but never closes it with a second comma. Choice C incorrectly places a comma before “that.” Choice D incorrectly places a comma after “which.”"}, {"key": "3c-2", "label": "3c.2", "diff": "Easy", "src": "practice", "oid": "", "stem": "The Amu Darya, ______ flows from the Pamir Mountains toward the Aral Sea, is one of the two major rivers of Central Asia.", "choices": ["that", "it", "which", "and it"], "answer": 2, "rationale": "Choice C is the best answer. The clause between the commas adds extra, nonessential information about a river that is already named, so it begins with “which.” Choice A is incorrect because “that” introduces essential clauses and isn’t used between commas like this. Choice B creates a comma splice inside the sentence. Choice D adds a second main clause that breaks the connection between the subject (“The Amu Darya”) and its verb (“is”)."}, {"key": "3c-3", "label": "3c.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "Researchers studied a population of ______ live only in caves in northeastern Mexico and have lost their eyesight over thousands of generations.", "choices": ["fish that", "fish, that", "fish; that", "fish. That"], "answer": 0, "rationale": "Choice A is the best answer. “That live only in caves…generations” is an essential clause that identifies which fish were studied, so no punctuation separates it from “fish.” Choice B incorrectly places a comma before “that.” Choice C is incorrect because a semicolon can’t introduce a relative clause. Choice D creates a fragment."}, {"key": "3c-4", "label": "3c.4", "diff": "Medium", "src": "practice", "oid": "", "stem": "The Ulugh Beg Observatory, ______ in the 1420s, housed an enormous instrument used to measure the positions of stars.", "choices": ["which was built", "that was built", "which was built,", "it was built"], "answer": 0, "rationale": "Choice A is the best answer. The observatory is already identified by name, so the clause “which was built in the 1420s” is nonessential and is set off by a pair of commas. Choice B is incorrect because “that” isn’t used for nonessential clauses set off by commas. Choice C adds an extra comma that splits the clause. Choice D creates a main clause inside the sentence, producing a comma splice."}, {"key": "3c-5", "label": "3c.5", "diff": "Medium", "src": "official", "oid": "d198997b", "stem": "Cy Twombly, a US painter and sculptor, created many large-scale abstract works, such as his 10-painting series Fifty Days at Iliam. In these works, Twombly’s artistic style is exemplified by his use of graffiti-like ______ often incorporate words or phrases from poetry and mythology.", "choices": ["scribbles: that", "scribbles that", "scribbles; that", "scribbles. That"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use and punctuation of a relative clause. This choice correctly uses the relative pronoun “that” and no punctuation to create an integrated relative clause that provides essential information about the noun phrase (“graffiti-like scribbles”) that it modifies. Choice A is incorrect because no punctuation is needed between the integrated relative clause beginning with “that often” and the noun phrase that it modifies (“graffiti-like scribbles”). Choice C is incorrect because no punctuation is needed between the integrated relative clause beginning with “that often” and the noun phrase that it modifies (“graffiti-like scribbles”). Choice D is incorrect because no punctuation is needed between the integrated relative clause beginning with “that often” and the noun phrase that it modifies (“graffiti-like scribbles”)."}, {"key": "3c-6", "label": "3c.6", "diff": "Hard", "src": "official", "oid": "13fcf575", "stem": "Roughly 300 nights a year, when the cold air descending from the Andes Mountains meets the warm air rising from Venezuela’s coastal Lake Maracaibo, the result is a spectacular lightning storm, its strikes so bright, so localized, and so ______ that it has become known as “Maracaibo’s Lighthouse.”", "choices": ["dependable:", "dependable;", "dependable", "dependable,"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the punctuation of an integrated relative clause. No punctuation is needed before the relative clause beginning with \"that\" because the content of the relative clause (\"that...Lighthouse\") is integral to the meaning of the coordinated adjectival phrase (\"so bright, so localized, and so dependable\") that it modifies. Choice A is incorrect because no punctuation is needed between the coordinated adjectival phrase (\"so bright...dependable\") and the integrated relative clause that modifies it. Choice B is incorrect because no punctuation is needed between the coordinated adjectival phrase (\"so bright...dependable\") and the integrated relative clause that modifies it. Choice D is incorrect because no punctuation is needed between the coordinated adjectival phrase (\"so bright...dependable\") and the integrated relative clause that modifies it."}, {"key": "3c-7", "label": "3c.7", "diff": "Hard", "src": "official", "oid": "6181924a", "stem": "Fernando Palma Rodríguez creates robotic sculptures that combine mechanical elements with materials like feathers, soil, and seeds. The artist is from a rural farming community outside Mexico City, and he studied engineering in college. The natural and mechanical ______ highlight these two aspects of his background.", "choices": ["materials that Palma Rodríguez uses in his art,", "materials that Palma Rodríguez uses in his art", "materials, that Palma Rodríguez uses in his art,", "materials, that Palma Rodríguez uses in his art"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the punctuation of an integrated relative clause within a sentence. No punctuation is needed between the noun phrase (“The natural and mechanical materials”) and the integrated relative clause (“that Palma Rodríguez uses in his art”). The integrated relative clause provides essential information about the materials, so no punctuation should separate it from the noun phrase it modifies. Additionally, no punctuation is needed between the sentence’s subject (“The natural and mechanical materials that Palma Rodríguez uses in his art”) and its main verb (“highlight”). Choice A is incorrect because no punctuation is needed between the sentence’s subject (“The natural...art”) and its main verb (“highlight”). Choice C is incorrect because no punctuation is needed between the noun phrase (“The natural...materials”) and the integrated relative clause (“that...art”) that modifies it. Additionally, no punctuation is needed between the sentence’s subject (“The natural...art”) and its main verb (“highlight”). Choice D is incorrect because no punctuation is needed between the noun phrase (“The natural...materials”) and the integrated relative clause (“that...art”) that modifies it."}, {"key": "3c-8", "label": "3c.8", "diff": "Hard", "src": "official", "oid": "5ef9fc48", "stem": "In biology, many initially disordered systems will naturally move toward greater order according to the principle of self-organization, a conceptual framework for pattern ______ biologists believe can be used to explain a range of organic phenomena, from population dynamics to the sociality of bees and ants.", "choices": ["formation, that some", "formation. Some", "formation that some", "formation; some"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use and punctuation of an integrated relative clause. In this choice, the relative pronoun “that” is used to create an integrated relative clause that modifies the preceding noun phrase “a conceptual framework for pattern formation.” No punctuation is necessary between the noun phrase and the relative clause because the relative clause is supplying essential information about the framework. Choice A is incorrect because no punctuation is needed between the noun phrase (“a conceptual…formation”) and the integrated relative clause beginning with “that.” Choice B is incorrect because it results in a confusing and ungrammatical sentence. Choice D is incorrect because it results in an ungrammatical sentence. A semicolon is used to join two main clauses or items in a complex series, and what follows “formation” is neither of these."}]}, {"code": "3d", "day": 3, "title": "No-punctuation zones", "items": [{"key": "3d-1", "label": "3d.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The large number of students who signed up for the robotics ______ the school to open a second class.", "choices": ["club, convinced", "club convinced", "club; con
