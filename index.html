est\" immediately after the modifying phrase illogically suggests that the contest wanted to celebrate the 100th anniversary of the Alaska Purchase. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase \"an award of $300\" immediately after the modifying phrase illogically suggests that the award of $300 wanted to celebrate the 100th anniversary of the Alaska Purchase. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase \"$300\" immediately after the modifying phrase illogically suggests that the $300 wanted to celebrate the 100th anniversary of the Alaska Purchase."}, {"key": "6c-5", "label": "6c.5", "diff": "Medium", "src": "official", "oid": "a14eef71", "stem": "In 2015, a team led by materials scientists Anirudha Sumant and Diana Berman succeeded in reducing the coefficient of friction (COF) between two surfaces to the lowest possible level—superlubricity. A nearly frictionless (and, as its name suggests, extremely slippery) state, ______", "choices": ["when their COF drops below 0.01, two surfaces reach superlubricity.", "two surfaces, when their COF drops below 0.01, reach superlubricity.", "reaching superlubricity occurs when two surfaces’ COF drops below 0.01.", "superlubricity is reached when two surfaces’ COF drops below 0.01."], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun “superlubricity” the subject of the sentence and places it immediately after the modifying phrase “a nearly frictionless…state.” In doing so, this choice clearly establishes that superlubricity—and not another noun in the sentence—is being described as nearly frictionless and extremely slippery. Choice A is incorrect because it results in a dangling modifier. Regardless of the introductory “when…” clause, the main subject “two surfaces” follows the modifying phrase (“A nearly frictionless…state”), illogically suggesting that the surfaces are the nearly frictionless, extremely slippery state. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “two surfaces” immediately after the modifying phrase illogically suggests that the surfaces are a nearly frictionless and extremely slippery state. Choice C is incorrect because it results in a dangling modifier. The placement of the gerund phrase “reaching superlubricity” immediately after the modifying phrase illogically suggests that the act of reaching superlubricity is the nearly frictionless, extremely slippery state."}, {"key": "6c-6", "label": "6c.6", "diff": "Hard", "src": "official", "oid": "b369d54c", "stem": "Woven from recycled yarn and hand tufted using a carpet weaving technique passed down by the artist’s Turkish grandmother, ______ so lush and tactilely inviting that you are tempted to reach out and touch them.", "choices": ["the topological tapestries of Argentine textile artist Alexandra Kehayoglou are", "the Argentine textile artist Alexandra Kehayoglou creates topological tapestries that are", "when she creates her topological tapestries, Argentine textile artist Alexandra Kehayoglou makes them", "Alexandra Kehayoglou is an Argentine textile artist whose topological tapestries are"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"topological tapestries\" the subject of the sentence and places it immediately after the modifying phrase \"woven…grandmother.\" In doing so, this choice clearly establishes that the topological tapestries—and not another noun in the sentence—are being described as woven from recycled yarn and hand tufted. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase \"Argentine textile artist Alexandra Kehayoglou\" immediately after the modifying phrase illogically suggests that Kehayoglou is woven from recycled yarn and hand tufted. Choice C is incorrect because it results in a dangling modifier. The placement of the pronoun \"she\" and the noun phrase \"Argentine textile artist Alexandra Kehayoglou\" after the modifying phrase illogically suggests that Kehayoglou is woven from recycled yarn and hand tufted. Choice D is incorrect because it results in a dangling modifier. The placement of the noun \"Alexandra Kehayoglou\" immediately after the modifying phrase illogically suggests that Kehayoglou is woven from recycled yarn and hand tufted."}, {"key": "6c-7", "label": "6c.7", "diff": "Hard", "src": "official", "oid": "dab8b8ee", "stem": "Known as Earth’s “living skin,” biocrusts are thin layers of soil held together by surface-dwelling microorganisms such as fungi, lichens, and cyanobacteria. Fortifying soil in arid ecosystems against erosion, ______", "choices": ["a recent study’s estimate is that these crusts reduce global dust emissions by 60 percent each year.", "an estimated 60 percent reduction in global dust emissions each year is due to these crusts, according to a recent study.", "these crusts reduce global dust emissions by an estimated 60 percent each year, according to a recent study.", "a recent study has estimated that these crusts reduce global dust emissions by 60 percent each year."], "answer": 2, "rationale": "Choice C is the best answer. The subject of the modifier \"fortifying soil in arid ecosystems against erosion\" is \"biocrusts.\" Subject-modifier placement requires a modifier and its subject to be next to each other, so \"biocrusts\" or some variant meaning \"biocrusts\" (in this case, \"these crusts\") must begin the missing clause. Choice A is incorrect. Modifiers and their subjects must go next to each other. The subject of the modifier \"fortifying soil in arid ecosystems against erosion\" is \"biocrusts,\" not \"a recent study’s estimate.\" Choice B is incorrect. Modifiers and their subjects must go next to each other. The subject of the modifier \"fortifying soil in arid ecosystems against erosion\" is \"biocrusts,\" not \"an estimated 60 percent reduction.\" Choice D is incorrect. Modifiers and their subjects must go next to each other. The subject of the modifier \"fortifying soil in arid ecosystems against erosion\" is \"biocrusts,\" not \"a recent study.\""}, {"key": "6c-8", "label": "6c.8", "diff": "Hard", "src": "official", "oid": "772835db", "stem": "Most of the ice found on Earth is ice Ih, distinguished by a crystalline structure in which molecules form a hexagonal pattern. Amorphous ice, on the other hand, constitutes most of the ice in the ultrafrigid environment of outer space. Defined by a disorganized molecular structure, ______", "choices": ["ice Ih contains crystals, whereas amorphous ice, which lacks the thermal energy to form them, does not.", "amorphous ice lacks the thermal energy to form the crystals found in ice Ih.", "the lack of thermal energy in amorphous ice explains its inability to form the crystals found in ice Ih.", "ice Ih differs from amorphous ice in that it possesses the thermal energy to form crystals."], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “amorphous ice” the subject of the sentence and places it immediately after the modifying phrase “defined…structure.” In doing so, this choice clearly establishes that amorphous ice—and not another noun in the sentence—is being described as having a disorganized molecular structure. Choice A is incorrect because it results in a dangling modifier. The placement of the noun “ice Ih” immediately after the modifying phrase illogically suggests that ice Ih has a disorganized molecular structure, whereas ice Ih is previously described as having molecules that form a hexagonal pattern. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “the lack of thermal energy” immediately after the modifying phrase illogically suggests that the lack of thermal energy has a disorganized molecular structure. Choice D is incorrect because it results in a dangling modifier. The placement of “ice Ih” immediately after the modifying phrase illogically suggests that ice Ih has a disorganized molecular structure, whereas ice Ih is previously described as having molecules that form a hexagonal pattern."}, {"key": "6c-9", "label": "6c.9", "diff": "Hard", "src": "official", "oid": "2dd1b8bf", "stem": "Compared to that of alumina glass, ______ silica glass atoms are so far apart that they are unable to re-form bonds after being separated.", "choices": ["silica glass is at a significant disadvantage due to its more dispersed atomic arrangement:", "silica glass has a more dispersed atomic arrangement, resulting in a significant disadvantage:", "a significant disadvantage of silica glass is that its atomic arrangement is more dispersed:", "silica glass’s atomic arrangement is more dispersed, resulting in a significant disadvantage:"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is subject-modifier placement. This choice makes “silica glass’s atomic arrangement” the subject of the sentence and places it immediately after the modifying phrase “compared to that of alumina glass.” In doing so, this choice clearly establishes that silica glass’s atomic arrangement—and not another noun in the sentence—is being compared to the atomic arrangement (“that”) of alumina glass. Choice A is incorrect because it results in a dangling modifier. The placement of the noun phrase “silica glass” immediately after the modifying phrase illogically suggests that silica glass itself (rather than its atomic arrangement) is being compared to alumina glass’s atomic arrangement. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “silica glass” immediately after the modifying phrase illogically suggests that silica glass itself (rather than its atomic arrangement) is being compared to alumina glass’s atomic arrangement. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “a significant disadvantage” immediately after the modifying phrase illogically suggests that “a significant disadvantage” is being compared to alumina glass’s atomic arrangement."}, {"key": "6c-10", "label": "6c.10", "diff": "Hard", "src": "official", "oid": "d2b81427", "stem": "In assessing the films of Japanese director Akira Kurosawa, ______ have missed his equally deep engagement with Japanese artistic traditions such as Noh theater.", "choices": ["many critics have focused on Kurosawa’s use of Western literary sources but", "Kurosawa’s use of Western literary sources has been the focus of many critics, who", "there are many critics who have focused on Kurosawa’s use of Western literary sources, but they", "the focus of many critics has been on Kurosawa’s use of Western literary sources; they"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “many critics” the subject of the sentence and places it immediately after the modifying phrase “in assessing…Kurosawa.” In doing so, this choice clearly establishes that it is the critics—and not another noun in the sentence—who assess Kurosawa’s films. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “Kurosawa’s…sources” immediately after the modifying phrase illogically suggests that his use of Western literary sources is what assesses Kurosawa’s films. Choice C is incorrect because it results in a dangling modifier. The placement of the function word “there” immediately after the modifying phrase illogically suggests that “there” is what assesses Kurosawa’s films. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase “the focus… critics” immediately after the modifying phrase illogically suggests that the critics’ focus is what assesses Kurosawa’s films."}, {"key": "6c-11", "label": "6c.11", "diff": "Hard", "src": "official", "oid": "2b6e1c06", "stem": "A government body officially known as the Althing, ______", "choices": ["the world’s oldest parliaments include one which first met in 930 CE, Iceland’s.", "Iceland’s parliament is one of the oldest in the world, first meeting in 930 CE.", "the first meeting of one of the oldest parliaments in the world, Iceland’s, was in 930 CE.", "930 CE was the year when Iceland’s parliament, one of the oldest parliaments in the world, first met."], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"Iceland’s parliament\" the subject of the sentence and places it immediately after the modifying phrase \"a government body officially known as the Althing.\" In doing so, this choice clearly establishes that Iceland’s parliament—and not another noun in the sentence—is the government body known as the Althing. Choice A is incorrect because it results in a dangling modifier. The placement of the noun phrase \"the world’s oldest parliaments\" immediately after the modifying phrase illogically suggests that the world’s oldest parliaments are a government body known as the Althing. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase \"the first meeting\" immediately after the modifying phrase illogically suggests that the first meeting of Iceland’s parliament was a government body known as the Althing. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase \"930 CE\" immediately after the modifying phrase illogically suggests that the year 930 CE is a government body known as the Althing."}]}], "mock": [{"key": "M-1", "label": "1", "diff": "Medium", "src": "official", "oid": "b1e8b87f", "sub": "3d", "stem": "Winding through the ice atop Norway’s Jotunheim Mountains is the Lendbreen pass, an ancient route that was used by hunters, farmers, traders, and travelers in the Middle Ages before eventually falling into disuse. Recently, archeologists have ______ knives, horseshoes, wool tunics, and thousands of other artifacts from the icy pass.", "choices": ["unearthed:", "unearthed,", "unearthed—", "unearthed"], "answer": 3, "rationale": "Choice D is the best answer. No punctuation should separate the verb \"unearthed\" and its objects (i.e, what was \"unearthed\"): \"knives, horseshoes, wool tunics, and thousands of other artifacts.\" Choice A is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a colon. Choice B is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a comma. Choice C is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a dash."}, {"key": "M-2", "label": "2", "diff": "Medium", "src": "official", "oid": "d073983d", "sub": "3d", "stem": "Known for her massive photorealistic paintings of African American figures floating or swimming in pools, Calida Garcia ______ was the logical choice to design the book cover for Ta-Nehisi Coates’s The Water Dancer, a novel about an African American man who can travel great distances through water.", "choices": ["Rawles—", "Rawles:", "Rawles,", "Rawles"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation between a subject and a verb. When, as in this case, a subject (“Calida Garcia Rawles”) is immediately followed by a verb (“was”), no punctuation is needed. Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed between the subject and the verb. Choice C is incorrect because no punctuation is needed between the subject and the verb."}, {"key": "M-3", "label": "3", "diff": "Hard", "src": "official", "oid": "2cb1ee22", "sub": "5b", "stem": "In premodern Europe, one could sail from the east coast of England to the Netherlands or France faster than one could travel by land to England’s capital, London. In that era, historian Michael Pye argues in his 2015 book The Edge of the World: A Cultural History of the North Sea and the Transformation of Europe, the North Sea did more to link the various peoples, cultures, and economies on ______ shores than to divide them.", "choices": ["its", "it’s", "they’re", "their"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of possessive determiners. The singular possessive determiner “its” agrees in number with the singular noun “the North Sea” and thus indicates that the shores are those of the North Sea. Choice B is incorrect because “it’s” is the contraction for “it is” or “it has,” not a possessive determiner. Choice C is incorrect because “they’re” is the contraction for “they are,” not a possessive determiner. Choice D is incorrect because the plural possessive determiner “their” doesn’t agree in number with the singular noun “the North Sea.”"}, {"key": "M-4", "label": "4", "diff": "Hard", "src": "official", "oid": "f78997cf", "sub": "2a", "stem": "Recent analysis of 32532 Thereus—an outer solar system object orbiting the Sun between Jupiter and Saturn—has determined its color to be gray, suggesting an icy composition. Such interpretations are ultimately ______ the object’s gray coloration may be an incidental effect of radiation, solar wind, or collisions with other objects rather than evidence of its physical makeup.", "choices": ["speculative, though", "speculative, though;", "speculative; though", "speculative, though,"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of punctuation in a sentence. This choice correctly uses a comma to separate the supplementary adverb \"though\" from the preceding main clause (\"Such interpretations are ultimately speculative\") and uses a semicolon to join the next main clause (\"the object’s...makeup\") to the rest of the sentence. Further, placing the semicolon after \"though\" indicates that the information in the preceding main clause (interpretations of an outer solar system object’s composition based on its color are ultimately speculative) is a qualification of the information in the previous sentence (the composition of an outer solar system object is suggested by its color). Choice A is incorrect because it fails to mark the boundary between the two main clauses with appropriate punctuation. Choice C is incorrect because placing the semicolon after \"speculative\" illogically indicates that the information in the next main clause (\"the object’s...makeup\") is a qualification of the information in the previous clause (\"Such...speculative\"). Choice D is incorrect because it results in a comma splice. Commas can’t be used in this way to punctuate a supplementary word or phrase between two main clauses."}, {"key": "M-5", "label": "5", "diff": "Hard", "src": "official", "oid": "886dc9f9", "sub": "1a", "stem": "On July 23, 1854, a clipper ship called the Flying Cloud entered San Francisco ______ left New York Harbor under the guidance of Captain Josiah Perkins Creesy and his wife, navigator Eleanor Creesy, a mere 89 days and 8 hours earlier, the celebrated ship set a record that would stand for 135 years.", "choices": ["Bay and having", "Bay. Having", "Bay, having", "Bay having"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period after “Bay” is used correctly to mark the boundary between one sentence (“On…Bay”) and another sentence that begins with a supplementary phrase (“Having… years”). Here, the supplementary phrase beginning with “having” modifies the subject of the second sentence, “the celebrated ship.” Choice A is incorrect. Without a comma preceding it, the conjunction “and” can’t be used in this way to join sentences. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to join two sentences. Choice D is incorrect because it results in a run-on sentence. The sentences (“On…Bay” and “having…years”) are fused without punctuation and/or a conjunction."}, {"key": "M-6", "label": "6", "diff": "Hard", "src": "official", "oid": "5aa171de", "sub": "2a", "stem": "Chondrites are stony meteorites that are undifferentiated—that is, their contents have not melted and separated into distinct layers. They are hardly ______ many chondrites experience aqueous alteration as a result of exposure to fluids, as well as fracturing, veining, and localized melting due to collisions with other objects.", "choices": ["pristine, though", "pristine, though;", "pristine; though", "pristine, though,"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a comma to separate the supplementary adverb \"though\" from the preceding main clause (\"They are hardly pristine\") and uses a semicolon to join the two main clauses (\"They…though\" and \"many…objects\"). Further, placing the semicolon after \"though\" indicates that the information in the preceding main clause (chondrites are far from pristine) is contrary to what might be assumed from the information in the previous sentence (chondrites have been generally unaltered by their environment). Choice A is incorrect because placing the comma after \"pristine\" and using \"though\" as a subordinating conjunction illogically indicates that the information in the next main clause (many chondrites have experienced damage) is lotches of color to represent the area’s features. Interestingly, the triangle representing the mountain itself ______ among the few defined figures in her paintings.", "choices": ["are", "have been", "were", "is"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is subject–verb agreement. The singular verb “is” agrees in number with the singular subject “the triangle.” Choice A is incorrect because the plural verb “are” doesn’t agree in number with the singular subject “the triangle.” Choice B is incorrect because the plural verb “have been” doesn’t agree in number with the singular subject “the triangle.” Choice C is incorrect because the plural verb “were” doesn’t agree in number with the singular subject “the triangle.”"}, {"key": "M-29", "label": "29", "diff": "Medium", "src": "official", "oid": "82a76537", "sub": "1c", "stem": "Key-value pairs are an important aspect of JavaScript Object Notation (JSON), an electronic file format for storing and transmitting data. Keys function as labels, while values contain the actual information. In a JSON file storing data about fire belly ______ instance, you could encounter a key such as “species” with the associated value of “Cynops orientalis.”", "choices": ["newts. For", "newts, for", "newts: for", "newts; for"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after “newts” pairs with the comma after “instance” to separate the supplementary element “for instance” from the rest of the sentence. The supplementary element appears between the prepositional phrase (“In…newts”) and the main clause of the sentence (“you…orientalis”) and signals that the sentence is presenting an example of how keys and values function in JSON files. Choice A is incorrect because it results in a sentence fragment (“In a JSON file storing data about fire belly newts”). Choice C is incorrect because a colon can’t be pai orest in Kerala, India, that is home to nearly 1,000 species of native flora (many of which are endangered), ______ instrumental in the government’s decision to preserve the forest.", "choices": ["are", "were", "have been", "was"], "answer": 3, "rationale": "Choice D is the best answer. The subject \"survey\" is singular, and so is the verb \"was.\" Choice A is incorrect. The subject \"survey\" is singular, but the verb \"are\" is plural. Choice B is incorrect. The subject \"survey\" is singular, but the verb \"were\" is plural. Choice C is incorrect. The subject \"survey\" is singular, but the verb \"have been\" is plural."}, {"key": "M-32", "label": "32", "diff": "Medium", "src": "official", "oid": "d2cf0e11", "sub": "5c", "stem": "Inventor John Friedman created a prototype of the first flexible straw by inserting a screw into a paper straw and, using dental floss, binding the straw tightly around the ______ When the floss and screw were removed, the resulting corrugations in the paper allowed the straw to bend easily over the edge of a glass.", "choices": ["screw’s thread’s.", "screws’ threads.", "screw’s threads.", "screws threads’."], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of plural and possessive nouns. The singular possessive noun “screw’s” and the plural noun “threads” correctly indicate that there is only one screw and it has multiple threads. Choice A is incorrect because the context requires the plural noun “threads,” not the singular possessive noun “thread’s.” Choice B is incorrect because the context requires the singular possessive noun “screw’s,” not the plural possessive noun “screws’.” Choice D is incorrect because the context requires the singular possessive noun “screw’s” and the plural noun “threads,” not the plural noun “screws” or the plural possessive noun “threads.’”"}, {"key": "M-33", "label": "33", "diff": "Medium", "src": "official", "oid": "36868920", "sub": "1a", "stem": "Increasin const RULES = {
"1a": `<p>Ikki <b>to‘liq gap</b> (har birida ega + kesim) yonma-yon kelsa, ularni faqat shular bilan ajratish mumkin: nuqta <b>.</b>, nuqtali vergul <b>;</b>, <b>vergul + and/but/so</b> yoki ikki nuqta <b>:</b>.</p><ul><li>Faqat vergul = <b>comma splice</b> (xato).</li><li>Hech narsa = <b>run-on</b> (xato).</li></ul>${N("It rained, we left early.")}${N("It rained we left early.")}${Y("It rained. We left early.")}<div class="tip">Tuzoq: ikkinchi gap <i>By…, With…, In…</i> yoki <i>-ing</i> so‘z bilan boshlansa ham, keyin ega + kesim kelsa, u <b>to‘liq gap</b>.</div>`,
"1b": `<p><b>Although, because, while, when, since, if, once, even though</b> bilan boshlangan qism <b>tobe qism</b>. U o‘zi gap bo‘la olmaydi.</p><ul><li>Gap boshida kelsa: <b>tobe qism + vergul + asosiy gap</b>.</li><li>Tobe qism bilan <b>and/but/so</b> birga kelmaydi.</li><li>Tobe qismdan keyin <b>;</b> yoki <b>.</b> qo‘yilmaydi.</li><li>Asosiy gapdan <b>keyin</b> kelsa, odatda vergul kerak emas.</li></ul>${Y("Although it rained, we left.")}${N("Although it rained, but we left.")}${N("Although it rained; we left.")}${Y("We left because it rained.")}`,
"1c": `<p>Ikki to‘liq gap <b>for, and, nor, but, or, yet, so</b> (FANBOYS) bilan qo‘shilsa: vergul bog‘lovchidan <b>oldin</b>.</p>${Y("It rained, but we left.")}${N("It rained but, we left.")}<div class="tip">Ikkinchi qismda <b>ega yo‘q</b> bo‘lsa (bitta egaga ikki kesim), vergul kerak emas: “She studied and passed.”</div>`,
"2a": `<p>Nuqtali vergul = nuqta. <b>Ikki tomonida ham to‘liq gap</b> bo‘lishi shart.</p><p><b>however, therefore, moreover, for example, in fact, though</b> ikki gapni bog‘lasa: <b>; however,</b></p>${Y("Prices rose; however, sales grew.")}${N("Prices rose, however, sales grew.")}<div class="tip">Eng qiyin turi: <i>however / though</i> qaysi gapga tegishli? Ma’nosiga qarang. Nuqtali vergul shu so‘zdan <b>oldin</b> yoki <b>keyin</b> turadi.</div>`,
"2b": `<p>Ikki nuqtadan <b>oldin to‘liq gap</b> bo‘lishi shart. Undan keyin: ro‘yxat, tushuntirish yoki misol.</p>${Y("She had one goal: 1500.")}${N("The goals were: speed and accuracy.")}${N("We studied topics such as: grammar and math.")}<div class="tip">Signal so‘zlar: <b>threefold, two reasons, one problem, the following</b>. Keyin ko‘pincha <b>:</b> keladi.</div>`,
"2c": `<p><b>Bitta tire</b> = ikki nuqta: to‘liq gapdan keyin tushuntirish beradi.</p><p><b>Ikkita tire</b> = ikkita vergul: qo‘shimcha ma’lumotni ikki tomondan o‘raydi. Tire bilan ochilgan qism <b>tire bilan yopiladi</b>.</p>${Y("The cause was simple—a loose wire.")}${Y("The mill—built in 1792—is now a museum.")}${N("The mill—built in 1792, is now a museum.")}`,
"2d": `<p>Ro‘yxat elementlarining <b>ichida vergul</b> bo‘lsa, elementlar orasiga <b>nuqtali vergul</b> qo‘yiladi.</p>${Y("Paris, France; Rome, Italy; and Tashkent, Uzbekistan")}<div class="tip">Avval qaysi vergul element <b>ichida</b>, qaysi biri elementlar <b>orasida</b> ekanini belgilab oling.</div>`,
"3a": `<p>Gapdan olib tashlasa ma’no buzilmaydigan <b>qo‘shimcha ma’lumot</b> ikki tomondan <b>bir xil</b> belgi bilan o‘raladi: <b>, … ,</b> yoki <b>— … —</b> yoki <b>( … )</b>.</p><ul><li>Belgilar <b>aralashtirilmaydi</b>.</li><li>Ochilgan belgini toping va xuddi shunisi bilan yoping.</li></ul>${Y("Tom, my friend, won the race.")}${N("Tom, my friend— won the race.")}${N("Tom (my friend), won the race.")}`,
"3b": `<p>Unvon yoki kasb nomi to‘g‘ridan-to‘g‘ri <b>ism oldidan</b> kelsa, orada <b>belgi yo‘q</b>.</p>${Y("biologist Rachel Carson argued…")}${N("biologist, Rachel Carson, argued…")}<div class="tip">Test: ismni olib tashlang. Gap kimni nazarda tutayotgani noma’lum bo‘lib qolsa, ism <b>zarur</b>, vergul qo‘yilmaydi.</div>`,
"3c": `<p><b>that</b>: zarur qism (qaysi biri ekanini aytadi), <b>vergulsiz</b>.</p><p><b>which</b>: qo‘shimcha ma’lumot, <b>ikki vergul</b> bilan.</p>${Y("The bike that my grandfather built still works.")}${Y("The Amu Darya, which flows from the Pamirs, is…")}${N("The bike, that my grandfather built, still works.")}<div class="tip">Ism (proper noun)dan keyin deyarli doim <b>, which … ,</b> keladi, chunki ism allaqachon kimligini aytgan.</div>`,
"3d": `<p>Bu joylarga <b>hech qanday belgi</b> qo‘yilmaydi:</p><ul><li>ega ↔ kesim (ega qanchalik uzun bo‘lsa ham)</li><li>kesim ↔ to‘ldiruvchi</li><li>predlog ↔ uning so‘zi</li><li>“said <b>that</b>”: that’dan oldin</li></ul>${Y("The number of students who joined the club convinced the school.")}${N("The number of students who joined the club, convinced the school.")}<div class="tip">“Hech narsa” javobi faqat shu joylarda to‘g‘ri. Ikki to‘liq gap orasida esa u run-on bo‘ladi.</div>`,
"4a": `<p><b>Haqiqiy egani</b> toping: “of …”, “in …”, “that/who …” qismlarini o‘chirib o‘qing. Kesim shu egaga mos keladi.</p><ul><li>Birlik ega → <b>is, was, has, includes</b></li><li>Ko‘plik ega → <b>are, were, have, include</b></li></ul>${Y("The list of names is long.")}${Y("The paintings that she made in Paris feature bright colors.")}${N("The collection of manuscripts include 4,000 documents.")}`,
"4b": `<ul><li><b>team, group, committee, orchestra</b> → birlik</li><li><b>each, every, either, neither</b> (yolg‘iz) → birlik</li><li><b>A and B</b> → ko‘plik</li><li><b>either A or B / neither A nor B</b> → yaqinroq egaga moslanadi</li><li><b>There is/are</b>, <b>Among X was Y</b> → ega kesimdan <b>keyin</b> keladi</li></ul>${Y("Each of the students was ready.")}${Y("Neither the coach nor the players were happy.")}${Y("There are two reasons.")}`,
"5a": `<p>Olmosh o‘zi almashtirayotgan otga <b>son jihatdan mos</b> bo‘ladi.</p><ul><li><b>company, team, city, country, government, study</b> → it / its</li><li><b>people, students, scientists</b> → they / their</li></ul>${Y("The company raised its prices.")}${N("The company raised their prices.")}<div class="tip">Olmosh kimga qaytayotganini toping va birlik/ko‘plikni tekshiring.</div>`,
"5b": `<ul><li><b>its</b> = uniki · <b>it’s</b> = it is</li><li><b>their</b> = ularning · <b>they’re</b> = they are · <b>there</b> = u yerda</li><li><b>whose</b> = kimning · <b>who’s</b> = who is</li></ul><div class="tip">Tekshiruv: <b>it’s</b> o‘rniga “it is” qo‘yib o‘qing. Ma’no chiqmasa, <b>its</b>.</div>${Y("The city is famous for its architecture.")}${N("The city is famous for it’s architecture.")}`,
"5c": `<ul><li>Ko‘plik: <b>students</b> (apostrof yo‘q)</li><li>Birlikda egalik: <b>student’s</b> book</li><li>Ko‘plikda egalik: <b>students’</b> books</li><li>Hech narsa tegishli bo‘lmasa, apostrof yo‘q</li></ul>${Y("the three scientists’ reports")}${N("two test’s")}<div class="tip">Apostrofli so‘zdan keyin <b>tegishli narsa</b> (ot) kelishi kerak. Kelmasa, apostrof kerak emas.</div>`,
"6a": `<p>Zamonni matndagi <b>boshqa fe’llar</b> va <b>vaqt so‘zlari</b> belgilaydi.</p><ul><li><b>In 1969, last year</b> → past (landed)</li><li><b>Since 2015, so far</b> → has/have + V3</li><li><b>By the time X happened</b> → had + V3</li><li><b>today, currently</b> → present</li></ul>${Y("Since 2015, the city has built 500 km of lanes.")}${N("Since 2015, the city built 500 km of lanes.")}`,
"6b": `<p>Har bir asosiy gapga <b>bitta haqiqiy kesim</b> (finite verb) kerak. <b>-ing</b>, <b>to + fe’l</b> va <b>having + V3</b> yolg‘iz kesim bo‘la olmaydi.</p>${Y("The city, with its clay walls, attracts tourists.")}${N("The city, with its clay walls, attracting tourists.")}<div class="tip">Uzun ega va vergullar orasidagi qo‘shimchadan keyin <b>asosiy kesim qolib ketmasin</b>.</div>`,
"6c": `<p>Gap boshidagi vergul bilan tugaydigan qism (<i>Walking home, / Born in 1483, / Known for…,</i>) dan keyin <b>darhol shu harakatni bajargan ega</b> kelishi shart.</p>${Y("Born in Andijan, Babur founded the Mughal Empire.")}${N("Born in Andijan, the Mughal Empire was founded by Babur.")}<div class="tip">Har bir variantda vergul ortidagi birinchi so‘zni o‘qing: “Kim tug‘ilgan / kim yurgan?” Javob shu so‘z bo‘lishi kerak.</div>`

const UNITS = [
  {n:1, name:"Gap chegarasi va ; : —", days:[1,2]},
  {n:2, name:"Qo‘shimcha ma’lumot va ega–kesim", days:[3,4]},
  {n:3, name:"Olmosh, fe’l va modifier", days:[5,6]}];
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
/* aralashtirish: har safar boshqa qoidadan savol (ketma-ket bir xil qoida kelmaydi), tartib doim bir xil */
function mix(groups, seed){
  const r=rng(seed), g=groups.map(a=>a.slice()), out=[]; let last=-1;
  while(g.some(a=>a.length)){
    let idx=g.map((a,i)=>i).filter(i=>g[i].length&&i!==last); if(!idx.length) idx=g.map((a,i)=>i).filter(i=>g[i].length);
    const tot=idx.reduce((s,i)=>s+g[i].length,0); let x=r()*tot, pick=idx[idx.length-1];
    for(const i of idx){ x-=g[i].length; if(x<0){pick=i;break;} }
    out.push(g[pick].shift()); last=pick;
  }
  return out;
}
function chunk(arr, size){ const n=Math.max(1,Math.round(arr.length/size)), out=[]; let s=0; for(let k=0;k<n;k++){ const e=Math.round((k+1)*arr.length/n); out.push(arr.slice(s,e)); s=e; } return out; }
function buildSets(){
  const sets=[];
  UNITS.forEach(u=>{
    const subs=BASE.filter(t=>u.days.includes(t.day));
    u.subs=subs.map(t=>t.code); u.total=subs.reduce((a,t)=>a+t.items.length,0);
    subs.forEach(t=>t.items.forEach(it=>it.sub=t.code));
    const by=d=>subs.map(t=>t.items.filter(i=>i.diff===d));
    const E=by("Easy"), Md=by("Medium"), H=by("Hard");
    const half=Math.round(u.total/2), easyN=E.reduce((a,x)=>a+x.length,0);
    const medMix=mix(Md, u.n*101), keepMed=new Set(medMix.slice(0,Math.max(0,half-easyN)));
    const dayA=mix(E,u.n*7).concat(mix(Md.map(a=>a.filter(i=>keepMed.has(i))),u.n*13));
    const dayB=mix(subs.map((t,k)=>Md[k].filter(i=>!keepMed.has(i)).concat(H[k])),u.n*29);
    const tIdx=new Set(Array.from({length:Math.min(10,dayB.length)},(_,k)=>Math.floor((k+.5)*dayB.length/10)));
    const test=dayB.filter((_,k)=>tIdx.has(k)), restB=dayB.filter((_,k)=>!tIdx.has(k));
    const add=(day,list,title,kind)=>{ const letter="abcdefgh"[sets.filter(s=>s.day===day).length];
      const code=`${day}${letter}`; list.forEach((it,k)=>it.label=`${code}.${k+1}`);
      sets.push({code,day,unit:u.n,title,kind,items:list,first:!sets.some(s=>s.unit===u.n)}); };
    chunk(dayA,10).forEach(l=>add(u.days[0],l,"Aralash to‘plam · oson va o‘rta","A"));
    chunk(restB,10).forEach(l=>add(u.days[1],l,"Aralash to‘plam · qiyin","B"));
    add(u.days[1],test,"Mavzu testi · hamma qoidalar aralash","test");
  });
  return sets;
}

function unlocked(i){ return i===0||tstat(T[i-1]).passed; }
function allPassed(){ return T.every(t=>tstat(t).passed); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function stemHTML(s){ return esc(s).replace(/_{4,}/g,'<span class="blank">&nbsp;</span>'); }

function lessonSteps(u){
  const st=[{type:"intro"}];
  UNITS[u-1].subs.forEach((c,ci)=>{ const p=ruleParts(c);
    st.push({type:"learn",code:c,n:ci+1,body:p.body});
    p.ex.slice(0,3).forEach(e=>st.push({type:"check",code:c,html:e.html,ok:e.ok}));
  });
  st.push({type:"done"});
  return st;
}
function openUnitLesson(u,start){
  closeLayer();
  const U=UNITS[u-1], st=lessonSteps(u), total=st.filter(s=>s.type==="check").length;
  let k=start||0, pick=null, answered=false, right=0, first=true;
  function paint(){
    const s=st[k], pct=Math.round(k/(st.length-1)*100); let body="", foot="", fb="";
    if(s.type==="intro"){
      body=`<div class="lsn-kick">${u}-katta mavzu</div><div class="lsn-h">${esc(U.name)}</div>
        <p class="lsn-p">${U.subs.length} ta qoida. Har biridan keyin 2–3 ta gap: to‘g‘rimi yoki xato?</p>
        <ol class="lsn-list">${U.subs.map(c=>`<li>${esc(SUBNAME[c])}</li>`).join("")}</ol>
        <p class="lsn-p" style="color:var(--muted)">Taxminan ${Math.round(st.length*.6)} daqiqa. Klaviatura: 1 / 2 tanlash, Enter davom etish.</p>`;
      foot=`<span class="sp"></span><button class="btn go" id="cont">Boshlash</button>`;
    } else if(s.type==="learn"){
      body=`<div class="lsn-kick">Qoida ${s.n} / ${U.subs.length}</div><div class="lsn-h">${esc(SUBNAME[s.code])}</div><div class="rule lsn-rule">${s.body}</div>
        ${LESSONS[s.code]?`<button class="chip play" id="anim"><span class="tri"></span>Animatsiyada ko‘rish</button>`:""}`;
      foot=`<span class="sp"></span><button class="btn go" id="cont">Tushundim</button>`;
    } else if(s.type==="check"){
      const good=answered&&(pick==="ok")===s.ok;
      body=`<div class="lsn-kick">Tekshiruv · ${esc(SUBNAME[s.code])}</div><div class="lsn-h">Bu gap qoidaga mosmi?</div>
        <div class="lsn-sent">${s.html}</div>
        <div class="lsn-opts">${[["ok","✓ To‘g‘ri"],["bad","✗ Xato"]].map(([v,l],x)=>{ let c=""; if(answered){ if((v==="ok")===s.ok)c="right"; else if(pick===v)c="wrong"; } else if(pick===v)c="sel";
          return `<button data-v="${v}" class="${c}" ${answered?"disabled":""}><span class="L">${x+1}</span>${l}</button>`; }).join("")}</div>`;
      if(!answered) foot=`<span class="sp"></span><button class="btn pri" id="ck" ${pick?"":"disabled"}>Tekshirish</button>`;
      else { fb=good?"ok":"bad"; foot=`<div class="lsn-fb"><b>${good?"To‘g‘ri":"Xato"}</b><span>${s.ok?"Bu gap qoidaga mos.":"Bu gap qoidani buzadi."}${good?"":" Qoidani yana bir bor o‘qing."}</span></div><span class="sp"></span><button class="btn ${good?'go':'dark'}" id="cont">Davom etish</button>`; }
    } else {
      S.ui.les=S.ui.les||{}; S.ui.les[u]=true; save();
      body=`<div class="lsn-done"><div class="lsn-h">Dars tugadi</div>
        ${total?`<p class="lsn-p">Tekshiruvlar: <b>${right} / ${total}</b> to‘g‘ri.</p>`:""}
        <p class="lsn-p"><b>${U.days[0]}-kun:</b> oson va o‘rta savollar, qoidalar aralash keladi.</p>
        <p class="lsn-p"><b>${U.days[1]}-kun:</b> qiyin savollar va mavzu testi.</p></div>`;
      foot=`<button class="btn" id="again">Darsni qaytadan</button><span class="sp"></span><button class="btn go" id="cont">Savollarga o‘tish</button>`;
    }
    document.getElementById("layer").innerHTML=`<div class="ov" ${first?"":'style="animation:none"'}><div class="md lsn ${first?"":"still"}">
      <div class="lsn-top"><button class="xbtn" id="x" aria-label="Yopish">×</button><div class="lsn-bar"><i style="width:${pct}%"></i></div><span class="kbd">${k} / ${st.length-1}</span></div>
      <div class="lsn-body">${body}</div>
      <div class="lsn-foot ${fb}">${foot}</div></div></div>`;
    first=false;
    document.getElementById("x").onclick=close;
    document.querySelectorAll(".lsn-opts button").forEach(b=>b.onclick=()=>{ if(answered)return; pick=b.dataset.v; paint(); });
    const ck=document.getElementById("ck"); if(ck) ck.onclick=check;
    const cont=document.getElementById("cont"); if(cont) cont.onclick=next;
    const an=document.getElementById("anim"); if(an) an.onclick=()=>openLesson(s.code,()=>openUnitLesson(u,k));
    const ag=document.getElementById("again"); if(ag) ag.onclick=()=>openUnitLesson(u,0);
    document.onkeydown=e=>{ if(e.key==="Escape")return close();
      if(s.type==="check"&&!answered&&(e.key==="1"||e.key==="2")){ pick=e.key==="1"?"ok":"bad"; paint(); return; }
      if(e.key==="Enter"){ e.preventDefault(); if(s.type==="check"&&!answered){ if(pick)check(); } else next(); } };
  }
  function check(){ answered=true; const good=(pick==="ok")===st[k].ok; if(good)right++; paint(); }
  function next(){
    if(st[k].type==="done"){ const i=T.findIndex(t=>t.unit===u); const j=T[i].items.findIndex(it=>!S.q[it.key]); if(unlocked(i)) openQ(i,j<0?0:j); else close(); return; }
    k++; pick=null; answered=false; paint();
  }
  paint();
}

/* ---- animated lesson player ---- */
function sentHTML(tokens){
  let h="", prev="";
  tokens.forEach(([txt,role,label],i)=>{
    const noBefore=/^[,.;:—)]/.test(txt), noAfter=/[(—]$/.test(prev);
    if(i&&!noBefore&&!noAfter) h+=" ";
    h+=`<span class="tk ${role||''}" style="--i:${i}"${label?` data-l="${esc(label)}"`:""}>${esc(txt)}</span>`; prev=txt;
  });
  return h;
}
function openLesson(code,back){
  closeLayer();
  const t={code,title:SUBNAME[code]}, L=LESSONS[code], AU=AUDIO[code]||[], hasAU=AU.some(a=>a&&a.f);
  let k=0, el=0, playing=hasAU||!calm(), last=performance.now(), raf=0, ended=false;
  const snd=new Audio(); snd.preload="auto";
  const voiced=n=>hasAU&&!S.ui.mute&&AU[n]&&AU[n].f;
  const dur=n=>voiced(n) ? Math.max(AU[n].d*1000+900, L[n].t.length*280+1200) : 2600+L[n].t.length*330+captHTML(L[n]).replace(/<[^>]+>/g,"").length*34;
  function sync(){ if(voiced(k)&&playing&&!ended&&el<AU[k].d*1000){ snd.play().catch(()=>{}); } else snd.pause(); }
  document.getElementById("layer").innerHTML=`<div class="ov"><div class="md player">
    <div class="md-h"><span class="lbl">${t.code}</span><span class="tt">${esc(t.title)}</span><button class="xbtn" id="x" aria-label="Yopish">×</button></div>
    <div class="segs" id="segs">${L.map((_,n)=>`<i data-n="${n}"><b></b></i>`).join("")}</div>
    <div class="stage" id="stage"></div><div class="capt" id="capt" aria-live="polite"></div>
    <div class="ctrl"><button class="pbtn" id="lp" aria-label="Oldingi sahna">◀</button><button class="pbtn main" id="pp" aria-label="Ijro / pauza"></button><button class="pbtn" id="ln" aria-label="Keyingi sahna">▶</button>
      <span class="kbd" id="cnt"></span><span class="sp"></span>${hasAU?`<button class="pbtn" id="mu" aria-label="Ovoz"></button>`:""}<span class="kbd">Probel: pauza · ← →</span>
      ${back?`<button class="btn go" id="go" style="font-size:14px;padding:7px 16px">← Orqaga</button>`:""}</div></div></div>`;
  const stage=document.getElementById("stage"), capt=document.getElementById("capt"), pp=document.getElementById("pp"), segs=[...document.querySelectorAll("#segs b")];
  function show(){
    const sc=L[k], vd=(sc.t.length*.28+.5).toFixed(2);
    stage.innerHTML=`<div class="sent">${sentHTML(sc.t)}</div>${sc.v?`<div class="verd ${sc.v}" style="--vd:${vd}s">${sc.v==="ok"?"✓ To‘g‘ri":"✗ Xato"}</div>`:""}`;
    capt.innerHTML=captHTML(sc); capt.style.animation="none"; void capt.offsetWidth; capt.style.animation="";
    document.getElementById("cnt").textContent=`${k+1} / ${L.length}`;
    document.getElementById("lp").disabled=k===0; ended=false;
    if(voiced(k)){ snd.src="audio/"+AU[k].f; snd.currentTime=0; } else { snd.pause(); snd.removeAttribute("src"); }
    btn();
  }
  function btn(){ pp.textContent=ended?"↻":playing?"❚❚":"▶"; stage.classList.toggle("paused",!playing&&!ended&&!calm());
    const mu=document.getElementById("mu"); if(mu){ mu.textContent=S.ui.mute?"🔇":"🔊"; mu.setAttribute("aria-pressed",!S.ui.mute); } sync(); }
  function go(n){ k=Math.max(0,Math.min(L.length-1,n)); el=0; show(); }
  function loop(now){
    if(playing&&!ended) el+=now-last; last=now;
    segs.forEach((b,n)=>b.style.width=(n<k?100:n>k?0:Math.min(100,el/dur(k)*100))+"%");
    if(playing&&el>=dur(k)){ if(k<L.length-1) go(k+1); else { ended=true; playing=false; btn(); } }
    raf=requestAnimationFrame(loop);
  }
  cleanup=()=>{ cancelAnimationFrame(raf); snd.pause(); snd.removeAttribute("src"); };
  pp.onclick=()=>{ if(ended){ playing=!calm(); go(0); } else { playing=!playing; btn(); } };
  document.getElementById("lp").onclick=()=>go(k-1);
  document.getElementById("ln").onclick=()=>{ if(k<L.length-1) go(k+1); else { el=dur(k); ended=true; playing=false; btn(); } };
  document.querySelectorAll("#segs i").forEach(s=>s.onclick=()=>go(+s.dataset.n));
  const mu=document.getElementById("mu"); if(mu) mu.onclick=()=>{ S.ui.mute=!S.ui.mute; save(); if(!S.ui.mute&&voiced(k)){ snd.src="audio/"+AU[k].f; snd.currentTime=Math.min(el/1000,AU[k].d); } btn(); };
  const leave=()=>back?back():close();
  document.getElementById("x").onclick=leave;
  const g=document.getElementById("go"); if(g) g.onclick=leave;
  document.onkeydown=e=>{ if(e.key==="Escape")return leave(); if(e.key===" "){e.preventDefault();pp.click();} if(e.key==="ArrowRight")document.getElementById("ln").click(); if(e.key==="ArrowLeft")go(k-1); };
  show(); raf=requestAnimationFrame(loop);
}

/* ---- question ---- */
function openQ(i,j,swap,review){
  closeLayer();
  const t=T[i], it=t.items[j], rec=S.q[it.key];
  let sel=null, checked=!!rec&&!review, retry=false, hint=false, live=false, passedNow=false;
  const canRetry=!!rec&&!rec.last;
  function paint(first){
    const showRes=checked&&!retry, r=S.q[it.key];
    const chs=it.choices.map((c,k)=>{ let cls=""; if(showRes){ if(k===it.answer)cls="right"+(live?" live":""); else if(k===r.sel)cls="wrong"+(live?" live":""); } else if(k===sel)cls="sel";
      return `<button class="${cls}" style="--i:${k}" data-k="${k}" ${showRes?"disabled":""}><span class="L">${"ABCD"[k]}</span><span>${esc(c)}</span></button>`; }).join("");
    const nextT=review ? nextDue(it.key) : (j<t.items.length-1?[i,j+1]:(i<T.length-1&&unlocked(i+1)?[i+1,0]:null));
    const right=showRes
      ? `${passedNow?`<div class="passed-banner">${t.code} o‘tdi.${i<T.length-1?` ${T[i+1].code} ochildi.`:" Mock ochildi."}</div>`:""}<div class="res ${r.last?'ok':'bad'}">${r.last?'To‘g‘ri':`Xato<span>Siz ${"ABCD"[r.sel]} ni tanladingiz, to‘g‘ri javob ${"ABCD"[it.answer]}.</span>`}</div><div class="cap">Tushuntirish</div><div class="rat">${ratHTML(it.rationale)}</div>`
      : `<div class="cap">Javob berishdan oldin</div><ol class="steps3">${BOUNDARY.has(it.sub)
          ?`<li>Bo‘sh joyning <b>chap</b> tomoni o‘zi to‘liq gapmi?</li><li><b>O‘ng</b> tomoni to‘liq gapmi, ro‘yxatmi yoki tobe qismmi?</li><li>Shunga mos belgini tanlang.</li>`
          :`<li>Bo‘sh joy qaysi so‘zga bog‘liq? <b>Ega</b>ni yoki <b>ot</b>ni toping.</li><li>Oradagi “of…”, “that…” qismlarini o‘chirib o‘qing.</li><li>Son va zamon mos kelishini tekshiring.</li>`}</ol>
         ${hint?`<div class="rule" style="font-size:14px;animation:fadeUp .3s both">${RULES[it.sub]}</div>`:`<button class="btn" id="hint">Qoidani ko‘rsatish</button> <button class="btn" id="vid">Animatsiyali dars</button>`}`;
    const prevOK=j>0||i>0;
    document.getElementById("layer").innerHTML=`<div class="ov" ${first&&!swap?"":'style="animation:none"'}><div class="md ${first&&!swap?"":"swap"}">
      <div class="md-h"><span class="lbl">${it.label}</span><span class="tt">${esc(t.title)}</span>${showRes?`<span class="pill ${it.diff}">${it.diff}</span>`:''}${showRes?`<span class="pill src">${it.src==='official'?'Official':'Mashq'}</span>`:''}${review?'<span class="pill" style="background:var(--hl);color:#14213D">Takrorlash</span>':''}<button class="xbtn" id="x" aria-label="Yopish">×</button></div>
      <div class="md-b"><div class="${first?'qpane':''}"><div class="stem">${stemHTML(it.stem)}</div><div class="prompt">${PROMPT}</div><div class="ch ${first?'':'still'}">${chs}</div></div><div>${right}</div></div>
      <div class="md-f"><span class="kbd">A–D: tanlash · Enter: tekshirish / keyingi · Esc: yopish</span><span class="sp"></span>
        <button class="btn" id="pv" ${prevOK?"":"disabled"}>Oldingi</button>
        ${showRes&&!r.last&&canRetry?`<button class="btn" id="rt">Qayta ishlash</button>`:""}
        ${showRes?`<button class="btn dark" id="nx" ${nextT?"":"disabled"}>${passedNow&&nextT?`${T[nextT[0]].code} ga o‘tish`:"Keyingi"}</button>`:`<button class="btn pri" id="ck" ${sel===null?"disabled":""}>Javobni tekshirish</button>`}
      </div></div></div>`;
    document.getElementById("x").onclick=close;
    document.querySelectorAll(".ch button").forEach(b=>b.onclick=()=>{ if(showRes)return; sel=+b.dataset.k; paint(); });
    const goNext=()=>{ if(!nextT)return; if(review) openQ(nextT[0],nextT[1],true,true); else if(passedNow&&T[nextT[0]].first&&!lessonDone(T[nextT[0]].unit)) openUnitLesson(T[nextT[0]].unit); else openQ(nextT[0],nextT[1],true); };
    document.getElementById("pv").onclick=()=>{ if(j>0)openQ(i,j-1,true); else if(i>0)openQ(i-1,T[i-1].items.length-1,true); };
    const ck=document.getElementById("ck"); if(ck)ck.onclick=check;
    const nx=document.getElementById("nx"); if(nx)nx.onclick=goNext;
    const rt=document.getElementById("rt"); if(rt)rt.onclick=()=>{retry=true;sel=null;live=false;paint(true);};
    const hb=document.getElementById("hint"); if(hb)hb.onclick=()=>{hint=true;paint();};
    const vb=document.getElementById("vid"); if(vb)vb.onclick=()=>openLesson(it.sub,()=>openQ(i,j,true,review));
    live=false;
    document.onkeydown=e=>{
      if(e.key==="Escape")return close();
      const m="abcd1234".indexOf(e.key.toLowerCase());
      if(m>=0&&!(checked&&!retry)){sel=m%4;paint();return;}
      if(e.key==="Enter"){ e.preventDefault(); if(checked&&!retry)goNext(); else if(sel!==null)check(); }
      if(e.key==="ArrowRight"&&checked&&!retry)goNext();
      if(e.key==="ArrowLeft")document.getElementById("pv").click();
    };
  }
  function check(){
    const ok=sel===it.answer, prev=S.q[it.key], was=tstat(t).passed;
    const rv=prev&&prev.rv?prev.rv:null; let nrv=rv;
    if(!ok) nrv={step:1,due:Date.now()+DAY};
    else if(rv&&!rv.done&&rv.due<=Date.now()) nrv=rv.step===1?{step:2,due:Date.now()+3*DAY}:{step:2,done:true};
    S.q[it.key]={first:prev?prev.first:ok,last:ok,sel,n:(prev?prev.n:0)+1,t:Date.now(),rv:nrv};
    S.streak=ok?(S.streak||0)+1:0; save();
    passedNow=!was&&tstat(t).passed; if(passedNow) justPassed=i; justAnswered=it.key;
    checked=true; retry=false; live=true; paint(); renderSide();
  }
  paint(true);
}

function resultsHTML(h){
  const by={}; M.forEach((q,k)=>{by[q.sub]=by[q.sub]||[0,0];by[q.sub][1]++;if(h.ans[k]===q.answer)by[q.sub][0]++;});
  const rows=Object.keys(by).sort().map(s=>`<tr><td><b>${s}</b></td><td>${esc(SUBNAME[s]||"")}</td><td><span class="cbar" style="width:${by[s][0]/by[s][1]*60}px"></span>${by[s][0]}/${by[s][1]}</td></tr>`).join("");
  const grid=M.map((q,k)=>`<button class="${h.ans[k]===q.answer?'ok':'bad'}" data-r="${k}">${k+1}</button>`).join("");
  return `<div class="card" style="margin-top:18px"><div class="cap">Oxirgi natija, ${new Date(h.date).toLocaleString()}</div>
    <div class="bigscore" style="color:${h.score>=36?'var(--ok)':'var(--ink)'}">${h.score}<span style="font-size:28px;color:var(--muted)">/40</span></div>
    <p>${h.score>=36?"Maqsadga yetdingiz.":"Maqsad 36/40. Jadvaldagi eng past mavzularni qayta ishlang."} Vaqt: ${Math.floor(h.secs/60)} daq ${h.secs%60} s</p>
    <table class="br"><tr><th>Kod</th><th>Mavzu</th><th>To‘g‘ri</th></tr>${rows}</table>
    <div class="cap" style="margin-top:16px">Tushuntirishni ko‘rish uchun savolni bosing</div><div class="mockgrid" id="rgrid">${grid}</div></div>`;
}
function reviewMock(h,k){
  const q=M[k], s=h.ans[k];
  const chs=q.choices.map((c,i)=>`<button disabled class="${i===q.answer?'right':i===s?'wrong':''}"><span class="L">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`).join("");
  document.getElementById("layer").innerHTML=`<div class="ov" style="animation:none"><div class="md swap"><div class="md-h"><span class="lbl">${k+1}</span><span class="tt">Mock: ${q.sub} ${esc(SUBNAME[q.sub]||"")}</span><span class="pill ${q.diff}">${q.diff}</span><button class="xbtn" id="x" aria-label="Yopish">×</button></div>
  <div class="md-b"><div><div class="stem">${stemHTML(q.stem)}</div><div class="prompt">${PROMPT}</div><div class="ch still">${chs}</div></div>
  <div><div class="res ${s===q.answer?'ok':'bad'}">${s===q.answer?'To‘g‘ri':(s===undefined?'Javob berilmagan.':`Sizning javobingiz ${"ABCD"[s]}.`)+` To‘g‘ri javob ${"ABCD"[q.answer]}.`}</div><div class="rat">${ratHTML(q.rationale)}</div></div></div>
  <div class="md-f"><span class="sp"></span><button class="btn" id="pv" ${k?"":"disabled"}>Oldingi</button><button class="btn dark" id="nx" ${k<M.length-1?"":"disabled"}>Keyingi</button></div></div></div>`;
  document.getElementById("x").onclick=()=>{document.getElementById("layer").innerHTML="";document.onkeydown=null;};
  document.getElementById("pv").onclick=()=>reviewMock(h,k-1);
  document.getElementById("nx").onclick=()=>reviewMock(h,k+1);
  document.onkeydown=e=>{ if(e.key==="Escape")document.getElementById("x").click(); if(e.key==="ArrowRight"&&k<M.length-1)reviewMock(h,k+1); if(e.key==="ArrowLeft"&&k)reviewMock(h,k-1); };
}
let timerId=null;
function examUI(){
  const cur=S.mock.cur; let k=0;
  const remain=()=>Math.max(0,MOCK_SECS-Math.floor((Date.now()-cur.start)/1000));
  const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  function paint(){
    const q=M[k];
    const chs=q.choices.map((c,i)=>`<button class="${cur.ans[k]===i?'sel':''}" data-k="${i}"><span class="L">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`).join("");
    const grid=M.map((_,i)=>`<button class="${i===k?'cur ':''}${cur.flag[i]?'flag':cur.ans[i]!==undefined?'ans':''}" data-g="${i}">${i+1}</button>`).join("");
    document.getElementById("layer").innerHTML=`<div class="ov" style="animation:none"><div class="md swap">
      <div class="md-h"><span class="lbl">${k+1} / 40</span><span class="tt">Mock</span><span class="timer" id="tm">${fmt(remain())}</span><button class="btn" id="fl">${cur.flag[k]?"⚑ Belgilangan":"⚐ Belgilash"}</button><button class="btn pri" id="fin">Tugatish</button></div>
      <div class="md-b"><div><div class="stem">${stemHTML(q.stem)}</div><div class="prompt">${PROMPT}</div><div class="ch still">${chs}</div></div>
      <div><div class="cap">${Object.keys(cur.ans).length}/40 savolga javob berilgan</div><div class="mockgrid">${grid}</div><p class="kbd" style="margin-top:14px">Ko‘k: javob berilgan. Sariq: belgilangan. Javoblar test tugagandan keyin ko‘rsatiladi.</p></div></div>
      <div class="md-f"><span class="kbd">A–D: tanlash · ← →: savollar</span><span class="sp"></span><button class="btn" id="pv" ${k?"":"disabled"}>Oldingi</button><button class="btn dark" id="nx" ${k<39?"":"disabled"}>Keyingi</button></div></div></div>`;
    document.querySelectorAll(".ch button").forEach(b=>b.onclick=()=>{cur.ans[k]=+b.dataset.k;save();paint();});
    document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{k=+b.dataset.g;paint();});
    document.getElementById("pv").onclick=()=>{k--;paint();};
    document.getElementById("nx").onclick=()=>{k++;paint();};
    document.getElementById("fl").onclick=()=>{cur.flag[k]=!cur.flag[k];save();paint();};
    document.getElementById("fin").onclick=()=>{ const left=40-Object.keys(cur.ans).length; const back=()=>{ if(S.mock.cur) paint(); };
      document.getElementById("layer").insertAdjacentHTML("beforeend",`<div class="ov" style="z-index:30" id="cf"><div class="md" style="width:min(440px,100%)"><div style="padding:24px 26px;font-weight:600">${left?`${left} ta savolga javob berilmagan. Mockni tugatasizmi?`:"Mockni tugatasizmi?"}</div><div class="md-f"><span class="sp"></span><button class="btn" id="no">Davom etish</button><button class="btn pri" id="ys">Tugatish</button></div></div></div>`);
      document.getElementById("no").onclick=()=>document.getElementById("cf").remove(); document.getElementById("ys").onclick=finish; };
    document.onkeydown=e=>{ const m="abcd".indexOf(e.key.toLowerCase()); if(m>=0){cur.ans[k]=m;save();paint();} if(e.key==="ArrowRight"&&k<39){k++;paint();} if(e.key==="ArrowLeft"&&k){k--;paint();} };
  }
  function tick(){ const el=document.getElementById("tm"), r=remain(); if(el){el.textContent=fmt(r);el.classList.toggle("low",r<300);} if(r<=0)finish(); }
  function finish(){
    clearInterval(timerId); timerId=null;
    const score=M.reduce((a,q,i)=>a+(cur.ans[i]===q.answer?1:0),0);
    S.mock.history.push({date:Date.now(),score,ans:cur.ans,secs:Math.min(MOCK_SECS,Math.floor((Date.now()-cur.start)/1000))});
    S.mock.cur=null; save(); document.getElementById("layer").innerHTML=""; document.onkeydown=null; view="mock"; render(); scrollTo(0,0);
  }
  if(remain()<=0)return finish();
  paint(); clearInterval(timerId); timerId=setInterval(tick,1000);
}

/* ================= break reminder ================= */
let workStart=Date.now(), toastOn=false;
setInterval(()=>{ if(toastOn||S.mock.cur||Date.now()-workStart<BREAK_MS)return; toastOn=true;
  document.getElementById("toast").innerHTML=`<div class="toast"><b>50 daqiqa bo‘ldi</b><p>10 daqiqa ekrandan uzoqlashing: suv iching, ko‘zingizni dam oldiring.</p><button class="btn pri" id="brk">Tanaffus qildim</button></div>`;
  document.getElementById("brk").onclick=()=>{document.getElementById("toast").innerHTML="";toastOn=false;workStart=Date.now();};
},30000);

applyUI(); render();
</script>
</body>
</html>
