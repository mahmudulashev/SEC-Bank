<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEC Bank</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'><defs><linearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'><stop%20offset='0'%20stop-color='%234A78F5'/><stop%20offset='1'%20stop-color='%231E44C2'/></linearGradient></defs><rect%20width='64'%20height='64'%20rx='14.4'%20fill='url(%23g)'/><g%20fill='white'><circle%20cx='32'%20cy='20'%20r='6.2'/><circle%20cx='32'%20cy='39.5'%20r='6.2'/><path%20d='M38.1%2040.6C39%2047.4%2035%2052.8%2028.2%2055.6L27%2053.4C30.9%2051.2%2032.9%2048.4%2032.6%2045.6Z'/></g></svg>">
<style>
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --sunk:#EEF0F4; --ink:#171C2B; --soft:#3F4659; --muted:#5D6578; --line:#E1E4EA; --line2:#CDD2DC;
  --blue:#2B59E0; --blue-h:#2149BF; --blue-t:#E8EEFD; --ok:#13875A; --ok-t:#E3F4EC; --bad:#C9373C; --bad-t:#FCE9EA; --hl:#F2C230;
  --e-bg:#E3F4EC; --e-fg:#0E6B47; --m-bg:#FBF0D2; --m-fg:#7A5300; --h-bg:#FBE4E5; --h-fg:#A3262B;
  --lock:#EEF0F4; --lock-fg:#7D8496; --board:#151B2C; --chalk:#F1F3F8;
  --sh:0 1px 2px rgba(20,28,45,.06),0 1px 1px rgba(20,28,45,.04);
  --sh-lg:0 12px 40px rgba(15,22,40,.18);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --read:"Charter","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
[data-theme="dark"]{
  --bg:#12151D; --panel:#1A1E29; --sunk:#151923; --ink:#E8EBF2; --soft:#C3C8D4; --muted:#9AA1B2; --line:#2A3040; --line2:#394054;
  --blue:#7B9BFF; --blue-h:#97B0FF; --blue-t:#1F2A4A; --ok:#45C98F; --ok-t:#14301F; --bad:#F2777B; --bad-t:#3A1A1C; --hl:#F2C230;
  --e-bg:#14301F; --e-fg:#7FDDB0; --m-bg:#382B0C; --m-fg:#F4CD6A; --h-bg:#3A1A1C; --h-fg:#FF9EA2;
  --lock:#1A1E29; --lock-fg:#6E7588; --board:#0D1018; --sh:none; --sh-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
b,strong{font-weight:600}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 16px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:18px;padding:0 6px}
.logo{flex:none;width:32px;height:32px}.logo svg{display:block;width:100%;height:100%}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.meter{margin:20px 6px 0;padding:0}
.meter .num{font-size:22px;font-weight:650;line-height:1.2}
.meter .num small{font-size:14px;color:var(--muted);font-weight:400}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .5s ease}
.meter .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.streak{font-weight:500;color:var(--ok)}
.nav{margin-top:18px;display:flex;flex-direction:column;gap:1px}
.nav h3{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 4px 10px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:14.5px;line-height:1.3}
.nav button:hover{background:var(--sunk)}
.nav button.on{background:var(--blue-t);color:var(--blue)}
.nav .ic{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--sunk);color:var(--soft)}
.nav .done .ic{background:var(--ok);color:#fff}
.nav .lockd{color:var(--lock-fg)}
.nav .lockd .ic{background:transparent;border:1px dashed var(--line2);color:var(--lock-fg)}
.nav .t{flex:1;min-width:0}
.nav .t small{display:block;font-size:12.5px;color:var(--muted)}
.nav .lockd .t small{color:var(--lock-fg)}
.nav .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toggles{display:flex;gap:6px;margin:22px 6px 0}
.toggles button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px;font-size:13px}
.toggles button:hover{background:var(--sunk)}
.toggles button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue)}
.side-foot{margin:12px 6px 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.side-foot button{all:unset;cursor:pointer;font-size:13px;color:var(--muted)}
.side-foot button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ---------- main ---------- */
main{padding:32px 44px 90px;max-width:1040px}
.view{animation:viewIn .25s ease both}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--sh)}
.hero .k{font-size:13px;color:var(--muted);margin-bottom:2px}
.hero h1{margin:0;font-size:22px;line-height:1.3;font-weight:650;letter-spacing:-.01em}
.hero p{margin:4px 0 0;color:var(--soft);font-size:15px}
.btn{border:1px solid var(--line2);border-radius:8px;padding:8px 16px;font-size:15px;font-weight:500;background:var(--panel);transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunk)}
.btn.pri,.btn.go{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover,.btn.go:hover{background:var(--blue-h);border-color:var(--blue-h)}
[data-theme="dark"] .btn.pri,[data-theme="dark"] .btn.go{color:#0E1424}
.btn.go{padding:10px 20px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.dark:hover{opacity:.88}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--panel)}
.btn.pri[disabled]:hover,.btn.go[disabled]:hover{background:var(--blue)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:13.5px;color:var(--muted);margin:14px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.day{margin-top:28px}
.day>h2{margin:0 0 2px;font-size:17px;font-weight:600;display:flex;align-items:baseline;gap:10px}
.day>h2 span{font-size:14px;font-weight:400;color:var(--muted)}
.row{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.rlab .t{font-weight:600;font-size:16px;line-height:1.3}
.rlab .st{font-size:13.5px;color:var(--muted);margin-top:3px}
.rlab .st strong{color:var(--ink);font-weight:500}
.stamp{display:inline-block;font-size:12.5px;font-weight:600;color:var(--ok);background:var(--ok-t);border-radius:5px;padding:0 6px;margin-left:8px}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:500;border:1px solid var(--line2);border-radius:8px;padding:6px 12px;background:var(--panel)}
.chip:hover{background:var(--sunk)}
.chip .tri{width:0;height:0;border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{position:relative;width:46px;height:46px;border:1px solid var(--line2);border-radius:9px;font-weight:500;font-size:15px;display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:border-color .12s,background .12s}
.tile:hover{border-color:var(--blue)}
.tile.blind{background:var(--panel);color:var(--ink)}
.tile.Easy{background:var(--e-bg);color:var(--e-fg);border-color:transparent}.tile.Medium{background:var(--m-bg);color:var(--m-fg);border-color:transparent}.tile.Hard{background:var(--h-bg);color:var(--h-fg);border-color:transparent}
.tile .bdg{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bg);display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.tile .bdg.ok{background:var(--ok)}.tile .bdg.bad{background:var(--bad)}
.tile .pr{position:absolute;bottom:4px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
.tile[disabled]{background:transparent;color:var(--lock-fg);border:1px dashed var(--line2);cursor:not-allowed}
.tile[disabled]:hover{border-color:var(--line2)}
.unit{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:36px 0 0;padding:0 0 14px;border-bottom:2px solid var(--ink)}
.unit .uk{font-size:13.5px;color:var(--muted)}
.unit h2{margin:2px 0;font-size:21px;font-weight:650;letter-spacing:-.01em}
.unit p{margin:0;color:var(--muted);font-size:14px}
.uacts{display:flex;gap:8px;flex-wrap:wrap}
.rh{font-size:17px;font-weight:600;margin:26px 0 8px;color:var(--ink)}
.rh:first-child{margin-top:0}
.lockmsg{font-size:13.5px;color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:22px 24px}
.card h1{margin:0 0 6px;font-size:22px;font-weight:650;letter-spacing:-.01em}
.card p{margin:6px 0;color:var(--soft);max-width:66ch}

/* ---------- lesson (step-by-step) ---------- */
.md.lsn{width:min(720px,100%);height:min(680px,calc(100vh - 36px))}
.md.lsn.still{animation:none}
.lsn-top{display:flex;align-items:center;gap:14px;padding:14px 18px 6px}
.lsn-bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.lsn-bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .35s ease}
.lsn-body{flex:1;overflow:auto;padding:18px 40px 24px;animation:fadeUp .25s both}
.lsn-kick{font-size:14px;color:var(--muted)}
.lsn-h{font-size:23px;font-weight:650;line-height:1.3;margin:2px 0 16px;letter-spacing:-.01em}
.lsn-p{font-size:16px;line-height:1.6;margin:0 0 12px;max-width:62ch}
.lsn-list{margin:4px 0 16px;padding-left:22px;line-height:1.8;font-size:16px}
.lsn-rule{font-size:16.5px;line-height:1.65;margin-bottom:16px}
.lsn-sent{font-family:var(--read);font-size:22px;line-height:1.5;padding:20px 22px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.lsn-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.lsn-opts button{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);font:inherit;font-weight:500;font-size:17px;color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s}
.lsn-opts button:hover:not([disabled]){background:var(--sunk)}
.lsn-opts button.sel{background:var(--blue-t);border-color:var(--blue);color:var(--blue)}
.lsn-opts button.right{background:var(--ok-t);border-color:var(--ok);color:var(--e-fg)}
.lsn-opts button.wrong{background:var(--bad-t);border-color:var(--bad);color:var(--h-fg)}
.lsn-opts button[disabled]{cursor:default}
.lsn-opts .L{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:0 6px}
.lsn-foot{display:flex;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--line);min-height:72px}
.lsn-foot.ok{background:var(--ok-t);border-top-color:transparent}
.lsn-foot.bad{background:var(--bad-t);border-top-color:transparent}
.lsn-fb{display:flex;flex-direction:column;gap:2px;font-size:15px}
.lsn-fb b{font-size:17px}
.lsn-foot.ok .lsn-fb b{color:var(--e-fg)}.lsn-foot.bad .lsn-fb b{color:var(--h-fg)}
.lsn-foot .sp{flex:1}
.lsn-done{padding-top:20px}
@media (max-width:600px){.lsn-body{padding:12px 18px}.lsn-opts{grid-template-columns:1fr}.lsn-h{font-size:20px}.lsn-sent{font-size:19px}}

/* ---------- keyframes ---------- */
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes tkpop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes mdIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sweep{from{background-size:0 100%}to{background-size:100% 100%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(12,16,28,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20;animation:ovIn .15s both}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);width:min(1140px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;overflow:hidden;animation:mdIn .2s ease both}
.md.swap{animation:none}
.md-h{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.lbl{font-weight:600;font-size:15px;background:var(--blue-t);color:var(--blue);border-radius:6px;padding:2px 9px;font-variant-numeric:tabular-nums}
.md-h .tt{font-weight:500;color:var(--soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12.5px;font-weight:500;border-radius:5px;padding:2px 8px}
.pill.Easy{background:var(--e-bg);color:var(--e-fg)}.pill.Medium{background:var(--m-bg);color:var(--m-fg)}.pill.Hard{background:var(--h-bg);color:var(--h-fg)}
.pill.src{background:var(--sunk);color:var(--soft)}
.xbtn{all:unset;cursor:pointer;margin-left:auto;flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.xbtn:hover{background:var(--sunk);color:var(--ink)}
.md-b{display:grid;grid-template-columns:1.1fr 1fr;flex:1;min-height:0}
.md-b>div{padding:26px 30px;overflow:auto}
.md-b>div:first-child{border-right:1px solid var(--line)}
.qpane{animation:fadeUp .2s both}
.stem{font:400 19px/1.7 var(--read)}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--blue)}
.prompt{font-size:14.5px;line-height:1.5;margin:18px 0 14px;color:var(--muted)}
.ch{display:flex;flex-direction:column;gap:8px}
.ch button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:10px;padding:11px 14px;background:var(--panel);font:400 17.5px/1.4 var(--read);transition:background .12s,border-color .12s}
.ch button .L{flex:none;width:26px;height:26px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--ui);color:var(--soft)}
.ch button:not([disabled]):hover{background:var(--sunk);border-color:var(--muted)}
.ch button.sel{background:var(--blue-t);border-color:var(--blue)}
.ch button.sel .L{background:var(--blue);border-color:var(--blue);color:#fff}
.ch button.right{background:var(--ok-t);border-color:var(--ok)}
.ch button.right .L{background:var(--ok);border-color:var(--ok);color:#fff}
.ch button.wrong{background:var(--bad-t);border-color:var(--bad)}
.ch button.wrong .L{background:var(--bad);border-color:var(--bad);color:#fff}
.ch button.wrong.live{animation:shake .35s}
.ch button[disabled]{cursor:default}
.ch.still button{animation:none}
.res{border-radius:10px;padding:10px 14px;font-weight:600;margin-bottom:18px;font-size:16px}
.res.ok{background:var(--ok-t);color:var(--e-fg)}.res.bad{background:var(--bad-t);color:var(--h-fg)}
.res span{display:block;font-weight:400;font-size:15px;color:var(--soft);margin-top:2px}
.passed-banner{background:var(--ok);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;margin-bottom:10px}
.rat{font:400 16.5px/1.7 var(--read);max-width:60ch}
.rat p{margin:0 0 12px}
.cap{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.steps3{list-style:none;margin:0 0 18px;padding:0;counter-reset:s}
.steps3 li{counter-increment:s;display:flex;gap:10px;align-items:baseline;padding:6px 0;font-size:15px;color:var(--soft)}
.steps3 li::before{content:counter(s) ".";flex:none;width:16px;font-weight:600;color:var(--muted)}
.hintbox{background:var(--sunk);border-radius:10px;padding:14px 16px;font-size:14.5px;margin-top:20px}
.hintbox b.h{display:block;margin-bottom:6px}
table.steps{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.steps td,table.steps th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.steps th{font-size:13px;font-weight:600;color:var(--muted)}
code{font:500 14px/1 ui-monospace,"SF Mono",Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.md-f{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.md-f .sp{flex:1}
.kbd{font-size:13px;color:var(--muted)}
.rule{font-size:16px;line-height:1.65}
.rule h3{margin:0 0 8px;font-size:19px;font-weight:600}
.rule p{margin:0 0 10px}
.rule ul{margin:6px 0 12px;padding-left:20px}
.rule li{margin:4px 0}
.ex{font-family:var(--read);font-size:17px;background:var(--sunk);border-radius:8px;padding:8px 12px;margin:6px 0}
.ex .y{color:var(--ok);font-weight:700;font-family:var(--ui);margin-right:8px}
.ex .n{color:var(--bad);font-weight:700;font-family:var(--ui);margin-right:8px}
.tip{border-left:3px solid var(--blue);padding:8px 14px;background:var(--blue-t);border-radius:0 8px 8px 0;margin:12px 0}

/* ---------- animated lesson player ---------- */
.player{width:min(900px,100%);background:var(--board);color:var(--chalk);border-color:#252C40}
.player .md-h{border-bottom-color:#252C40}
.player .md-h .tt{color:#C9CFDD}
.player .lbl{background:#24304F;color:#B8C8FF}
.player .xbtn{color:#9AA3B8}.player .xbtn:hover{background:#232A3D;color:#fff}
.segs{display:flex;gap:4px;padding:12px 18px 0}
.segs i{flex:1;height:4px;border-radius:2px;background:#2A3146;overflow:hidden;cursor:pointer}
.segs i b{display:block;height:100%;width:0;background:#E9EDF7;border-radius:2px}
.stage{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 34px 18px;text-align:center;position:relative;overflow:hidden}
.stage.paused *{animation-play-state:paused !important}
.sent{font:400 clamp(22px,3.2vw,34px)/2.3 var(--read);max-width:22em}
.tk{display:inline-block;position:relative;opacity:0;animation:fadeUp .4s both;animation-delay:calc(var(--i)*.28s);padding:0 .08em;line-height:1.35;border-radius:4px}
.tk[data-l]::after{content:attr(data-l);position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font:500 13px/1 var(--ui);margin-top:8px}
.tk.m{border-bottom:3px solid #6C8CFF}.tk.m::after{color:#A9BCFF}
.tk.d{border-bottom:3px dashed #A98EF5}.tk.d::after{color:#CBBBFF}
.tk.s{background:linear-gradient(#5C4C14,#5C4C14) no-repeat left/0 100%;animation:fadeUp .4s both,sweep .5s both;animation-delay:calc(var(--i)*.28s),calc(var(--i)*.28s + .35s)}.tk.s::after{color:#F2D06B}
.tk.v{background:linear-gradient(#1C3F72,#1C3F72) no-repeat left/0 100%;animation:fadeUp .4s both,sweep .5s both;animation-delay:calc(var(--i)*.28s),calc(var(--i)*.28s + .35s)}.tk.v::after{color:#9CCBFF}
.tk.x{color:#8B94AD;font-style:italic}.tk.x::after{color:#9AA3B8;font-style:normal}
.tk.g{color:#6FDDA9}.tk.g::after{color:#6FDDA9}
.tk.w{color:#FF8C90;text-decoration:line-through 2px}
.tk.ok,.tk.bad{font-weight:700;font-size:1.25em;line-height:1;padding:0 .12em;animation:tkpop .35s ease-out both;animation-delay:calc(var(--i)*.28s)}
.tk.ok{color:#6FDDA9}
.tk.bad{color:#FF8C90}
.tk.q{min-width:1.6em;border-bottom:3px solid #E9EDF7;animation:fadeUp .4s both,pulse 1.4s infinite;animation-delay:calc(var(--i)*.28s),calc(var(--i)*.28s + .5s);color:transparent}
.verd{margin-top:30px;font:600 15px/1 var(--ui);padding:6px 14px;border-radius:6px;opacity:0;animation:fadeUp .3s both;animation-delay:var(--vd)}
.verd.ok{color:#6FDDA9;background:rgba(69,201,143,.12)}.verd.bad{color:#FF8C90;background:rgba(242,119,123,.12)}
.capt{min-height:84px;max-width:760px;margin:0 auto;padding:0 40px 8px;text-align:center;font-size:17px;line-height:1.55;color:#D5DAE6;animation:fadeUp .3s both}
.capt b{color:#fff;font-weight:600}
.ctrl{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid #252C40}
.ctrl .sp{flex:1}
.ctrl .kbd{color:#9AA3B8}
.pbtn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#232A3D;font-size:14px}
.pbtn:hover{background:#2E3650}
.pbtn.main{width:46px;height:46px;background:#E9EDF7;color:#151B2C}
.pbtn[disabled]{opacity:.35;cursor:default}

/* ---------- lists, mock ---------- */
.list{display:flex;flex-direction:column;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--sunk)}
.li .q{flex:1;font:400 16px/1.4 var(--read);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);margin-top:16px}
.bigscore{font-size:56px;font-weight:650;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.mockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.mockgrid button{border:1px solid var(--line2);border-radius:7px;height:36px;font-weight:500;background:var(--panel);font-variant-numeric:tabular-nums}
.mockgrid button.ans{background:var(--blue-t);color:var(--blue);border-color:transparent}
.mockgrid button.cur{outline:2px solid var(--blue);outline-offset:1px}
.mockgrid button.flag{background:var(--m-bg);color:var(--m-fg);border-color:transparent}
.mockgrid button.ok{background:var(--e-bg);color:var(--e-fg);border-color:transparent}
.mockgrid button.bad{background:var(--h-bg);color:var(--h-fg);border-color:transparent}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px}
.timer.low{color:var(--bad)}
table.br{border-collapse:collapse;margin-top:12px;font-size:15px}
table.br td,table.br th{padding:7px 16px 7px 0;border-bottom:1px solid var(--line);text-align:left}
table.br th{font-size:13px;font-weight:600;color:var(--muted)}
.cbar{display:inline-block;height:6px;border-radius:3px;background:var(--ok);vertical-align:middle;margin-right:8px}

.toast{position:fixed;right:22px;bottom:22px;z-index:40;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);padding:14px 16px;animation:mdIn .25s both}
.toast b{display:block;font-size:15px;margin-bottom:2px}
.toast p{margin:0 0 10px;font-size:14.5px;color:var(--soft)}

body.calm *,body.calm *::before,body.calm *::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:20px 16px 70px}
  .row{grid-template-columns:1fr;gap:10px}
  .md-b{grid-template-columns:1fr;overflow:auto}
  .md-b>div{overflow:visible;padding:20px}
  .md-b>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
  .md-f .kbd,.ctrl .kbd,.md-h .tt{display:none}
  .stage{padding:20px 16px 10px;min-height:260px}
  .capt{padding:0 16px 6px;font-size:15.5px}
}
</style>
</head>

<div id="layer"></div><div id="toast"></div>

<script>
const DATA = {"topics": [{"code": "1a", "day": 1, "title": "Two sentences: period, comma splice, run-on", "items": [{"key": "1a-1", "label": "1a.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "The Silk Road was not a single road but a network of trade ______ connected China with the Mediterranean world for more than a thousand years.", "choices": ["routes, it", "routes it", "routes. It", "routes and, it"], "answer": 2, "rationale": "Choice C is the best answer. “The Silk Road…trade routes” and “It connected China…years” are both main clauses, so they must be separated as two sentences. A period does this. Choice A is incorrect because a comma alone between two main clauses creates a comma splice. Choice B is incorrect because it fuses the two main clauses without punctuation (a run-on). Choice D is incorrect because the comma after “and” is misplaced; a comma would go before “and,” not after it."}, {"key": "1a-2", "label": "1a.2", "diff": "Easy", "src": "practice", "oid": "", "stem": "Honeybees communicate the location of food through a movement called the waggle ______ angle of the dance shows the direction of the food relative to the sun.", "choices": ["dance, the", "dance the", "dance. The", "dance, and, the"], "answer": 2, "rationale": "Choice C is the best answer. “Honeybees communicate…waggle dance” and “The angle…sun” are two main clauses. A period correctly separates them into two sentences. Choice A creates a comma splice. Choice B creates a run-on sentence. Choice D places an unnecessary comma after “and.”"}, {"key": "1a-3", "label": "1a.3", "diff": "Medium", "src": "official", "oid": "fcab3630", "stem": "In his Naturalis historia, Pliny the Elder praised Hipparchus’s star catalog, a second-century BCE list of roughly 850 different stars’ celestial positions. For centuries, scholars dreamed about locating a copy of this legendary lost ______ fantasy (partially) became reality in 2022, when researchers uncovered traces of the star catalog on a palimpsest, a reused parchment.", "choices": ["work, that", "work that", "work. That", "work and that"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"For…work\") and another (\"That…parchment\"). Choice A is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice B is incorrect because it results in a run-on sentence. The sentences (\"For…work\" and \"that…parchment\") are fused without punctuation and/or a conjunction. Choice D is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join sentences."}, {"key": "1a-4", "label": "1a.4", "diff": "Medium", "src": "official", "oid": "267a13e2", "stem": "In 2010, archaeologist Noel Hidalgo Tan was visiting the twelfth-century temple of Angkor Wat in Cambodia when he noticed markings of red paint on the temple ______ the help of digital imaging techniques, he discovered the markings to be part of an elaborate mural containing over 200 paintings.", "choices": ["walls, with", "walls with", "walls so with", "walls. With"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period after “walls” is used correctly to mark the boundary between the first sentence (“In...walls”) and the second sentence (“With…techniques”), which starts with a supplementary phrase. Choice A is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice B is incorrect because it results in a run-on sentence. The sentences (“In...walls” and “with...paintings”) are fused without punctuation and/or a conjunction. Choice C is incorrect. Without a comma preceding it, the conjunction “so” can’t be used in this way to join sentences."}, {"key": "1a-5", "label": "1a.5", "diff": "Hard", "src": "official", "oid": "5bed774c", "stem": "Philosopher Peter Kivy was a leading figure in musical ______ evidenced by his belief that instead of evoking particular emotions, such as sadness or joy, compositions elicit a listener’s emotional response to the structure and artistry of the music itself, Kivy’s approach to the study of music was decidedly formalist.", "choices": ["aesthetics as", "aesthetics and as", "aesthetics, as", "aesthetics. As"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"Philosopher...aesthetics\") and another (\"As...formalist\"). The long adverbial element \"as evidenced...itself\" modifies the content in the following clause to support the claim that Kivy’s approach was formalist. Choice A is incorrect because it results in a run-on sentence. The sentences (\"Philosopher...aesthetics\" and \"As…formalist\") are fused without punctuation and/or a conjunction. Choice B is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join sentences. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences."}, {"key": "1a-6", "label": "1a.6", "diff": "Hard", "src": "official", "oid": "73a6603c", "stem": "On sunny days, dark rooftops absorb solar energy and convert it to unwanted heat, raising the surrounding air ______ a light-colored covering to an existing dark roof, either by attaching prefabricated reflective sheets or spraying on a paint-like coating, helps combat this effect.", "choices": ["temperature; by adding", "temperature, adding", "temperature. Adding", "temperature by adding"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between the first sentence (“On…temperature”) and the second sentence (“Adding…effect”). The gerund phrase beginning with “adding” is the subject of the second sentence, and the verb phrase “helps combat this effect” describes what adding a light-colored covering can do. Choice A is incorrect because a semicolon can’t be used in this way to join the sentence “On...temperature” and the supplementary phrases that follow. Doing so leaves the verb phrase “helps combat” without a subject and thus results in a grammatically unconventional sentence. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice D is incorrect. This choice results in a confusing and illogical sentence that suggests that adding a light-colored covering to an existing dark roof raises the temperature of the surrounding air. Furthermore, it creates ambiguity by leaving the verb phrase “helps combat” without a subject (so it isn’t clear what helps combat the effect)."}, {"key": "1a-7", "label": "1a.7", "diff": "Hard", "src": "official", "oid": "ba8ebf49", "stem": "The poem Beowulf begins with the word “hwæt,” which is an Old English ______ as “hark!” or “listen!” in some versions, the word was playfully rendered as “bro!” by Maria Dahvana Headley in her 2020 translation of the poem.", "choices": ["exclamation, translated", "exclamation and translated", "exclamation translated", "exclamation. Translated"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"The poem…exclamation\") and another sentence that begins with a supplementary element (\"Translated…poem\"). The supplementary element \"translated as ‘hark!’ or ‘listen!’ in some versions\" modifies the subject of the second sentence, \"the word\" (referring to hwæt). Choice A is incorrect because it results in a comma splice after \"exclamation.\" A comma can’t be used in this way to mark the boundary between sentences. Choice B is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join sentences. Choice C is incorrect because it results in a comma splice after \"versions.\" A comma can’t be used in this way to mark the boundary between sentences."}, {"key": "1a-t1", "label": "1a.8", "diff": "Medium", "src": "practice", "oid": "", "stem": "Because the ancient city of Termez sat at a crossing of the Amu ______ became an important stop for merchants traveling between Central and South Asia.", "choices": ["Darya River. It", "Darya River; it", "Darya River, it", "Darya River it"], "answer": 2, "rationale": "Choice C is the best answer. “Because…River” is a dependent clause: it cannot stand alone as a sentence. A comma correctly joins it to the main clause “it became…Asia.” Choice A is incorrect because the period turns “Because…River” into a sentence fragment. A dependent clause can’t stand alone. Choice B is incorrect because a semicolon can only join two main clauses, and “Because…River” is a dependent clause. Choice D is incorrect because a comma is needed after a long introductory dependent clause."}, {"key": "1a-8", "label": "1a.9", "diff": "Hard", "src": "official", "oid": "952fd392", "stem": "Alberto Gabriele, author of Reading Popular Culture in Victorian Print, tracks the transnational dissemination of works by author Mary Elizabeth Braddon via the magazine ______ from 1866 to 1899 and distributed throughout the Australian cities of Melbourne, Adelaide, and Hobart; the continental European cities of Brussels, Paris, and Turin; and cities in Turkey, India, and Jamaica, this magazine helped make Braddon’s serialized novels globally available.", "choices": ["Belgravia; published", "Belgravia. Published", "Belgravia published", "Belgravia, published"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between the first sentence (“Alberto...Belgravia”) and the second (“Published...available”). The participial phrase beginning with “published” contains a complex series punctuated with commas and semicolons (“the Australian cities of Melbourne, Adelaide, and Hobart; the continental European cities of Brussels, Paris, and Turin; and cities in Turkey, India, and Jamaica”), and this participial phrase modifies the subject of the second sentence, “this magazine.” Choice A is incorrect. Using a semicolon to join two main clauses in this way in combination with the semicolons that separate the items in the complex series would result in an ambiguous and confusing sentence. Choice C is incorrect because it results in a comma splice. With no punctuation after “Belgravia,” the participial phrase “published...Jamaica” reads as an integrated modifier within the noun phrase “the magazine Belgravia,” and the first main clause (“Alberto...Jamaica”) is then joined to a second main clause (“this...available”) using only a comma. A comma can’t be used in this way to join two main clauses. Choice D is incorrect because it results in a comma splice. A comma can’t be used in this way to join two main clauses."}, {"key": "1a-t2", "label": "1a.10", "diff": "Medium", "src": "practice", "oid": "", "stem": "In the early 1970s, engineers at the Nurek Dam began testing the first ______ recorded the results in a detailed technical report.", "choices": ["turbines and", "turbines. And", "turbines, and,", "turbines; and"], "answer": 0, "rationale": "Choice A is the best answer. The sentence has one subject (“engineers”) with two verbs (“began” and “recorded”). Nothing should separate the two parts of this compound predicate, so no comma is needed before “and.” Choice B is incorrect because the period leaves “And recorded the results…” as a fragment with no subject. Choice C is incorrect because there is no second main clause here, and a comma after “and” is never correct in this position. Choice D is incorrect because a semicolon must join two main clauses, but “recorded the results…” has no subject."}, {"key": "1a-9", "label": "1a.11", "diff": "Hard", "src": "official", "oid": "aab74a3b", "stem": "Researcher Lin Zhi developed a process for increasing the tensile strength—measured in gigapascals, or GPa—of silkworm ______ dissolving and reweaving the silk in a solution of iron metal ions, zinc, and sugar, Zhi increased the amount of force required to stretch it from approximately 0.5 GPa to 2 GPa.", "choices": ["silk, by", "silk by", "silk and by", "silk. By"], "answer": 3, "rationale": "Choice D is the best answer. The independent clauses \"researcher Lin Zhi…silk\" and \"by dissolving…2 GPa\" can be grammatically separated by a period. They can stand alone as sentences, and this is the only choice that lets them do that. Choice A is incorrect. This choice results in a grammar error called a comma splice. \"Researcher Lin Zhi…silk\" and \"by dissolving…2 GPa\" are both independent clauses. They need to either be separated with punctuation like a period or a semicolon, or they need to be connected by a comma and a coordinating conjunction like \"and.\" A comma alone isn’t enough. Choice B is incorrect. This choice results in a grammar error called a run-on sentence. \"Researcher Lin Zhi…silk\" and \"by dissolving…2 GPa\" are both independent clauses. They need to either be separated with punctuation like a period or a semicolon, or they need to be connected by a comma and a coordinating conjunction like \"and.\" Choice C is incorrect. This choice results in a grammar error called a run-on sentence. \"Researcher Lin Zhi…silk\" and \"by dissolving…2 GPa\" are both independent clauses. The coordinating conjunction \"and\" isn’t enough to link them by itself. We need a comma, too."}, {"key": "1a-t3", "label": "1a.12", "diff": "Hard", "src": "practice", "oid": "", "stem": "Ulugh Beg’s observatory in Samarkand housed a giant marble sextant with a radius of about 40 ______ astronomers to measure the positions of stars with remarkable precision.", "choices": ["meters. Allowing", "meters; allowing", "meters allowing", "meters, allowing"], "answer": 3, "rationale": "Choice D is the best answer. “allowing astronomers…precision” is a participial phrase, not a main clause (it has no subject and no finite verb). A comma correctly attaches it to the main clause. Choice A is incorrect because the period turns “Allowing astronomers…precision” into a fragment: it has no subject and no finite verb. Choice B is incorrect because a semicolon must join two main clauses, but “allowing astronomers…” is only a participial phrase. Choice C is incorrect because without a comma, “allowing” seems to describe “meters” rather than the whole clause about the sextant."}, {"key": "1a-10", "label": "1a.13", "diff": "Hard", "src": "official", "oid": "0fa289a7", "stem": "In 1955, Indian Bengali filmmaker Satyajit Ray released his first movie, Pather ______ quiet black-and-white drama about a family in rural India, Ray’s film was quite different from the loud, colorful action-romance movies that were popular at the time.", "choices": ["Panchali a", "Panchali, which was a", "Panchali, a", "Panchali. A"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"In…Panchali\") and another (\"A quiet…time\"). The phrase beginning with \"a quiet\" modifies the subject of the next sentence, \"Ray’s film.\" Choice A is incorrect because it results in a run-on sentence. The sentences are fused without punctuation and/or a conjunction. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences."}, {"key": "1a-t4", "label": "1a.14", "diff": "Hard", "src": "practice", "oid": "", "stem": "The pottery shards recovered from the hillside near the excavation ______ that the area was inhabited far earlier than historians had assumed.", "choices": ["site. Suggest", "site suggest", "site, suggest", "site; suggest"], "answer": 1, "rationale": "Choice B is the best answer. “The pottery shards…site” is the long subject and “suggest” is its verb. No punctuation belongs between a subject and its verb. Choice A is incorrect because the period cuts the subject off from its verb, leaving two fragments. Choice C is incorrect because a single comma should not separate a subject from its verb. Choice D is incorrect because a semicolon must join two main clauses; here it separates a subject from its verb."}]}, {"code": "1b", "day": 1, "title": "Dependent clause + comma", "items": [{"key": "1b-1", "label": "1b.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "Although the Atacama Desert receives almost no ______ some plants survive there by absorbing moisture from coastal fog.", "choices": ["rain,", "rain;", "rain, but", "rain. Some"], "answer": 0, "rationale": "Choice A is the best answer. “Although…rain” is a subordinate (dependent) clause, and “some plants survive…fog” is the main clause. A comma marks the boundary between an introductory subordinate clause and the main clause. Choice B is incorrect because a semicolon joins two main clauses, and “Although…rain” is not a main clause. Choice C is incorrect because adding “but” turns the second part into a coordinated element, leaving the sentence with no main clause. Choice D is incorrect because it leaves “Although…rain” as a sentence fragment."}, {"key": "1b-2", "label": "1b.2", "diff": "Easy", "src": "practice", "oid": "", "stem": "Because the bridge’s steel cables expand in hot ______ engineers designed the deck with small gaps that allow it to lengthen safely.", "choices": ["weather, so", "weather,", "weather;", "weather. So"], "answer": 1, "rationale": "Choice B is the best answer. “Because…weather” is a subordinate clause, so a comma alone correctly separates it from the main clause (“engineers designed…safely”). Choice A is incorrect because “because” and “so” can’t both be used; together they leave the sentence without a main clause. Choice C is incorrect because a semicolon can’t follow a subordinate clause. Choice D is incorrect because it creates a fragment (“Because…weather.”)."}, {"key": "1b-3", "label": "1b.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "The museum closed its west wing for three ______ workers replaced the gallery’s aging climate-control system.", "choices": ["months while", "months; while", "months. While", "months, while,"], "answer": 0, "rationale": "Choice A is the best answer. The main clause (“The museum…months”) is followed by a subordinate clause (“while workers…system”) that tells when the closing happened. No punctuation is needed between a main clause and a following subordinate clause of time. Choice B is incorrect because a semicolon can’t introduce a subordinate clause. Choice C is incorrect because it makes “While workers…system” a fragment. Choice D is incorrect because the comma after “while” separates the conjunction from its own clause."}, {"key": "1b-4", "label": "1b.4", "diff": "Medium", "src": "practice", "oid": "", "stem": "Even though the novel was rejected by eleven ______ the author kept revising it, and it eventually became a bestseller.", "choices": ["publishers but", "publishers,", "publishers;", "publishers, but"], "answer": 1, "rationale": "Choice B is the best answer. “Even though…publishers” is a subordinate clause, and a comma correctly separates it from the main clause that follows (“the author kept revising it”). Choices A and D are incorrect because “even though” and “but” can’t both be used; together they leave the first part of the sentence without a main clause. Choice C is incorrect because a semicolon can’t follow a subordinate clause."}, {"key": "1b-5", "label": "1b.5", "diff": "Medium", "src": "practice", "oid": "", "stem": "Once the volcanic ash had settled over the ______ Pompeii remained buried and largely forgotten for nearly seventeen centuries.", "choices": ["city;", "city, and", "city,", "city"], "answer": 2, "rationale": "Choice C is the best answer. “Once…city” is an introductory subordinate clause, so a comma is used before the main clause (“Pompeii remained…centuries”). Choice A is incorrect because a semicolon can’t follow a subordinate clause. Choice B is incorrect because “once” and “and” can’t both link the same two parts; the result has no main clause. Choice D is incorrect because a long introductory clause needs a comma to mark where the main clause begins."}, {"key": "1b-6", "label": "1b.6", "diff": "Medium", "src": "official", "oid": "333b2b65", "stem": "While one requires oxygen and one does ______ and anaerobic respiration are both forms of cellular respiration—that is, they are processes by which cells break down glucose to use as energy.", "choices": ["not aerobic", "not. Aerobic", "not, aerobic", "not; aerobic"], "answer": 2, "rationale": "Choice C is the best answer. A comma is the appropriate way to link the dependent clause “While...not” and the independent clause that follows. Choice A is incorrect. This choice creates a run-on sentence error. “While...not” is a dependent clause, which must be separated from the independent clause that follows with some sort of punctuation. Choice B is incorrect. This choice creates a sentence fragment. “While one requires oxygen and one does not” isn’t an independent clause, so it can’t stand alone as a complete sentence. Choice D is incorrect. This choice creates a punctuation error. “While one requires oxygen and one does not” isn’t an independent clause, so it can’t be linked to the clause that follows with a semicolon."}, {"key": "1b-7", "label": "1b.7", "diff": "Medium", "src": "official", "oid": "c21df211", "stem": "In 1959, the film industry debuted Smell-O-Vision. Theaters were fitted with specialized vents that emitted odors at specific points in a ______ as the scent of roses when roses appeared in a scene. Smell-O-Vision failed to impress, however, with one reviewer declaring it “briefly weird and not very interesting.”", "choices": ["movie such", "movie; such", "movie. Such", "movie, such"], "answer": 3, "rationale": "Choice D is the best answer. The comma appropriately separates the nonessential descriptive aside \"such as…scene\" from the independent clause \"Theaters were…movie.\" Since the descriptive example of roses isn’t necessary for the sentence to function, it needs to be set off with punctuation. Choice A is incorrect. This choice results in a run-on sentence. Since the example of roses isn’t necessary for the sentence to function, the descriptive aside \"such as…scene\" needs to be separated from the preceding independent clause with some sort of punctuation. Choice B is incorrect. This choice creates a punctuation error. A semicolon can only be used to separate two independent clauses, but \"such…scene\" is not an independent clause and couldn’t stand on its own as a sentence. Choice C is incorrect. This choice results in a sentence fragment. The descriptive aside \"Such…scene\" is not an independent clause and can’t stand on its own as a sentence."}, {"key": "1b-8", "label": "1b.8", "diff": "Hard", "src": "official", "oid": "8a264a54", "stem": "With a blend of traditional design elements, such as arched Gothic ceilings, and modern ones, such as floor-to-ceiling ______ design splits the difference between old and new, a mixture that is increasingly seen in home interiors in the US.", "choices": ["windows; transitional", "windows—transitional", "windows. Transitional", "windows, transitional"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a comma to mark the boundary between the introductory subordinate clause (\"With…windows\") and the main clause (\"transitional design splits the difference between old and new\"). Choice A is incorrect because a semicolon can’t be used in this way to separate the subordinate clause (\"With…windows\") from the main clause (\"transitional…new\"). Choice B is incorrect because a dash can’t be used in this way to separate the subordinate clause (\"With…windows\") from the main clause (\"transitional…new\"). Choice C is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with \"with.\""}]}, {"code": "1c", "day": 1, "title": "Comma + and / but / so", "items": [{"key": "1c-1", "label": "1c.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "Octopuses have three ______ two of them pump blood through the gills, while the third circulates it to the rest of the body.", "choices": ["hearts, and", "hearts and", "hearts,", "hearts and,"], "answer": 0, "rationale": "Choice A is the best answer. Two main clauses (“Octopuses have three hearts” and “two of them pump blood…body”) are joined by a comma plus the coordinating conjunction “and.” Choice B is incorrect because two long main clauses joined by “and” need a comma before the conjunction. Choice C creates a comma splice. Choice D places the comma after “and” instead of before it."}, {"key": "1c-2", "label": "1c.2", "diff": "Easy", "src": "practice", "oid": "", "stem": "The first transatlantic telegraph cable was completed in ______ it failed after only three weeks of service.", "choices": ["1858, but", "1858 but,", "1858, but,", "1858 but"], "answer": 0, "rationale": "Choice A is the best answer. A comma followed by the coordinating conjunction “but” correctly joins the two main clauses. Choices B and C are incorrect because no comma should follow “but.” Choice D is incorrect because a comma is conventionally used before a coordinating conjunction joining two main clauses."}, {"key": "1c-t1", "label": "1c.3", "diff": "Medium", "src": "practice", "oid": "", "stem": "The poet Zulfiya published her first collection of poems in ______ went on to edit a major women’s magazine for decades.", "choices": ["1932, and", "1932 and", "1932; and", "1932. And"], "answer": 1, "rationale": "Choice B is the best answer. The sentence has one subject (“Zulfiya”) and two verbs (“published” and “went”). In a compound predicate, no comma goes before “and.” Choice A is incorrect because a comma before “and” is used only when “and” joins two main clauses. “went on to edit…” has no subject, so it isn’t a main clause. Choice C is incorrect because a semicolon must join two main clauses, but “went on to edit…” has no subject. Choice D is incorrect because the period leaves “And went on to edit…” as a fragment with no subject."}, {"key": "1c-3", "label": "1c.4", "diff": "Medium", "src": "official", "oid": "aecdb820", "stem": "Featuring works by the photographers Lola Álvarez Bravo and Else “Yva” Neuländer-Simon, the 2021 exhibition The New Woman Behind the Camera set out to provide a wide-ranging overview of photography by women in the 1920s through the ______ given the collection’s breadth of more than 120 photos, its efforts were largely successful.", "choices": ["1950s, and", "1950s and", "1950s", "1950s,"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and the coordinating conjunction \"and\" to join the first main clause (\"Featuring...1950s\") and the second main clause (\"given...successful\"). Choice B is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice C is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice D is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."}, {"key": "1c-4", "label": "1c.5", "diff": "Medium", "src": "official", "oid": "a12e3b8a", "stem": "Customers who are satisfied with how a company resolves a service issue may regard that company more positively than they would if no such issue had occurred. This idea is known as the service recovery ______ research suggests that it has important implications for customer loyalty and retention.", "choices": ["paradox,", "paradox", "paradox, and", "paradox and,"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and the coordinating conjunction \"and\" to join the first main clause (\"This idea…paradox\") and the second main clause (\"research… retention\"). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice B is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice D is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction, not after it."}, {"key": "1c-t2", "label": "1c.6", "diff": "Medium", "src": "practice", "oid": "", "stem": "The museum’s collection includes carved wooden doors from ______ painted ceramic tiles from Bukhara.", "choices": ["Khiva, and", "Khiva; and", "Khiva. And", "Khiva and"], "answer": 3, "rationale": "Choice D is the best answer. “and” joins just two nouns (“doors” and “tiles”), not two main clauses, so no punctuation is needed. Choice A is incorrect because a comma before “and” is not used between only two items. Choice B is incorrect because a semicolon can’t separate two items of a simple pair. Choice C is incorrect because the period leaves “And painted ceramic tiles from Bukhara” as a fragment."}, {"key": "1c-5", "label": "1c.7", "diff": "Medium", "src": "official", "oid": "083a35dc", "stem": "Po’Pay was a Tewa leader from Ohkay Owingeh, a pueblo located about twenty-five miles north of present-day Santa Fe, New Mexico. He was instrumental in organizing the Pueblo Revolt of ______ as a result of his leadership, the Spanish colonizers were expelled from the region for a time.", "choices": ["1680", "1680 and", "1680,", "1680, and"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and the coordinating conjunction “and” to join the first main clause (“He…1680”) and the second main clause (“as…time”). Choice A is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice B is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice C is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."}, {"key": "1c-6", "label": "1c.8", "diff": "Medium", "src": "official", "oid": "b6560e5a", "stem": "Materials scientist Marie-Agathe Charpagne and her colleagues believed they could improve on the multicomponent alloy NiCoCr, an equal-proportions mixture of nickel (Ni), cobalt (Co), and chromium (Cr), by replacing chromium with ruthenium ______ the alloy that resulted, NiCoRu, turned out to be an unsuitable replacement for NiCoCr.", "choices": ["(Ru)", "(Ru) but", "(Ru),", "(Ru), but"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the coordination of main clauses. This choice correctly uses a comma and the coordinating conjunction “but” to join the first main clause (“Materials…Ru”) and the second main clause (“the alloy…NiCoCr”). Choice A is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice B is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice C is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."}, {"key": "1c-t3", "label": "1c.9", "diff": "Medium", "src": "practice", "oid": "", "stem": "Although honeybees can see ultraviolet ______ they cannot see the color red.", "choices": ["light,", "light, but", "light, and", "light; but"], "answer": 0, "rationale": "Choice A is the best answer. “Although…light” is a dependent clause. A comma alone correctly joins it to the main clause “they cannot see the color red.” Choice B is incorrect because “Although” already shows the contrast. Using “although” and “but” together is redundant and ungrammatical. Choice C is incorrect because “Although” makes the first part dependent; adding “and” makes the sentence ungrammatical. Choice D is incorrect because a semicolon can’t follow a dependent clause, and “but” repeats the contrast already signaled by “although.”"}, {"key": "1c-7", "label": "1c.10", "diff": "Hard", "src": "official", "oid": "7ce4ee13", "stem": "After immigrating from Mexico and obtaining U.S. citizenship, Octaviano Ambrosio Larrazolo entered politics, earning a reputation for being a fervent defender of Hispanic civil rights. In 1919 Larrazolo was elected governor of ______ in 1928 he became the nation’s first Hispanic U.S. Senator.", "choices": ["New Mexico and", "New Mexico,", "New Mexico, and", "New Mexico"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and the coordinating conjunction \"and\" to join the first main clause (\"In 1919 Larrazolo was elected governor of New Mexico\") and the second main clause (\"in 1928 he became the nation’s first Hispanic US Senator\"). Choice A is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice B is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice D is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."}, {"key": "1c-8", "label": "1c.11", "diff": "Hard", "src": "official", "oid": "59094d87", "stem": "The Tantaquidgeon Museum in Uncasville, Connecticut, was founded in 1931 with the goal of showcasing the culture and history of the Mohegan ______ today, nearly a century later, it is the oldest Native-owned and -operated museum in the country.", "choices": ["Tribe, and", "Tribe", "Tribe and", "Tribe,"], "answer": 0, "rationale": "Choice A is the best answer. This choice uses a comma and a coordinating conjunction (“and”) to join two independent clauses (“The Tantaquidgeon…Tribe” and “Today…country”). Choice B is incorrect. This choice results in a grammar error known as a run-on sentence. The clauses before and after “Tribe” are both independent, so they need to be separated with some sort of punctuation. Choice C is incorrect. This choice results in a grammar error known as a run-on sentence. The clauses before and after “and” are both independent, so they can’t be linked with just a conjunction. A comma would also be required. Choice D is incorrect. This choice results in a grammar error called a comma splice. The clauses before and after “Tribe” are both independent, so they can’t be linked with just a comma. A coordinating conjunction like “and” or “but” would also be required."}, {"key": "1c-t4", "label": "1c.12", "diff": "Hard", "src": "practice", "oid": "", "stem": "After examining the soil layers, the researchers concluded that the river had shifted ______ that the ancient settlement had been abandoned as a result.", "choices": ["course, and", "course; and", "course and", "course, so"], "answer": 2, "rationale": "Choice C is the best answer. “and” joins two “that” clauses, both objects of “concluded.” Since these are not two main clauses, no comma is needed. Choice A is incorrect because a comma before “and” is used only between two main clauses. Here “and” joins two “that” clauses that both depend on “concluded.” Choice B is incorrect because a semicolon must join two main clauses; neither “that” clause is a main clause. Choice D is incorrect because “so” illogically changes the meaning: the text says the researchers concluded two things, not that one happened in order to cause the other."}]}, {"code": "2a", "day": 2, "title": "Semicolon and ; however,", "items": [{"key": "2a-1", "label": "2a.1", "diff": "Easy", "src": "practice", "oid": "", "stem": "Mount Everest is the highest mountain above sea ______ Mauna Kea is taller when measured from its base on the ocean floor.", "choices": ["level; however,", "level, however,", "level however,", "level; however"], "answer": 0, "rationale": "Choice A is the best answer. Two main clauses are joined with a semicolon, and the transition “however” at the start of the second clause is followed by a comma. Choice B is incorrect because a comma can’t join two main clauses, even with “however” (comma splice). Choice C creates a run-on. Choice D is missing the comma after “however.”"}, {"key": "2a-2", "label": "2a.2", "diff": "Medium", "src": "practice", "oid": "", "stem": "Early cameras required subjects to stay motionless for long ______ photographers sometimes used hidden metal stands to hold people’s heads in place.", "choices": ["periods, therefore,", "periods; therefore,", "periods; therefore", "periods therefore,"], "answer": 1, "rationale": "Choice B is the best answer. The two main clauses are joined by a semicolon, and “therefore” is followed by a comma because it introduces the second clause. Choice A creates a comma splice. Choice C omits the comma after “therefore.” Choice D creates a run-on sentence."}, {"key": "2a-3", "label": "2a.3", "diff": "Medium", "src": "official", "oid": "548f4956", "stem": "It is generally true that technological change is a linear process, in which once-useful technologies are replaced by new and better ______ the reawakening of interest in the steam engine (from advocates of carbon-neutral rail travel) reminds us that ostensibly obsolete technologies may be brought back into service to address society’s changing needs.", "choices": ["ones, even so;", "ones even so,", "ones; even so,", "ones, even so,"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice uses a semicolon in a conventional way to join the first main clause (“It is…ones”) and the second main clause (“even so…needs”). Furthermore, the placement of the semicolon after “ones” indicates that the supplementary phrase “even so” modifies the following clause (“the reawakening...needs”), resulting in the most logical and grammatically complete sentence. With this punctuation, the sentence logically indicates that the recent interest in an old technology like steam engines is despite the fact that technological change typically seeks out new technologies. Choice A is incorrect because it results in a confusing and illogical sentence. Placing the semicolon after “so” indicates that the supplementary element “even so” modifies the first clause of the sentence, which doesn’t make sense in this context. Choice B is incorrect because it results in a run-on sentence. It fails to mark the boundary between the two main clauses with appropriate punctuation. Choice D is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join the two main clauses of the sentence."}, {"key": "2a-t1", "label": "2a.4", "diff": "Medium", "src": "practice", "oid": "", "stem": "While most deserts are ______ Antarctica, which receives very little precipitation, is technically the largest desert on Earth.", "choices": ["hot;", "hot; however,", "hot. However,", "hot,"], "answer": 3, "rationale": "Choice D is the best answer. “While most deserts are hot” is a dependent clause, so a comma alone correctly joins it to the main clause. Choice A is incorrect because a semicolon must join two main clauses, but “While most deserts are hot” is a dependent clause. Choice B is incorrect because a semicolon can’t follow a dependent clause, and “however” repeats the contrast already signaled by “while.” Choice C is incorrect because the period turns “While most deserts are hot” into a fragment."}, {"key": "2a-4", "label": "2a.5", "diff": "Medium", "src": "official", "oid": "ad046778", "stem": "To humans, it does not appear that the golden orb-weaver spider uses camouflage to capture its ______ the brightly colored arachnid seems to wait conspicuously in the center of its large circular web for insects to approach. Researcher Po Peng of the University of Melbourne has explained that the spider’s distinctive coloration may in fact be part of its appeal.", "choices": ["prey, rather,", "prey rather,", "prey, rather;", "prey; rather,"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the coordination of main clauses within a sentence. The semicolon is correctly used to join the first main clause (“To humans…prey”) and the second main clause (“rather…approach”). Further, the comma after the adverb “rather” is correctly used to separate the adverb from the main clause (“the brightly…approach”) it modifies, logically indicating that the information in this clause (how the spider’s behavior appears to humans) is contrary to the information in the previous clause (how the spider’s behavior does not appear to humans). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice B is incorrect because it results in a run-on sentence. The two main clauses are fused without appropriate punctuation and/or a conjunction. Choice C is incorrect. Placing the comma between the first main clause “To humans…prey” and the adverb “rather” illogically indicates that the information in the first main clause is contrary to what came before, which doesn’t make sense in this context."}, {"key": "2a-5", "label": "2a.6", "diff": "Medium", "src": "official", "oid": "a153ad6a", "stem": "While light is known as one of the fastest-moving substances, it slows down when passing through some types of matter. One such type of matter is a form of cooled, condensed gas called a Bose-Einstein condensate ______ Dutch physicist Lene Hau famously used a BEC to slow a beam of light to a complete halt.", "choices": ["(BEC),", "(BEC) and", "(BEC);", "(BEC)"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a semicolon to join the first main clause (\"One…(BEC)\") and the second main clause (\"Dutch…halt\"). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice B is incorrect because it results in a run-on sentence. Without a comma preceding it, a conjunction can’t be used in this way to join two main clauses. Choice D is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."}, {"key": "2a-6", "label": "2a.7", "diff": "Hard", "src": "official", "oid": "c06af4d8", "stem": "Sociologist Alton Okinaka sits on the review board tasked with adding new sites to the Hawai‘i Register of Historic Places, which includes Pi‘ilanihale Heiau and the ‘Ōpaeka‘a Road Bridge. Okinaka doesn’t make such decisions ______ all historical designations must be approved by a group of nine other experts from the fields of architecture, archaeology, history, and Hawaiian culture.", "choices": ["single-handedly, however;", "single-handedly; however,", "single-handedly, however,", "single-handedly however"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the punctuation of a supplementary word or phrase between two main clauses. This choice correctly uses a comma to separate the supplementary adverb “however” from the preceding main clause (“Okinaka doesn’t…single-handedly”) and a semicolon to join the next main clause (“all…culture”) to the rest of the sentence. Further, placing the semicolon after “however” correctly indicates that the information in the preceding main clause (Okinaka doesn’t make such decisions single-handedly) is contrary to what might be assumed from the information in the previous sentence (Okinaka sits on the review board that adds new sites to the Hawaii Register of Historic Places). Choice B is incorrect because placing the semicolon after “single-handedly” and the comma after “however” illogically indicates that the information in the next main clause (all historical designations must be approved by a group of experts) is contrary to the information in the previous clause (Okinaka doesn’t make such decisions single-handedly). Choice C is incorrect because it results in a comma splice. Commas can’t be used in this way to punctuate a supplementary word or phrase between two main clauses. Choice D is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."}, {"key": "2a-t2", "label": "2a.8", "diff": "Medium", "src": "practice", "oid": "", "stem": "The engineers’ final ______ was not approved until the following spring.", "choices": ["design; however,", "design, however,", "design. However,", "design however"], "answer": 1, "rationale": "Choice B is the best answer. “however” interrupts the main clause between the subject (“design”) and the verb (“was”). An interrupting word is set off by a pair of commas. Choice A is incorrect because the semicolon cuts the subject off from its verb, leaving “however, was not approved…” as a fragment. Choice C is incorrect because the period separates the subject from its verb, creating two fragments. Choice D is incorrect because an interrupting “however” must be set off with commas."}, {"key": "2a-7", "label": "2a.9", "diff": "Hard", "src": "official", "oid": "a05cc490", "stem": "With the development of new technologies that use natural resources more efficiently, the overall consumption of those resources might be expected to decrease. Economists have observed that improvements in efficiency often correlate negatively with resource ______ efficiency gains, lowering the cost of use, may increase demand to the extent that resource consumption ultimately rises.", "choices": ["conservation, though,", "conservation; though", "conservation, though;", "conservation, though"], "answer": 2, "rationale": "Choice C is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a comma to separate the supplementary adverb \"though\" from the preceding main clause (\"Economists…conservation\") and uses a semicolon to join the next main clause (\"efficiency gains…rises\") to the rest of the sentence. Further, placing the semicolon after \"though\" indicates that the information in the preceding main clause (\"improvements in efficiency often correlate negatively with resource conservation\") is contrary to what might be assumed from the information in the previous sentence (resource consumption would be expected to decrease with the development of new, more efficient technologies). Choice A is incorrect because it results in a comma splice. Commas can’t be used in this way to punctuate a supplementary word or phrase between two main clauses. Choice B is incorrect because it fails to mark the boundary between the two main clauses (\"Economists...though\" and \"efficiency gains....rises\") with appropriate punctuation. Moreover, placing the semicolon after \"conservation\" illogically indicates that the information in the next clause (gains in efficiency may lead to an increase in resource consumption) is contrary to the information in the previous clause (\"improvements in efficiency often correlate negatively with resource conservation\"). Choice D is incorrect because placing a comma after \"conservation\" illogically indicates that the information in the next clause (gains in efficiency may lead to an increase in resource consumption) is contrary to the information in the previous clause (\"improvements in efficiency often correlate negatively with resource conservation\")."}, {"key": "2a-8", "label": "2a.10", "diff": "Hard", "src": "official", "oid": "81f43b85", "stem": "For the past 20 million years, Earth’s magnetic poles in the far north and far south have remained roughly where they are today. This has not always been the ______ throughout geologic history, Earth’s magnetic poles have swapped places several times through a process called polar wandering.", "choices": ["case, though", "case, though,", "case; though,", "case, though;"], "answer": 3, "rationale": "Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. Placing the semicolon after the supplementary adverb “though” correctly indicates that the contrast in the text is between the information in the first sentence (that Earth’s magnetic poles have remained fixed for the past 20 million years) and the initial clause of the second sentence (“This has not always been the case”), rather than between the two clauses of the second sentence. Choice A is incorrect. Using the adverb “though” as the head of a subordinate clause illogically indicates that the information in the previous main clause (“This…case”) is contrary to the information in the subordinate clause. Instead, the information in the second clause (that Earth’s magnetic poles have swapped places several times) elaborates on the statement made in the previous clause (that Earth’s magnetic poles are not as fixed as they may seem). Choice B is incorrect because it results in a comma splice. Commas can’t be used in this way to punctuate a supplementary word or phrase between two main clauses. Choice C is incorrect. Using a semicolon after “case” places the adverb “though” inside the second main clause (“throughout…wandering”), illogically indicating that the information in the previous main clause is contrary to the information in the second one. Instead, the information in the second main clause (that Earth’s magnetic poles have swapped places several times) elaborates on the statement made in the previous clause (that Earth’s magnetic poles are not as fixed as they may seem)."}, {"key": "2a-9", "label": "2a.11", "diff": "Hard", "src": "official", "oid": "e41018de", "stem": "In 1977, legendary Puerto Rican performer Rita Moreno won an Emmy Award, making her one of the rare talents to earn the highest honors in television, music, film, and stage entertainment—the Emmy, Grammy, Oscar, and Tony ______ the achievement is known as “winning the EGOT.”", "choices": ["awards, respectively;", "awards; respectively", "awards, respectively—", "awards, respectively,"], "answer": 0, "rationale": "Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a comma to separate the supplementary adverb “respectively” from the rest of the supplementary element introduced by the dash after “entertainment” (“the Emmy...awards”), and it uses a semicolon to join the first main clause (“In...respectively”) and the second main clause (“the achievement...EGOT’”). Choice B is incorrect because placing the semicolon after “awards” illogically separates the supplementary adverb “respectively” from the supplementary element it belongs to (“the Emmy...awards”) and attaches it to the following main clause (“the achievement...EGOT’”), resulting in a confusing and ungrammatical sentence. Choice C is incorrect. The dash after “respectively” pairs with the dash after “entertainment” to close the supplementary element (“the Emmy...respectively”), so it can’t also serve to mark the boundary between the two main clauses (“In...respectively” and “the achievement...EGOT’”). The result fails to mark that boundary with appropriate punctuation. Choice D is incorrect because it results in a comma splice. Without a conjunction following it, the comma after “respectively” can’t be used in this way to join the first main clause (“In...respectively”) and the second main clause (“the achievement...EGOT’”)."}, {"key": "2a-t3", "label": "2a.12", "diff": "Medium", "src": "practice", "oid": "", "stem": "The expedition carried only what was ______ water, dried fruit, a first-aid kit, and a satellite phone.", "choices": ["essential;", "essential, and", "essential:", "essential. Water,"], "answer": 2, "rationale": "Choice C is the best answer. The main clause is followed by a list that explains what “what was essential” means. A colon correctly introduces such a list. Choice A is incorrect because a semicolon must join two main clauses, but the list that follows is not a main clause. Choice B is incorrect because “and” illogically joins a main clause to a list with no verb, leaving the list as a fragment. Choice D is incorrect because the period leaves the list “Water, dried fruit…phone” as a fragment with no verb."}, {"key": "2a-10", "label": "2a.13", "diff": "Hard", "src": "official", "oid": "3fee46f2", "stem": "Sociologist Todd Gitlin co-opted the term “recombinant,” normally used in reference to genetic engineering, to describe serialized television shows of the 1980s. Gitlin’s use of the term referenced TV studios’ practice of repackaging successful narrative formulas as new ______ even shows that varied only slightly from other shows still attracted sizeable audiences.", "choices": ["content, in that era", "content; in that era,", "content in that era,", "content, in that era,"], "answer": 1, "rationale": "Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. This choice uses a semicolon in a conventional way to join the first main clause (\"Gitlin’s…content\") and the second main clause beginning with a supplementary phrase (\"in… audiences\"). Further, placing a comma after \"era\" separates the supplementary phrase \"in that era\" from the rest of the main clause that follows (\"even…audiences\"). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Further, this choice fails to mark the boundary between the supplementary phrase \"in that era\" and the rest of the main clause that follows (\"even…audiences\"). Choice C is incorrect because it results in a run-on sentence. The two main clauses (\"Gitlin’s…content\" and \"in… audiences\") are fused without punctuation and/or a conjunction. Choice D is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."}, {"key": "2a-11", "label": "2a.14", "diff": "Hard", "src": "official", "oid": "235c8338", "stem": "That the expansionist appetites of colonial European powers had their sights set on his country was evident to Siam’s King ______ deterring those ambitions through international diplomacy and domestic reform wa
